<!doctype html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#2a1a12" />
<title>Laminated Sheet Mockup</title>
<meta name="description" content="Super Ninja's petal chart as the school's laminated sheet: a working mockup (design direction 1)." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;600;700;800&family=Luckiest+Guy&display=block" rel="stylesheet" />
<!--
  Design direction 1, "laminated sheet": the school's Extended Code chart itself, pinned to the dojo wall.
  A working mockup, not game code. Everything is in this one file; the art and sounds are the game's own
  (public/a/…, by relative path), and the petal data is CHART_PETALS / PETALS from src/content/flower.ts,
  dumped on 27 Sep 2026. Serve the repo root over http (CSS masks need same-origin images), then open
  /docs/scroll-design/laminated-sheet/?child=year1|reception|new  (&open=<petal id>, &at=<petal id>, &whole=1).
-->
<style>
:root {
  --ink: #2b1d14; --ink-soft: #5a4636; --paper: #fff4dc;
  --gold: #ffc53d; --gold-deep: #c98a00; --good: #3fbf6a; --good-deep: #1f7a41;
  --blossom: #ff7aa2; --blossom-deep: #d9477a;
  --font-letters: "Andika", "Comic Sans MS", system-ui, sans-serif;
  --font-ui: "Baloo 2", "Andika", system-ui, sans-serif;
  --faint-h: #85796e;  /* a spelling the game will teach, not met yet */
  --faint-x: #aea397;  /* a spelling this version can't teach */
  --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
  --sal: env(safe-area-inset-left); --sar: env(safe-area-inset-right);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: #2a1a12; font-family: var(--font-ui); color: var(--ink); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; border: 0; padding: 0; background: none; cursor: pointer; touch-action: manipulation; }
img { -webkit-user-drag: none; user-select: none; }

/* ---------- the stage: 1280×720, scaled to fit exactly as src/ui/ui.tsx Stage does */
.viewport { position: fixed; inset: 0; background: radial-gradient(ellipse at center, #4a3122 0%, #2a1a12 75%); }
.stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; contain: layout paint; background: #f3e6d2; }

/* the dojo wall behind the sheets: the game's dojo, washed pale and warm so the white sheets carry the screen */
.wall { position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(247, 236, 219, .80), rgba(250, 242, 229, .90) 18%, rgba(250, 242, 229, .90) 82%, rgba(247, 236, 219, .80)),
              url(../../../public/a/i/dojo_bg.webp) center 30% / cover; }

/* ---------- the scroll: the whole stage scrolls natively, top to bottom (only transform/opacity animate) */
.scroller { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  touch-action: pan-y; scrollbar-width: none; z-index: 1; }
.scroller::-webkit-scrollbar { display: none; }
.board { position: relative; width: 1280px; padding: 26px 0 40px 200px; }

/* a laminated A4 sheet: white paper, rounded corners, the clear film's edge, a soft sheen, two drawing pins */
.sheet { position: relative; width: 940px; background: #fffefc; border-radius: 16px; margin-bottom: 64px;
  padding: 22px 24px 18px; display: grid; grid-template-columns: repeat(4, 223px); grid-auto-rows: 420px;
  box-shadow: 0 0 0 9px rgba(255, 255, 255, .62), 0 0 0 10.5px rgba(128, 146, 168, .38), 0 22px 30px -16px rgba(74, 42, 20, .55);
  content-visibility: auto; contain-intrinsic-size: auto 892px 1680px; } /* the content box: padding comes on top */
.sheet:last-child { margin-bottom: 0; contain-intrinsic-size: auto 892px 1260px; }
.sheet::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3;
  background:
    linear-gradient(118deg, rgba(210, 225, 245, 0) 8%, rgba(210, 225, 245, .20) 13%, rgba(255, 255, 255, 0) 19%),
    linear-gradient(118deg, rgba(210, 225, 245, 0) 56%, rgba(210, 225, 245, .14) 60%, rgba(255, 255, 255, 0) 65%); }
.sheet::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 32px; pointer-events: none; z-index: 4;
  background:
    radial-gradient(circle at 40% 36%, rgba(255, 255, 255, .85) 0 3px, transparent 4px) left 14px top 0 / 30px 30px no-repeat,
    radial-gradient(circle at 50% 50%, var(--pin) 0 11px, var(--pin-d) 12px 13px, transparent 14px) left 14px top 0 / 30px 30px no-repeat,
    radial-gradient(circle at 40% 36%, rgba(255, 255, 255, .85) 0 3px, transparent 4px) right 14px top 0 / 30px 30px no-repeat,
    radial-gradient(circle at 50% 50%, var(--pin) 0 11px, var(--pin-d) 12px 13px, transparent 14px) right 14px top 0 / 30px 30px no-repeat; }

/* ---------- a petal: the chart's slim teardrop. The button is its whole cell (208×380 stage px).
   ::before = the wash of its colour (rises from the point as gems are won), ::after = the thin outline.
   Both are CSS masks of one SVG teardrop, so a petal is 2 + (its spellings) nodes, and never an SVG. */
.petal { position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 84px; }
.petal::before, .petal::after { content: ""; position: absolute; left: 23.5px; top: 36px; width: 176px; height: 380px; pointer-events: none;
  -webkit-mask: var(--m-fill) 0 0 / 100% 100% no-repeat; mask: var(--m-fill) 0 0 / 100% 100% no-repeat; }
.petal::before { background: linear-gradient(to top, var(--wash) calc(var(--fh) - 5px), var(--wash-d) calc(var(--fh) - 5px), var(--wash-d) var(--fh), transparent var(--fh)); }
.petal::after { background: var(--c); -webkit-mask-image: var(--m-line); mask-image: var(--m-line); z-index: 1; }
.petal.done { background: radial-gradient(ellipse 54% 46% at 50% 44%, var(--glow) 0%, transparent 100%); }
.petal.done::before { background: var(--wash); }
.petal:active { transform: scale(.97); }
.pic { position: absolute; left: 152px; top: -6px; width: 86px; height: 86px; object-fit: contain; z-index: 2; pointer-events: none; }

/* the spellings, stacked down the petal in Andika, as on the chart. Sizes come from the fit (--M, --F). */
.ln { position: relative; z-index: 2; font-family: var(--font-letters); line-height: 1; white-space: nowrap; pointer-events: none; font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
.ln.m { font-weight: 700; font-size: var(--M); height: calc(var(--M) * 1.08 + 11px); padding-top: calc(var(--M) * .02); color: var(--ink); }
.ln.m.w { height: calc(var(--M) * 1.08); }
.ln.f { font-weight: 400; font-size: var(--F); height: calc(var(--F) * 1.14); text-shadow: 0 0 2px #fff, 0 0 5px rgba(255, 255, 255, .9); }
.ln.h { color: var(--faint-h); }
.ln.x { color: var(--faint-x); }
.ln.hint { font-family: var(--font-letters); font-size: 24px; height: 30px; color: var(--ink-soft); }
.ln.hint b { color: var(--ink-c); }
/* charging: an energy bar under the letters fills with the petal's colour */
.ln.c::after, .ln.r::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: max(100%, 34px); translate: -50% 0; height: 8px; border-radius: 4px; }
.ln.c::after { background: linear-gradient(90deg, var(--c) calc(var(--e) * 100%), #ebe4da calc(var(--e) * 100%)); box-shadow: inset 0 0 0 1.5px rgba(43, 29, 20, .18); }
/* ready (glowing): a full gold bar, a soft gold halo, and a gold gem that bounces on the bar's end */
.ln.r::after { background: linear-gradient(180deg, #ffe07a, #f4b31c); box-shadow: inset 0 0 0 1.5px rgba(150, 95, 0, .45); }
.gem { position: absolute; right: -36px; top: 0; width: 33px; height: 28px; z-index: 3; overflow: visible; }
/* hidden (the game will teach it): pencil-faint, with a dotted line to write it on */
.ln.h::after { content: ""; position: absolute; left: 8%; right: 8%; bottom: -1px; border-bottom: 2px dotted #cbc2b8; }

/* not met yet: the same petal, faint and dotted, the picture a silhouette, a small sparkle ? */
.petal.mys::before { display: none; }
.petal.mys::after { -webkit-mask-image: var(--m-dots); mask-image: var(--m-dots); opacity: .55; }
.sil { position: absolute; left: 152px; top: -6px; width: 86px; height: 86px; z-index: 2; background: var(--sil);
  -webkit-mask: var(--pic) center / contain no-repeat; mask: var(--pic) center / contain no-repeat; }
.q { position: relative; z-index: 2; margin-top: 34px; font: 800 70px/1 var(--font-ui); color: var(--qc); }
.q::after { content: ""; position: absolute; right: -20px; top: -4px; width: 22px; height: 22px; background: var(--qc);
  clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); opacity: .8; }

/* ---------- the frame: Home top-left, the World Flower below it, Hear it again top-right, the map under it,
   Help bottom-right, the ninja bottom-left (x 0–330, y 380–720: nothing tappable there) */
.btn-round { position: absolute; width: 100px; height: 100px; border-radius: 50%; display: grid; place-items: center; z-index: 30;
  background: radial-gradient(circle at 35% 30%, #fff 0%, var(--gold) 45%, var(--gold-deep) 100%);
  border: 5px solid var(--ink); box-shadow: 0 6px 0 var(--ink); }
.btn-round:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
.btn-round svg { width: 54%; height: 54%; }
.btn-round.pink { background: radial-gradient(circle at 35% 30%, #ffe3ee 0%, var(--blossom) 50%, var(--blossom-deep) 100%); }
.btn-round.go { background: radial-gradient(circle at 35% 30%, #d9ffe4 0%, var(--good) 50%, var(--good-deep) 100%); }
.home { left: 18px; top: 16px; z-index: 84; }
.flower { left: 18px; top: 150px; }
.again { left: 1162px; top: 16px; }
.help-btn { position: absolute; right: 14px; bottom: 14px; z-index: 85; width: 124px; height: 124px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #fff8e6, #ffd98a 70%, #e0a53a); border: 6px solid var(--ink);
  box-shadow: 0 7px 0 var(--ink), 0 0 0 6px rgba(255, 244, 220, .8); }
.help-btn img { position: absolute; inset: 5px; width: calc(100% - 10px); height: calc(100% - 10px); border-radius: 50%; object-fit: cover; }
.help-q { position: absolute; left: -10px; top: -10px; width: 46px; height: 46px; border-radius: 50%; background: var(--good); border: 5px solid var(--ink);
  color: #fff; font: 800 30px/36px var(--font-ui); text-align: center; text-shadow: 0 2px 0 var(--ink); }
.ninja { position: absolute; left: 6px; bottom: 16px; height: 282px; z-index: 25; pointer-events: none; transform-origin: 50% 100%; }

/* the map: the three sheets in miniature, a petal mark for every sound (the chart-wide progress), and a frame for
   where you are. Tap or drag it to go there. It is to scale, so it is also the scroll bar. */
.map { position: absolute; left: 1158px; top: 136px; width: 108px; z-index: 30; touch-action: none; padding: 4px 6px; }
.msheet { position: absolute; left: 6px; width: 96px; background: #fffefc; border-radius: 6px; box-shadow: 0 0 0 2px rgba(128, 146, 168, .45), 0 4px 6px -2px rgba(74, 42, 20, .45); }
.mk { position: absolute; width: 13px; height: 28px; -webkit-mask: var(--m-fill) 0 0 / 100% 100%; mask: var(--m-fill) 0 0 / 100% 100%; background: #e2dbd2; }
.mk.met { background: linear-gradient(to top, var(--c) var(--fh), var(--wash) var(--fh)); }
.mk.done { background: var(--c); }
.mframe { position: absolute; left: 0; top: 0; width: 108px; border: 4px solid var(--ink); border-radius: 9px; background: rgba(255, 197, 61, .16);
  box-shadow: 0 0 0 2px rgba(255, 255, 255, .8); will-change: transform; pointer-events: none; }

/* Sensei's caption (for grown-ups; the children hear it) */
.bubble { position: absolute; right: 150px; bottom: 40px; z-index: 84; max-width: 460px; padding: 12px 20px; font: 700 25px/1.2 var(--font-ui);
  background: #fffdf6; border: 4px solid var(--ink); border-radius: 26px; box-shadow: 0 5px 0 rgba(43, 29, 20, .35);
  opacity: 0; transform: translateY(10px); transition: opacity .2s, transform .2s; pointer-events: none; }
.bubble.on { opacity: 1; transform: none; }
.bubble::after { content: ""; position: absolute; right: -22px; bottom: 22px; border: 12px solid transparent; border-left: 18px solid var(--ink); }
.toast { position: absolute; left: 50%; top: 20px; translate: -50% 0; z-index: 90; padding: 8px 22px; border-radius: 999px; background: var(--ink); color: #fff4dc;
  font: 700 24px/1.2 var(--font-ui); opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }

/* a mystery petal answers a tap: a small shake, and its sparkle twinkles */
@keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 60% { transform: rotate(2.5deg); } }
.petal.shake { animation: shake .45s ease-in-out; transform-origin: 50% 20%; }

/* ---------- the petal's card: the same petal up close, on a laminated flash card */
.scrim { position: absolute; inset: 0; z-index: 60; background: rgba(43, 29, 20, .42); opacity: 0; transition: opacity .2s; }
.card { position: absolute; left: 236px; top: 20px; width: 870px; height: 686px; z-index: 61; background: #fffefc; border-radius: 26px;
  box-shadow: 0 0 0 9px rgba(255, 255, 255, .7), 0 0 0 10.5px rgba(128, 146, 168, .45), 0 24px 40px -18px rgba(30, 15, 5, .7);
  opacity: 0; transform: translateY(24px) scale(.97); transition: opacity .22s, transform .26s cubic-bezier(.2, .9, .3, 1.2); }
.card-open .scrim { opacity: 1; }
.card-open .card { opacity: 1; transform: none; }
.card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(118deg, rgba(210, 225, 245, 0) 30%, rgba(210, 225, 245, .22) 37%, rgba(255, 255, 255, 0) 45%); }
.big { position: absolute; left: 36px; top: 74px; width: 250px; height: 560px; }
.big-halo { position: absolute; inset: -40px -50px; background: radial-gradient(ellipse 50% 46% at 50% 45%, var(--glow), transparent 100%); opacity: 0; transition: opacity .8s; }
.big.done .big-halo { opacity: 1; }
.big-wash { position: absolute; inset: 0; -webkit-mask: var(--m-bigfill) 0 0 / 100% 100%; mask: var(--m-bigfill) 0 0 / 100% 100%; overflow: hidden; }
.big-wash i { position: absolute; inset: 0; background: linear-gradient(to top, var(--wash) calc(100% - 7px), var(--wash-d) calc(100% - 7px)); transform-origin: 50% 100%;
  transition: transform 1.1s cubic-bezier(.3, .8, .3, 1); }
.big-line { position: absolute; inset: 0; background: var(--c); -webkit-mask: var(--m-bigline) 0 0 / 100% 100%; mask: var(--m-bigline) 0 0 / 100% 100%; }
.big-lines { position: absolute; left: 0; right: 0; top: 64px; display: flex; flex-direction: column; align-items: center; }
.big .ln { pointer-events: auto; display: flex; align-items: flex-start; justify-content: center; min-width: 90px; padding: 0 14px; border-radius: 18px; }
.big .ln.m { font-size: var(--BM); height: calc(var(--BM) * 1.08 + 16px); padding-top: calc(var(--BM) * .02); }
.big .ln.m.w { height: calc(var(--BM) * 1.08 + 4px); }
.big .ln.f { font-size: var(--BF); height: calc(var(--BF) * 1.18); }
.big .ln.hint { font-size: 34px; height: 44px; }
.big .ln.c::after, .big .ln.r::after { height: 11px; border-radius: 6px; bottom: 3px; width: max(60%, 44px); }
.big .ln.sel { box-shadow: 0 0 0 4px var(--ink-c), 0 0 0 7px #fff; background-color: rgba(255, 255, 255, .6); border-radius: 999px; }
.big .gem { width: 48px; height: 41px; right: -52px; top: 2px; }
.big-pic { position: absolute; left: 214px; top: 6px; width: 136px; height: 136px; object-fit: contain; z-index: 2; }
.card .say { left: 372px; top: 26px; }
.card .close { left: 750px; top: 20px; }
.card .gate { left: 692px; top: 540px; width: 128px; height: 128px; }
.card .gate svg { width: 64%; height: 64%; }
.gate-chip { position: absolute; left: 756px; top: 506px; translate: -50% 0; z-index: 32; box-shadow: 0 3px 0 var(--ink); min-width: 44px; padding: 0 10px; height: 44px; border-radius: 12px; background: #fff; border: 3px solid var(--ink);
  font: 700 30px/38px var(--font-letters); text-align: center; }
.trial { position: absolute; width: 84px; height: 84px; z-index: 5; }
.trial svg { width: 50%; height: 50%; margin-left: 6%; }
.found { position: absolute; left: 404px; top: 140px; font: 700 24px/1 var(--font-ui); color: #9b8b7c; letter-spacing: .02em; }
.words { position: absolute; left: 398px; top: 172px; width: 440px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.wc { height: 100px; border-radius: 18px; background: #fff; border: 3px solid #e5ddd2; display: flex; align-items: center; gap: 8px; padding: 0 10px;
  box-shadow: 0 4px 0 #e5ddd2; }
.wc:active { transform: translateY(3px); box-shadow: 0 1px 0 #e5ddd2; }
.wc img { width: 76px; height: 76px; object-fit: contain; flex: none; }
.wc .wt { font: 700 42px/1 var(--font-letters); color: var(--ink); white-space: nowrap; font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
.wc .wt b { color: var(--ink-c); background: linear-gradient(transparent 58%, var(--wash) 58% 92%, transparent 92%); font-weight: 700; }
.wc.nopic { justify-content: center; }
.wc.ping { animation: ping .5s ease-out; }
@keyframes ping { 40% { transform: scale(1.06); } }
.card-open .bubble { right: auto; left: 632px; bottom: 36px; max-width: 290px; font-size: 22px; }
.card-open .bubble::after { display: none; }

/* the win: the gem pops, the wash rises, sparks fly (transform and opacity only) */
.ring { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 10px solid #ffd24a; z-index: 69; pointer-events: none; }
.spark { position: absolute; width: 34px; height: 34px; z-index: 70; pointer-events: none; background: var(--sc, #ffd24a);
  clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); }
.flygem { position: absolute; z-index: 70; width: 48px; height: 41px; pointer-events: none; }
.ln.pop { animation: pop .6s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }

@media (prefers-reduced-motion: reduce) { .card, .bubble, .scrim { transition: opacity .2s; } .ln.pop, .petal.shake { animation: none; } }

/* ---------- whole=1: the full chart in one tall picture (for the design doc) */
.whole .stage { height: auto; }
.whole .scroller { position: relative; overflow: visible; height: auto; }
.whole .map, .whole .again, .whole .flower, .whole .home, .whole .help-btn, .whole .ninja, .whole .bubble { display: none; }
</style>
</head>
<body>
<div class="viewport" id="viewport">
  <div class="stage" id="stage">
    <div class="wall"></div>
    <div class="scroller petal-scroll" id="scroller"><div class="board" id="board"></div></div>

    <button class="btn-round home" data-nav="home" aria-label="Home" id="home"><svg viewBox="0 0 64 64"><path fill="#fff4dc" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M10 30 32 11l22 19v23H40V39H24v14H10z"/></svg></button>
    <button class="btn-round pink flower" aria-label="World Flower" id="flower"><svg viewBox="-60 -60 120 120" id="flowerIcon"></svg></button>
    <button class="btn-round again" data-nav="again" aria-label="Hear it again" id="again"><svg viewBox="0 0 64 64"><path fill="#fff4dc" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M10 25h10l13-11v36L20 39H10z"/><path fill="none" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" d="M42 22c5 5 5 15 0 20M49 15c9 9 9 25 0 34"/></svg></button>
    <div class="map" id="map" aria-label="Petal chart map" role="scrollbar"></div>
    <img class="ninja" id="ninja" src="../../../public/a/i/hero_kai_idle.webp" alt="" />
    <button class="help-btn" aria-label="Help" id="help"><img src="../../../public/a/i/sensei_face_idle.webp" alt="" /><span class="help-q">?</span></button>
    <div class="bubble" id="bubble"></div>
    <div class="toast" id="toast"></div>
    <div id="cardLayer"></div>

  if (st === "future") return `<${tag} class="ln f x"${data}${label}>${g}</${tag}>`;
  const e = st === "charging" ? ` style="--e:${energyOf(ln.gem).toFixed(2)}"` : "";
  const cls = st === "won" ? "w" : st === "ready" ? "r" : "c";
  return `<${tag} class="ln m ${cls}" data-gem-chip="${ln.gem.key}"${data}${label}${e}>${g}${st === "ready" ? GEM_SVG : ""}</${tag}>`;
}
const GEM_SVG = `<svg class="gem" viewBox="0 0 40 34" aria-hidden="true"><path d="M10 2h20l8 10-18 20L2 12z" fill="#ffd24a" stroke="#2b1d14" stroke-width="2.6" stroke-linejoin="round"/><path d="M2 12h36M10 2l4 10 6 20 6-20 4-10" fill="none" stroke="#b8820a" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 4h7l-4 7z" fill="#fff8d8"/></svg>`;
const petalEls = {};
function renderPetal(pt) {
  const el = petalEls[pt.p]; const r = petalInner(pt);
  el.className = r.cls; el.style.cssText = r.vars; el.innerHTML = r.html;
  el.dataset.m = r.M ? r.M.toFixed(0) : "";
}
function buildSheets() {
  SHEETS.forEach((pts, n) => {
    const s = document.createElement("section");
    s.className = "sheet"; s.dataset.sheet = n + 1;
    s.style.cssText = `--pin:${PINS[n][0]};--pin-d:${PINS[n][1]}`;
    for (const pt of pts) {
      const b = document.createElement("button");

}

// ------------------------------------------------------------------ the map (chart-wide progress + where you are)
const map = document.getElementById("map");
const MAP_H = 404, MK = MAP_H / CONTENT_H; // to scale: it is the scroll bar
const mapMarks = {};
let mframe;
function buildMap() {
  map.style.height = MAP_H + 8 + "px";
  let html = "";
  SHEETS.forEach((pts, n) => {
    const top = 4 + sheetY(n) * MK, h = sheetH(n) * MK;
    html += `<div class="msheet" style="top:${top.toFixed(1)}px;height:${h.toFixed(1)}px"></div>`;
    pts.forEach((pt, i) => {
      const x = 6 + (24 + (i % 4) * COL + COL / 2) * (96 / SHEET_W) - 6.5;
      const y = 4 + (sheetY(n) + PAD_T + Math.floor(i / 4) * ROW + 36 + PH / 2) * MK - 14;
      html += `<i class="mk" data-p="${pt.p}" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px"></i>`;
    });
  });
  html += `<div class="mframe" id="mframe" style="height:${(720 * MK + 8).toFixed(1)}px"></div>`;
  map.innerHTML = html;
  mframe = document.getElementById("mframe");
  map.querySelectorAll(".mk").forEach((m) => (mapMarks[m.dataset.p] = m));
  PETALS.forEach(renderMark);
}
function renderMark(pt) {
  const m = mapMarks[pt.p], k = coloursOf(pt);
  m.className = "mk" + (petalDone(pt) ? " done" : petalMet(pt) ? " met" : "");
  m.style.setProperty("--c", k.c); m.style.setProperty("--wash", mix(k.c, "#ffffff", 0.55));
  m.style.setProperty("--fh", areaHeight(DROP, PH, petalFill(pt)).toFixed(0) + "%");
}
const scroller = document.getElementById("scroller");
let raf = 0;
function syncFrame() { raf = 0; mframe.style.transform = `translateY(${(scroller.scrollTop * MK).toFixed(2)}px)`; }
scroller.addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(syncFrame); }, { passive: true });
function mapTo(ev, smooth) {
  const r = map.getBoundingClientRect(), s = r.height / (MAP_H + 8);
  const y = (ev.clientY - r.top) / s - 4;

}
map.addEventListener("pointerdown", (e) => { map.setPointerCapture(e.pointerId); map._drag = false; map._y = e.clientY; mapTo(e, true); });
map.addEventListener("pointermove", (e) => { if (!map.hasPointerCapture(e.pointerId)) return; if (Math.abs(e.clientY - map._y) > 4) map._drag = true; if (map._drag) mapTo(e, false); });

// ------------------------------------------------------------------ Sensei's voice (the game's own lines and sounds)
const bubble = document.getElementById("bubble");
let audio = null, queue = [], lastSaid = [], bubbleT = 0;
function play(src, caption) {
  return new Promise((done) => {
    if (audio) { audio.onended = null; audio.pause(); }
    clearTimeout(bubbleT);
    if (caption) { bubble.textContent = caption; bubble.classList.add("on"); }
    const a = new Audio(src); audio = a;
    const end = () => { if (audio === a) { bubbleT = setTimeout(() => bubble.classList.remove("on"), 700); } done(); };
    a.onended = end; a.onerror = () => setTimeout(end, 2200);
    a.play().catch(() => setTimeout(end, 2200));
  });
}
async function say(...ids) {
  const token = {}; say.t = token; lastSaid = ids;
  for (const id of ids) { if (say.t !== token) return; await play(`${A}l/${id}.mp3`, LINES[id]); }
}
const sound = (p) => { say.t = {}; return play(`${A}p/${p}.mp3`); };
const word = (w) => { say.t = {}; return play(`${A}w/${w}.mp3`); };
const toastEl = document.getElementById("toast");
function toast(t) { toastEl.textContent = t; toastEl.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove("on"), 1600); }

// ------------------------------------------------------------------ taps on the sheet (a tap, not the end of a swipe)
let downY = 0, downT = 0;
scroller.addEventListener("pointerdown", (e) => { downY = e.clientY; downT = scroller.scrollTop; }, { passive: true });
board.addEventListener("click", (e) => {
  const b = e.target.closest(".petal"); if (!b) return;
  if (Math.abs(scroller.scrollTop - downT) > 6) return;
  const pt = PETALS.find((x) => x.p === b.dataset.p);
  if (!petalMet(pt)) {
    b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
    say("petal_secret"); return;
  }
  sound(pt.p); openCard(pt);
});

// ------------------------------------------------------------------ the card
const layer = document.getElementById("cardLayer");
let cardPt = null, selKey = null;
const I = {
  speaker: `<svg viewBox="0 0 64 64"><path fill="#fff4dc" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M10 25h10l13-11v36L20 39H10z"/><path fill="none" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" d="M42 22c5 5 5 15 0 20M49 15c9 9 9 25 0 34"/></svg>`,
  check: `<svg viewBox="0 0 64 64"><path fill="none" stroke="#2b1d14" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M12 34l13 13 27-30"/></svg>`,
  play: `<svg viewBox="0 0 64 64"><path fill="#fff4dc" stroke="#2b1d14" stroke-width="7" stroke-linejoin="round" d="M22 12l30 20-30 20z"/></svg>`,
  torii: `<svg viewBox="0 0 64 64"><g stroke="#2b1d14" stroke-width="3.5" stroke-linejoin="round"><path fill="#e2412f" d="M5 13c9 3 45 3 54 0l-2 7c-10 2-40 2-50 0z"/><path fill="#e2412f" d="M12 26h40v6H12z"/><path fill="#e2412f" d="M17 19h7v39h-7zM40 19h7v39h-7z"/><path fill="#2b1d14" d="M29 21h6v5h-6z"/></g></svg>`,
};
function foundWords(pt, only) {
  const gems = pt.gems.filter((g) => isMet(gemState(g)) && (!only || g.key === only));
  const lists = gems.map((g) => g.words.filter((w) => w.segs.every((s) => known.has(s))).map((w) => ({ ...w, key: g.key })));
  const out = [], seen = new Set();
  for (let i = 0; out.length < 6 && lists.some((l) => l.length > i); i++)
    for (const l of lists) if (l[i] && !seen.has(l[i].t) && out.length < 6) { seen.add(l[i].t); out.push(l[i]); }
  return out;
}
function wordHTML(w) {
  const k = w.segs.map((s, i) => (i === w.hi ? `<b>${esc(s)}</b>` : esc(s))).join("");
  return `<button class="wc${w.pic ? "" : " nopic"}" data-w="${w.t}" data-key="${w.key}" aria-label="word ${w.t}">${w.pic ? `<img src="${A}i/pic_${w.t}.webp" alt="">` : ""}<span class="wt">${k}</span></button>`;
}
function defaultSel(pt) {
  const gs = pt.gems.filter((g) => g.inPlay);
  const r = gs.find((g) => gemState(g) === "ready") || gs.filter((g) => gemState(g) === "charging").sort((a, b) => energyOf(b) - energyOf(a))[0] || gs.find((g) => isMet(gemState(g)));
  return r ? r.key : null;
}
function bigLinesHTML(pt) {
  const lines = linesOf(pt);
  const [M, F] = fit(lines, BIG, 64, BH - 26, CARD_FIT);
  let html = "";
  for (const ln of lines) html += lineHTML(pt, ln, true);
  return { html, M, F };
}
function openCard(pt) {
  cardPt = pt; selKey = defaultSel(pt);
  const k = coloursOf(pt);
  const bl = bigLinesHTML(pt);
  layer.innerHTML = `<div class="scrim" id="scrim"></div>
    <div class="card" role="dialog" aria-label="Petal ${pt.p}" style="--c:${k.c};--wash:${k.wash};--wash-d:${k.washD};--glow:${k.glow};--ink-c:${k.ink};--BM:${bl.M.toFixed(1)}px;--BF:${bl.F.toFixed(1)}px">
      <div class="big${petalDone(pt) ? " done" : ""}" id="big"><div class="big-halo"></div><div class="big-wash"><i id="bigWash" style="transform:scaleY(${(areaHeight(BIG, BH, petalFill(pt)) / 100).toFixed(3)})"></i></div><div class="big-line"></div>
        <div class="big-lines" id="bigLines">${bl.html}</div></div>
      <img class="big-pic" src="${picUrl(pt.p)}" alt="" id="bigPic">
      <button class="btn-round say" aria-label="Hear the sound" id="say">${I.speaker}</button>
      <button class="btn-round close" aria-label="Close" id="close">${I.check}</button>
      <div class="found">words you’ve found</div>
      <div class="words" id="words"></div>
      <button class="btn-round go gate" aria-label="Practise" id="gate">${I.torii}</button>
      <span class="gate-chip" id="gateChip"></span>
    </div>`;
  placeTrials(); markSel(); renderWords();
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("card-open")));
  window.__snState = { view: "chart", open: pt.p };
}
function placeTrials() {
  const big = document.getElementById("big");
  big.querySelectorAll(".trial").forEach((t) => t.remove());
  big.querySelectorAll(".ln.r").forEach((ln) => {
    const b = document.createElement("button");
    b.className = "btn-round go trial"; b.setAttribute("aria-label", "Gem battle " + ln.dataset.key); b.dataset.key = ln.dataset.key; b.innerHTML = I.play;
    b.style.left = BW + 6 + "px"; b.style.top = 64 + ln.offsetTop + ln.offsetHeight / 2 - 42 + "px";
    big.appendChild(b);
  });
}
function markSel() {
  layer.querySelectorAll(".big .ln").forEach((l) => l.classList.toggle("sel", l.dataset.key === selKey));
  const chip = document.getElementById("gateChip"), gem = cardPt.gems.find((g) => g.key === selKey);
  chip.textContent = gem ? gem.g : ""; chip.style.display = gem ? "" : "none";
}
function renderWords() { document.getElementById("words").innerHTML = foundWords(cardPt, null).map(wordHTML).join(""); }
function closeCard() {
  document.body.classList.remove("card-open");
  window.__snState = { view: "chart", open: null };
  setTimeout(() => { if (!document.body.classList.contains("card-open")) layer.innerHTML = ""; }, 260);
}
layer.addEventListener("click", (e) => {
  const t = e.target;
  if (t.id === "scrim" || t.closest("#close")) return closeCard();
  if (t.closest("#say") || t.closest("#bigPic")) return sound(cardPt.p);
  if (t.closest("#gate")) { toast(`To the dojo! Practise ‹ ${document.getElementById("gateChip").textContent} ›`); return; }
  const tr = t.closest(".trial"); if (tr) return winGem(tr.dataset.key, tr);
  const wc = t.closest(".wc");
  if (wc) { wc.classList.remove("ping"); void wc.offsetWidth; wc.classList.add("ping"); return word(wc.dataset.w); }
  const ln = t.closest(".big .ln");
  if (ln && ln.dataset.st) {
    const st = ln.dataset.st;
    if (st === "hidden") return say("gem_hidden");
    if (st === "future") return say("gem_future");
    selKey = ln.dataset.key; markSel();
    layer.querySelectorAll(".wc").forEach((w) => { if (w.dataset.key === selKey) { w.classList.remove("ping"); void w.offsetWidth; w.classList.add("ping"); } });
    if (st === "ready") return say("gem_ready");
    if (st === "charging") return say("gem_charging", "t_practise_invite");
    const first = foundWords(cardPt, selKey)[0]; if (first) word(first.t);
    return;
  }
  if (t.closest(".big")) return sound(cardPt.p);
});

// ------------------------------------------------------------------ a gem won (the mockup skips the battle itself)
function burst(x, y, n, colour, dist) {
  const stage = document.getElementById("stage");
  for (let i = 0; i < n; i++) {
    const s = document.createElement("i"); s.className = "spark";
    s.style.left = x - 17 + "px"; s.style.top = y - 17 + "px"; s.style.setProperty("--sc", i % 3 === 0 ? "#fff3b0" : i % 3 === 1 ? colour : "#ffd24a");
    stage.appendChild(s);
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.4, d = dist * (0.6 + Math.random() * 0.6);
    s.animate([{ transform: "translate(0,0) scale(.3) rotate(0deg)", opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) scale(${0.8 + Math.random() * 0.8}) rotate(${Math.random() * 180}deg)`, opacity: 0 }],
      { duration: 700 + Math.random() * 400, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => s.remove();
  }
}
function ring(x, y, scale) {
  const r = document.createElement("i"); r.className = "ring"; r.style.left = x + "px"; r.style.top = y + "px";
  document.getElementById("stage").appendChild(r);
  r.animate([{ transform: "scale(.2)", opacity: 1 }, { transform: `scale(${scale})`, opacity: 0 }], { duration: 700, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => r.remove();
}
function stagePos(el) {
  const st = document.getElementById("stage").getBoundingClientRect(), r = el.getBoundingClientRect(), s = st.width / 1280;
  return { x: (r.left + r.width / 2 - st.left) / s, y: (r.top + r.height / 2 - st.top) / s };
}
function winGem(key, trialBtn) {
  const pt = cardPt, gem = pt.gems.find((g) => g.key === key);
  const ln = layer.querySelector(`.big .ln[data-key="${CSS.escape(key)}"]`);
  const at = stagePos(ln), tip = stagePos(document.getElementById("big"));
  trialBtn.animate([{ transform: "scale(1)", opacity: 1 }, { transform: "scale(1.4)", opacity: 0 }], { duration: 260, fill: "forwards" });
  burst(at.x, at.y, 22, pt.colour, 240); ring(at.x, at.y, 2.6);
  // the gold gem flies down into the petal's point
  const g = ln.querySelector(".gem"); const fly = g.cloneNode(true); fly.setAttribute("class", "flygem");
  const gp = stagePos(g); fly.style.left = gp.x - 24 + "px"; fly.style.top = gp.y - 20 + "px"; document.getElementById("stage").appendChild(fly);
  fly.animate([{ transform: "translate(0,0) scale(1)" }, { transform: `translate(${tip.x - gp.x}px,${tip.y + 190 - gp.y}px) scale(.6)`, opacity: 0.2 }], { duration: 620, easing: "cubic-bezier(.5,0,.7,1)" }).onfinish = () => {
    fly.remove();
    won.add(key);
    const done = petalDone(pt);
    // the letters stay; the bar and the gem go; the wash rises to the new level
    ln.className = "ln m w pop"; ln.dataset.st = "won"; ln.innerHTML = esc(gem.g);
    document.getElementById("bigWash").style.transform = `scaleY(${(areaHeight(BIG, BH, petalFill(pt)) / 100).toFixed(3)})`;
    trialBtn.remove();
    burst(tip.x, tip.y + 180, 16, pt.colour, 170); ring(tip.x, tip.y + 180, 2);
    const ninja = document.getElementById("ninja");
    ninja.src = `${A}i/hero_kai_cheer.webp`;
    ninja.animate([{ transform: "translateY(0)" }, { transform: "translateY(-60px)", offset: 0.4 }, { transform: "translateY(0)" }], { duration: 650, easing: "ease-out" });
    setTimeout(() => (ninja.src = `${A}i/hero_kai_idle.webp`), 1800);
    if (done) {
      document.getElementById("big").classList.add("done");
      setTimeout(() => { burst(tip.x, tip.y - 40, 32, pt.colour, 380); ring(tip.x, tip.y - 40, 4.5); }, 450);
      say("trial_win", "petal_complete");

}

// ------------------------------------------------------------------ the frame's buttons
document.getElementById("home").addEventListener("click", () => toast("Home"));
document.getElementById("flower").addEventListener("click", () => toast("Back to the World Flower"));
document.getElementById("again").addEventListener("click", () => say(...(lastSaid.length ? lastSaid : ["flower_tap"])));
document.getElementById("help").addEventListener("click", () => say("help_flower"));
document.getElementById("flowerIcon").innerHTML = ["#e8312f", "#f7a23b", "#f3c74a", "#2fa65a", "#2ec4b6", "#4a7dff", "#8a3be0", "#f0226b"].map((c, i) =>
  `<path d="M0,20 C-2.88,11.2 -12,2.4 -12,-8 A12,12 0 0 1 12,-8 C12,2.4 2.88,11.2 0,20 Z" transform="rotate(${i * 45}) translate(0 -34)" fill="${c}" stroke="#2b1d14" stroke-width="4"/>`).join("") +
  `<circle r="17" fill="#ffc53d" stroke="#2b1d14" stroke-width="5"/>`;

// ------------------------------------------------------------------ bouncing gems: Web Animations (compositor), only while their sheet is on screen
let gemAnims = [];
const onScreen = new Set();
function watchGems() {
  gemAnims.forEach((a) => a.cancel()); gemAnims = [];
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll(".sheet .gem").forEach((g, i) => {
    const a = g.animate([{ transform: "translateY(0)" }, { transform: "translateY(-9px)", offset: 0.35 }, { transform: "translateY(0)", offset: 0.6 }, { transform: "translateY(0)" }],
      { duration: 1400, iterations: Infinity, delay: -i * 230, easing: "ease-in-out" });
    a._sheet = g.closest(".sheet"); if (!onScreen.has(a._sheet)) a.pause(); gemAnims.push(a);
  });
}
const io = new IntersectionObserver((es) => {
  for (const e of es) { if (e.isIntersecting) onScreen.add(e.target); else onScreen.delete(e.target); }
  gemAnims.forEach((a) => (onScreen.has(a._sheet) ? a.play() : a.pause()));
}, { root: scroller });

// ------------------------------------------------------------------ the stage fit (src/ui/ui.tsx Stage)
const stage = document.getElementById("stage");
function fitStage() {
  if (Q.get("whole")) { stage.style.transform = `scale(${innerWidth / 1280})`; stage.style.left = "0"; stage.style.top = "0"; return; }
  const cs = getComputedStyle(document.documentElement), inset = (v) => parseFloat(cs.getPropertyValue(v)) || 0;
  const touch = matchMedia("(pointer: coarse)").matches;
  const top = Math.max(inset("--sat"), touch ? 10 : 0), bottom = Math.max(inset("--sab"), touch ? 26 : 0);
  const left = Math.max(inset("--sal"), touch ? 8 : 0), right = Math.max(inset("--sar"), touch ? 8 : 0);
  const aw = innerWidth - left - right, ah = innerHeight - top - bottom, s = Math.min(aw / 1280, ah / 720);
  stage.style.left = `${left + aw / 2}px`; stage.style.top = `${top + ah / 2}px`;
  stage.style.transform = `scale(${s}) translate(-50%, -50%)`;
  window.__stageScale = s;
}
addEventListener("resize", fitStage); addEventListener("orientationchange", fitStage);
fitStage();

// ------------------------------------------------------------------ go: wait for Andika (the fit measures it), build, land on the child's own sounds
(async () => {
  if (Q.get("whole")) document.body.classList.add("whole");
  try { await Promise.all([document.fonts.load("700 50px Andika"), document.fonts.load("400 30px Andika"), document.fonts.load("800 30px 'Baloo 2'")]); } catch {}
  const t0 = performance.now(); buildSheets(); buildMap(); window.__buildMs = performance.now() - t0;
  document.querySelectorAll(".sheet").forEach((s) => io.observe(s));
  watchGems();
  // land on the thing to do next (a glowing gem), else the child's newest sound: set before the first paint, no self-scrolling
  const at = PETALS.find((x) => x.p === Q.get("at"));
  const ready = PETALS.find((pt) => pt.gems.some((g) => gemState(g) === "ready"));
  const firstMet = PETALS.find(petalMet);
  const target = at || ready || firstMet;
  if (target && !Q.get("whole")) scroller.scrollTop = Math.max(0, petalY(target) - 24);
  syncFrame();
  window.__snState = { view: "chart", open: null };
  document.body.dataset.ready = "1";
  const open = PETALS.find((x) => x.p === Q.get("open"));
  if (open) openCard(open); else if (!Q.get("whole") && !Q.get("quiet")) say("flower_tap");
})();
