<!doctype html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f3e6cf" />
<title>World Flower v2</title>
<meta name="description" content="Super Ninja's World Flower v2: the radial flower and the petal chart, with petals that go missing, outline, filling and complete, gem mastery meters and multi-sound spellings. A working mockup." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;600;700;800&family=Luckiest+Guy&display=block" rel="stylesheet" />
<!--
  World Flower v2: the working mockup for docs/SCROLL_DESIGN.md (27 Sep 2026). Not game code. One file; the game's own art
  and voice (public/a/…, by relative path), the petal data from src/content/flower.ts (dump.ts), and every petal and gem
  state from the REAL progress model, src/content/progress.ts, run on the model's own simulated children (dump-progress.ts
  writes progress.json; build.py inlines it). Nothing here invents a state. Serve the repo root over http (the masks
  need the same origin) and open this folder with:
    ?view=flower|chart          the radial World Flower (default) or the petal chart
    &child=new|first|reception|year1|away|programme   a new child; after the first lessons (m s a t); mid-Reception;
                                mid-Year 1 in the game; the same child a month away (dusty gems); mid-Year 1 by the
                                Sounds~Write programme (EC1–EC13, an illustration: the only child with ea as /ae/ /ee/ /e/)
    &open=<petal>               open that petal's card        &sel=<gem key>   select that spelling on the card (sel=ea>ee)
    &multi=<spelling>           the fork panel: one spelling's sounds side by side, and Sound Detective (multi=ea)
    &at=<petal>                 land the chart on that petal's half-sheet
    &rise=<petal>&from=<0..1>   replay that petal's colour growing, as after practice
    &unlock=<petal>             replay that petal coming back as a faint outline (a sound met: child=first&unlock=s)
    &first=1                    Sensei's first-time lines (the speaker, the fork chip)
    &whole=1                    the whole chart in one tall picture    &quiet=1  no voice on arrival    &cap=0  no captions
    rejected variants, for comparison: &ink=point (colour rising from the point), &meter=ring|ink (other gem meters)
-->
<style>
:root {
  --ink: #2b1d14; --ink-soft: #5a4636;
  --paper: #fffdf8;
  --pencil: #9a8f84;               /* a spelling still to find */
  --pencil-x: #b9afa4;             /* a spelling this version can't teach yet */
  --gem-empty: #f2ede5;            /* an empty gem: clear glass */
  --gold: #ffc53d; --gold-deep: #c98a00; --good: #3fbf6a; --good-deep: #1f7a41;
  --blossom: #ff7aa2; --blossom-deep: #d9477a;
  --font-letters: "Andika", "Comic Sans MS", system-ui, sans-serif;
  --font-ui: "Baloo 2", "Andika", system-ui, sans-serif;
  --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
  --sal: env(safe-area-inset-left); --sar: env(safe-area-inset-right);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: #f3e6cf; font-family: var(--font-ui); color: var(--ink); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; border: 0; padding: 0; background: none; cursor: pointer; touch-action: manipulation; }
img { -webkit-user-drag: none; user-select: none; }

/* ---------- the stage: 1280×720, scaled as src/ui/ui.tsx Stage does; the letterbox is painted to match the view */
.viewport { position: fixed; inset: 0; background: #f3e6cf; transition: background .25s; }
.is-flower .viewport { background: #d9c7a8; }
.card-open .viewport { background: #a8998a; }
.stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; contain: layout paint; }
.view { position: absolute; inset: 0; display: none; }
.is-flower .v-flower, .is-chart .v-chart { display: block; }

/* ================================================================== THE RADIAL WORLD FLOWER (view 0) */
.v-flower .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.9) brightness(1.04); }
/* a soft warm light where the flower grows, and a gentle vignette: painted once */
.v-flower::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(46% 62% at 54% 44%, rgba(255, 246, 214, .55), rgba(255, 246, 214, 0) 70%),
              radial-gradient(120% 120% at 50% 45%, transparent 60%, rgba(60, 36, 20, .22) 100%); }
.wf-box { position: absolute; left: 405px; top: 26px; width: 580px; height: 580px; z-index: 2; }
.wf-box .stem { position: absolute; left: 18.96%; top: 40.2%; width: 95.6%; z-index: 0; pointer-events: none; }
.wf-box svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; z-index: 1; }
.wf-fx { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
/* the sparkles on complete petals, and the ready gems, live on one HTML layer: they twinkle / hop once on arrival */
.wf-fx i { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; background: var(--star) center / contain no-repeat; }
.wf-fx i.big { width: 28px; height: 28px; margin: -14px 0 0 -14px; }
.wf-fx b { position: absolute; width: 39px; height: 39px; margin: -19.5px 0 0 -19.5px; background: var(--gold-gem) center / contain no-repeat; }
.arrive-fx .wf-fx i { animation: twinkle 1.1s ease-in-out 2 both; animation-delay: var(--d, 0s); }
.arrive-fx .wf-fx b { animation: hop .62s cubic-bezier(.3, .8, .4, 1) 3; }
@keyframes twinkle { 0%, 100% { transform: scale(.7) rotate(0deg); opacity: .7; } 45% { transform: scale(1.35) rotate(45deg); opacity: 1; } }
@keyframes hop { 0%, 100% { transform: none; } 38% { transform: translateY(-42%) scale(1.12) rotate(-8deg); } 70% { transform: translateY(4%) scale(.96); } }

/* ================================================================== THE PETAL CHART (view 1) */
/* the wall: warm paper light from the top left, calm */
.v-chart { background:
  radial-gradient(90% 80% at 18% 0%, #fff8e8 0%, rgba(255, 248, 232, 0) 60%),
  radial-gradient(70% 70% at 100% 100%, #e8d2b1 0%, rgba(232, 210, 177, 0) 70%),
  #f3e6cf; }
.scroller { position: absolute; inset: 0; z-index: 1; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
  scroll-snap-type: y mandatory; touch-action: pan-y; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.scroller::-webkit-scrollbar { display: none; }
.board { position: relative; width: 1280px; }
.edge { position: absolute; left: 0; right: 0; height: 20px; z-index: 2; pointer-events: none; }
.edge.t { top: 0; background: linear-gradient(#f5e9d5, rgba(245, 233, 213, 0)); }
.edge.b { bottom: 0; background: linear-gradient(rgba(240, 226, 204, 0), #f0e2cc); }
.whole .edge { display: none; }

/* a laminated sheet: warm white paper, the film's soft edge and sheen, lifted off the wall by a soft shadow (no pins) */
.sheet { position: relative; width: 936px; margin-left: 172px; }
.sheet::before { content: ""; position: absolute; left: 0; right: 0; top: 16px; bottom: 16px; border-radius: 18px;
  background: radial-gradient(120% 60% at 12% 0%, #fffefa 0%, rgba(255, 254, 250, 0) 55%), linear-gradient(128deg, rgba(255, 255, 255, .9) 0%, rgba(255, 255, 255, 0) 22%, rgba(255, 255, 255, 0) 70%, rgba(255, 246, 228, .8) 100%), #fffcf5;
  box-shadow: 0 0 0 6px rgba(255, 255, 255, .6), 0 0 0 7.5px rgba(150, 132, 108, .22), 0 26px 44px -26px rgba(92, 56, 24, .55), 0 6px 14px -8px rgba(92, 56, 24, .25); }
.half { position: relative; z-index: 1; height: 720px; display: grid; grid-template-columns: repeat(4, 234px); grid-template-rows: repeat(2, 334px);
  align-content: start; padding-top: 40px; scroll-snap-align: start; scroll-snap-stop: always;
  content-visibility: auto; contain-intrinsic-size: auto 936px 720px; }
.half.lo { padding-top: 12px; }

/* ---------- a petal on the chart: the chart's slim teardrop (136 × 296) in a 234 × 334 cell (the button).
   ::after = the outline (a mask of one SVG teardrop), .fl = the ink inside (a mask; its <i> rises from the point),
   ::before = the star and sparkles of a complete petal. */
.petal { position: relative; display: block; width: 234px; height: 334px; cursor: pointer; outline: none; }
.petal::after { content: ""; position: absolute; left: 49px; top: 30px; width: 136px; height: 296px; pointer-events: none; z-index: 1; background: var(--c);
  -webkit-mask: var(--m-line) 0 0 / 100% 100% no-repeat; mask: var(--m-line) 0 0 / 100% 100% no-repeat; }
.petal:active .col, .petal:active .pic { transform: scale(.97); }
.pic { position: absolute; left: 154px; top: -2px; width: 72px; height: 72px; object-fit: contain; z-index: 3; pointer-events: none; }
.col { position: absolute; left: 49px; top: 30px; width: 136px; height: 296px; padding-top: var(--top); z-index: 2; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; }

/* MISSING: a faint dotted ghost in a whisper of its colour, nothing inside, no picture */
.petal.mys::after { -webkit-mask-image: var(--m-dots); mask-image: var(--m-dots); background: var(--ghost); }
/* OUTLINE: the chart's own thin outline in its colour, the picture, the spellings. Nothing inside yet. */
/* FILLING: the petal's colour rises from the point like ink, to its fill level (a crisp surface line) */
.fl { position: absolute; left: 49px; top: 30px; width: 136px; height: 296px; z-index: 0; overflow: hidden; pointer-events: none;
  -webkit-mask: var(--m-fill) 0 0 / 100% 100% no-repeat; mask: var(--m-fill) 0 0 / 100% 100% no-repeat; }
/* COLOURING IN (ink=top, the choice): the colour starts at the round top, where the child's own spellings are (the
   chart's order is Sounds~Write's: the commonest spellings first), and grows down towards the point. The surface is a
   crisp line in the petal's colour; a soft light sits just above it. */
.fl > i { position: absolute; inset: 0; background: linear-gradient(to bottom, var(--w0) 0%, var(--w0) 40%, var(--w1) 100%);
  transform: translateY(calc((var(--lv) - 1) * 100%)); }
.fl > i::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22px; border-bottom: 3.5px solid var(--surf); background: linear-gradient(rgba(255, 255, 255, 0), rgba(255, 255, 255, .5)); }
/* ink=point (the rejected variant, kept for the comparison): the colour rises from the point like water in a glass */
.ink-point .fl > i { background: linear-gradient(to top, var(--wd) 0%, var(--w0) 32%, var(--w1) 100%); transform: translateY(calc((1 - var(--lv)) * 100%)); }
.ink-point .fl > i::after { top: 0; bottom: auto; height: 24px; border-bottom: 0; border-top: 3.5px solid var(--surf); background: linear-gradient(rgba(255, 255, 255, .55), rgba(255, 255, 255, 0)); }
.petal.done .fl > i::after, .big.done .fl > i::after { display: none; }
.gl { position: absolute; left: 33px; top: 14px; width: 168px; height: 328px; z-index: 0; pointer-events: none; background: var(--c); opacity: .14;
  -webkit-mask: var(--m-glow) 0 0 / 100% 100% no-repeat; mask: var(--m-glow) 0 0 / 100% 100% no-repeat; }
.inked .gl { opacity: .26; }
.petal.done .gl { opacity: .5; }
/* DUST lives on the gems, never on a petal's colour (time never takes colour away). A complete petal that has gone
   dusty only loses its gloss and its sparkles (.matte); practice brings them back. */
.key > span { white-space: nowrap; }
/* CAUGHT UP FOR NOW (complete for the child's stage, not the whole column): the surface is a glowing gold line */
.caught .fl > i::after { border-bottom: 5px solid #ffc53d; background: linear-gradient(rgba(255, 236, 170, 0), rgba(255, 236, 170, .95)); height: 30px; }
.caught .fl > i { box-shadow: 0 3px 10px 2px rgba(255, 205, 70, .75); }
.ink-point .caught .fl > i::after { border-bottom: 0; border-top: 5px solid #ffc53d; background: linear-gradient(rgba(255, 236, 170, .95), rgba(255, 236, 170, 0)); }
.ink-point .caught .fl > i { box-shadow: 0 -2px 10px 2px rgba(255, 205, 70, .7); }
.petal.full .gl { background: #ffc93a; opacity: 1; }
.fl.rising > i { transition: transform 1.6s cubic-bezier(.25, .9, .3, 1); }
/* COMPLETE: full colour, a gloss, a star at the point and two sparkles; the shine sweeps once when its half-sheet arrives */
.petal.done::after { -webkit-mask-image: var(--m-line-b); mask-image: var(--m-line-b); background: var(--c-deep); }
.petal.done .fl > i { box-shadow: none; }
.fl::after { content: ""; position: absolute; inset: 0; z-index: 1; opacity: 0; transition: opacity .6s;
  background: radial-gradient(22% 13% at 34% 13%, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0) 100%); }
.petal.done .fl::after { opacity: 1; }
.petal.done.matte .fl::after, .big.done.matte .fl::after, .petal.done.matte .fl b { opacity: 0 !important; animation: none !important; }
.petal.done.matte::before { background: var(--star) 97px 303px / 42px 42px no-repeat; animation: none !important; }
/* OUTLINE: met, nothing coloured in yet: a faint outline (the model's "comes back as a faint outline") */
.petal.outl::after { opacity: .5; }
.fl b { position: absolute; top: -8%; bottom: -8%; left: -60%; width: 46%; z-index: 2; opacity: 0;
  background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .8) 50%, rgba(255, 255, 255, 0)); transform: skewX(-12deg); }
.half.arrive .petal.done .fl b, .fl.shine b { animation: shine 1.3s cubic-bezier(.4, 0, .3, 1) .25s 1 both; }
@keyframes shine { 0% { opacity: 1; transform: translateX(0) skewX(-12deg); } 100% { opacity: 1; transform: translateX(420%) skewX(-12deg); } }
.petal.done::before { content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none;
  background: var(--star) 97px 303px / 42px 42px no-repeat, var(--sparkle) 58px 52px / 22px 22px no-repeat, var(--sparkle) 166px 122px / 16px 16px no-repeat; }
.half.arrive .petal.done::before { animation: glint 1.2s ease-out .9s 1 both; }
@keyframes glint { 0% { opacity: 1; } 30% { opacity: .35; } 60% { opacity: 1; } }

/* the spellings: Andika regular, ink when met, pencil while still to find. On ink, a paper halo keeps them crisp. */
.ln { position: relative; flex: none; font-family: var(--font-letters); font-weight: 400; line-height: 1; white-space: nowrap;
  font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
.ln + .ln { margin-top: var(--gap, 0px); }
.ln.m { font-size: var(--M); height: calc(var(--M) * 1.12); color: var(--ink); }
.ln.f { font-size: var(--F); height: calc(var(--F) * 1.2); color: var(--pencil); }
.ln.f.x { color: var(--pencil-x); }
.ln.hint { font-size: min(var(--F), calc(var(--M) * .6)); height: calc(min(var(--F), calc(var(--M) * .6)) * 1.3); color: var(--ink-soft); }
.ln.hint b { font-weight: 400; color: var(--ink-c); }
.inked .ln { text-shadow: 0 0 3px var(--paper), 0 0 1.5px var(--paper), 0 0 1px var(--paper); }
.inked .ln.f { color: #857a70; }

/* THE GEM MASTERY METER (§3.2): a little cut gem beside each met spelling. Four looks a parent can tell apart at phone
   size, by more than hue:
   - glass / fill: a PENCIL gem (grey outline and facets); practice fills its lower half (the pavilion, below the
     girdle) with the petal's colour from the point, true to area: to .056 + .611 × √energy of its height, so the top
     facet stays clear until the battle. (A pale tint, --cj-lite, vanished on a coloured petal: /ee/'s ee at 94 % read
     as empty. The clear crown and the pencil outline are what keep a charge from reading as won.)
   - ready: the gold gem, 1.3× bigger, on a white halo disc, with rays (the only mark with rays);
   - won: a SOLID jewel (--cj → --cj-deep) in INK, never frosted; its white glint grows with polish (consolidation);
     mastered: the glint becomes a sparkle;
   - dusty: grey specks (and at most a 15 % film) on the still-solid jewel. */
.ln.m::after { content: ""; position: absolute; left: 100%; top: calc(var(--M) * .157); margin-left: calc(var(--M) * .1); width: var(--gw); height: calc(var(--gw) * .9);
  pointer-events: none;
  background: var(--gem-line) center / 100% 100% no-repeat, linear-gradient(to top, var(--cj) calc((.056 + .611 * sqrt(var(--e))) * 100%), var(--gem-empty) 0);
  -webkit-mask: var(--m-gem) center / 100% 100% no-repeat; mask: var(--m-gem) center / 100% 100% no-repeat; }
.ln.m.w::after { background: var(--gem-won) center / 100% 100% no-repeat,
  radial-gradient(calc(7% + 13% * var(--pol, 0)) calc(8% + 14% * var(--pol, 0)) at 34% 30%, rgba(255, 255, 255, .95) 40%, rgba(255, 255, 255, 0)),
  linear-gradient(165deg, var(--cj) 30%, var(--cj-deep)); }
.ln.m.w.mx::after { background: var(--gem-mastered) center / 100% 100% no-repeat, linear-gradient(165deg, var(--cj) 30%, var(--cj-deep)); }
.ln.m.dust::after, .ln.m.w.dust::after, .ln.m.w.mx.dust::after { background: var(--dust) center / 100% 100% no-repeat, var(--gem-won) center / 100% 100% no-repeat,
  linear-gradient(rgba(214, 206, 196, .12), rgba(214, 206, 196, .12)), linear-gradient(165deg, var(--cj) 30%, var(--cj-deep)); }
.ln.m.r::after { -webkit-mask: none; mask: none; top: calc(var(--M) * -.1); margin-left: calc(var(--M) * .03); width: var(--rw); height: var(--rw); background: var(--gold-gem) center / contain no-repeat; }
.half.arrive .ln.r::after { animation: hop .62s cubic-bezier(.3, .8, .4, 1) 3; }
/* variant: a ring round a small dot (meter=ring) */
.meter-ring .ln.m::after { -webkit-mask: radial-gradient(circle, #000 28%, transparent 30% 46%, #000 48% 68%, transparent 70%); mask: radial-gradient(circle, #000 28%, transparent 30% 46%, #000 48% 68%, transparent 70%);
  height: var(--gw); background: radial-gradient(circle, var(--dot) 30%, transparent 31%), conic-gradient(var(--cj) calc(var(--e) * 1turn), #ddd4c8 0); }
.meter-ring .ln.m.w::after { background: radial-gradient(circle, var(--cj) 30%, transparent 31%), var(--cj); }
/* variant: the letters ink in from pencil to ink as the gem fills (meter=ink); a jewel only when won */
.meter-ink .ln.m { background: linear-gradient(to top, var(--ink) calc(var(--e) * 100%), #b8aea3 0); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
.meter-ink .ln.m::after { display: none; }
.meter-ink .ln.m.w::after, .meter-ink .ln.m.r::after { display: block; }

/* THE SOUND LINE (docs/MULTI_SOUND.md §7.2): a spelling the child has met representing two or more sounds gets a thin
   line under its letters, one segment per sound met, in those petals' colours, this petal's sound first. A segment is
   dashed and faint until the child is sure of it (Sound Detective), then solid. The same line sits under the spelling
   in every petal it lives in. */
.ln.ms { background-image: var(--ms); background-repeat: no-repeat; background-position: 50% calc(100% - var(--msb, 0px)); background-size: 84% var(--msh, 4px); }
/* under a spelling with a descender (g j p q y) the line drops below the tail: the line's box grows downwards by .15 M
   without moving the next line (Andika's descender ends at 1.14 em; the line then sits at 1.19–1.27 em) */
.ln.ms.dsc { box-sizing: content-box; padding-bottom: calc(var(--M) * .15); margin-bottom: calc(var(--M) * -.15); }

/* the focus ring (a trip's ?gem=), the mystery shake: as v1 */
.petal.shake { animation: shake .45s ease-in-out; transform-origin: 117px 60px; }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: rotate(-2.5deg); } 60% { transform: rotate(2deg); } }

/* the grown-ups' key, in sheet 3's empty last row */
.key { grid-column: 1 / -1; align-self: center; justify-self: center; margin-top: 16px; max-width: 900px; padding: 14px 22px; border-radius: 18px;
  border: 2.5px dashed #e3d8ca; color: #7a6c5f; font: 600 21px/1.55 var(--font-ui); text-align: center; }
.key .kt { font: 800 21px/1 var(--font-ui); color: #6d5f53; }
.key .kp { display: inline-block; vertical-align: -12px; width: 20px; height: 40px; margin: 0 3px 0 8px; }
.key .kg { display: inline-block; vertical-align: -7px; width: 30px; height: 28px; margin: 0 1px 0 5px; }
.key .kg.kr { width: 36px; height: 36px; vertical-align: -10px; background: var(--gold-gem) center / contain no-repeat; }
.key .ks { display: inline-block; vertical-align: 3px; width: 34px; height: 5px; margin: 0 4px 0 8px; border-radius: 2px; }
.key b { font: 400 26px/1 var(--font-letters); color: var(--ink); }

/* the page dots: where you are on the chart (3 sheets, 2 halves each). One tall target; tap or drag to jump. */
.pages { position: absolute; left: 1150px; top: 176px; width: 96px; height: 368px; z-index: 30; touch-action: none; cursor: pointer; }
.pages i { position: absolute; left: 40px; width: 16px; height: 16px; border-radius: 8px; background: #d9cbb8; transition: height .3s cubic-bezier(.3, 1.3, .5, 1), background .3s, transform .3s; }
.pages i.on { background: var(--ink); height: 40px; }

/* ================================================================== the frame: Home, the view switch, Hear it again, Help */
.btn-round { position: absolute; width: 100px; height: 100px; border-radius: 50%; display: grid; place-items: center; z-index: 30;
  background: radial-gradient(circle at 35% 30%, #fff 0%, var(--gold) 45%, var(--gold-deep) 100%); border: 5px solid var(--ink); box-shadow: 0 6px 0 var(--ink); }
.btn-round:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
.btn-round svg { width: 54%; height: 54%; }
.btn-round.pink { background: radial-gradient(circle at 35% 30%, #ffe3ee 0%, var(--blossom) 50%, var(--blossom-deep) 100%); }
.btn-round.go { background: radial-gradient(circle at 35% 30%, #d9ffe4 0%, var(--good) 50%, var(--good-deep) 100%); }
.btn-round.sm { width: 84px; height: 84px; border-width: 4px; box-shadow: 0 5px 0 var(--ink); }
.home { left: 18px; top: 16px; z-index: 84; }
.toggle { left: 18px; top: 150px; }
.toggle svg { width: 70%; height: 70%; }
.again { left: 1162px; top: 16px; }
.help-btn { position: absolute; right: 14px; bottom: 14px; z-index: 85; width: 124px; height: 124px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #fff8e6, #ffd98a 70%, #e0a53a); border: 6px solid var(--ink); box-shadow: 0 7px 0 var(--ink), 0 0 0 6px rgba(255, 244, 220, .8); }
.help-btn img { position: absolute; inset: 5px; width: calc(100% - 10px); height: calc(100% - 10px); border-radius: 50%; object-fit: cover; }
.help-btn.talk img { animation: talk .3s ease-in-out infinite alternate; }

.big .ln.hint { font-size: min(var(--BF), calc(var(--BM) * .6)); height: calc(min(var(--BF), calc(var(--BM) * .6)) * 1.3); pointer-events: none; }
.big .ln.m::after { margin-left: calc(var(--BM) * .02); top: calc(var(--BM) * .182); }

.big .ln.sel { background-color: color-mix(in srgb, var(--c) 16%, #fff); box-shadow: 0 0 0 4px var(--c); }
.card .pic-big { position: absolute; left: 226px; top: 18px; width: 112px; height: 112px; z-index: 3; object-fit: contain; pointer-events: none; }
.card .close { left: 866px; top: 18px; width: 92px; height: 92px; }

/* the header: ONE speaker (the sound, then the chosen spelling's words) and the chosen spelling with its big gem */
.spk { position: absolute; left: 370px; top: 30px; width: 116px; height: 116px; }

.spk.hint::before { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 6px solid #fff3b0; animation: ring3 1s ease-in-out 3 both; }
@keyframes ring3 { 0%, 100% { transform: scale(.92); opacity: 1; } 50% { transform: scale(1.12); opacity: .35; } }
.chosen { position: absolute; left: 512px; top: 34px; height: 108px; padding: 0 26px 0 30px; border-radius: 30px; background: #fff; border: 5px solid var(--c);
  display: flex; align-items: center; gap: 18px; font: 400 76px/1 var(--font-letters); font-variant-ligatures: none; }
.chosen::before { content: ""; position: absolute; left: -24px; top: 34px; border: 13px solid transparent; border-right: 19px solid var(--c); }
.chosen:active > span { transform: scale(.96); }
.chosen .gm { width: 64px; height: 58px; position: relative; flex: none; }
/* the chosen spelling's big gem and the fork panel's gems: the same four looks as the chart's meter (§3.2) */
.chosen .gm::after, .sense .sp .g i::after { content: ""; position: absolute; inset: 0;
  background: var(--gem-line) center / 100% 100% no-repeat, linear-gradient(to top, var(--cj) calc((.056 + .611 * sqrt(var(--e))) * 100%), var(--gem-empty) 0);
  -webkit-mask: var(--m-gem) center / 100% 100% no-repeat; mask: var(--m-gem) center / 100% 100% no-repeat; }
.chosen .gm.w::after, .sense .sp .g i.w::after { background: var(--gem-won) center / 100% 100% no-repeat,
  radial-gradient(calc(7% + 13% * var(--pol, 0)) calc(8% + 14% * var(--pol, 0)) at 34% 30%, rgba(255, 255, 255, .95) 40%, rgba(255, 255, 255, 0)),
  linear-gradient(165deg, var(--cj) 30%, var(--cj-deep)); }
.chosen .gm.w.mx::after, .sense .sp .g i.w.mx::after { background: var(--gem-mastered) center / 100% 100% no-repeat, linear-gradient(165deg, var(--cj) 30%, var(--cj-deep)); }
.chosen .gm.dust::after, .chosen .gm.w.dust::after, .chosen .gm.w.mx.dust::after, .sense .sp .g i.dust::after, .sense .sp .g i.w.dust::after, .sense .sp .g i.w.mx.dust::after {
  background: var(--dust) center / 100% 100% no-repeat, var(--gem-won) center / 100% 100% no-repeat,
  linear-gradient(rgba(214, 206, 196, .12), rgba(214, 206, 196, .12)), linear-gradient(165deg, var(--cj) 30%, var(--cj-deep)); }
.chosen .gm.r::after, .sense .sp .g i.r::after { -webkit-mask: none; mask: none; inset: -21px; background: var(--gold-gem) center / contain no-repeat; }

/* a descender (g j p q y): the letters lift 11 px and the sound line drops to the chip's foot, below the tail */
.chosen.dsc > span { transform: translateY(-11px); }

.cap { position: absolute; left: 520px; top: 148px; max-width: 440px; overflow: hidden; text-overflow: ellipsis; font: 700 20px/1 var(--font-ui); color: #7d6e61; letter-spacing: .01em; white-space: nowrap; }

.shelf { position: absolute; left: 370px; top: 178px; width: 580px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.wc { height: 176px; border-radius: 20px; background: #fff; border: 3px solid #eadfd2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px 6px;
  box-shadow: 0 5px 0 #eadfd2; }

.wc.spot { border-color: var(--gold); box-shadow: 0 5px 0 var(--gold-deep), 0 0 0 6px #fff4c8; transform: scale(1.05); }

.also { position: absolute; left: 370px; top: 386px; height: 150px; padding: 0 26px 0 18px; border-radius: 26px; background: #fff; border: 4px solid #eadfd2;
  display: flex; align-items: center; gap: 14px; box-shadow: 0 5px 0 #eadfd2; }

.ms-card .spk { left: 60px; top: 30px; }

.lensgate svg { width: 84%; height: 84%; }

.petal .dots { position: absolute; left: 49px; top: 30px; width: 136px; height: 296px; z-index: 1; pointer-events: none; background: var(--ghost);
  -webkit-mask: var(--m-dots) 0 0 / 100% 100% no-repeat; mask: var(--m-dots) 0 0 / 100% 100% no-repeat; animation: fadeout .5s .5s both; }
.petal.unlock::after { animation: drawin .7s .7s both; transform-origin: 117px 180px; }
.petal.unlock .pic { animation: stick .7s cubic-bezier(.3, 1.6, .5, 1) 1.1s both; }
.petal.unlock .ln { animation: writein .4s ease-out both; animation-delay: calc(1.7s + var(--d)); }
.petal.unlock .fl, .petal.unlock .gl { animation: fadein .9s 2.6s both; }

/** What Sensei says about the chosen gem (existing clips first; the new ones are listed in SCROLL_DESIGN.md §4.4) */
function gemLine(gp, pr) {

function paintSel() {

    others.slice(0, 3).map((s) => `<span class="mini" style="--mc:${coloursOf(s.pt).cj}"><i class="mp"></i><i class="ml"></i><img src="${picUrl(s.pt.p)}" alt=""></span>`).join("") + `</button>` : "";
