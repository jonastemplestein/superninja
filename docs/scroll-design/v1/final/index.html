<!doctype html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#efe4d1" />
<title>Petal Chart Final</title>
<meta name="description" content="Super Ninja's petal chart as the class's laminated sound chart, half a sheet per screen: the final working mockup." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;600;700;800&display=block" rel="stylesheet" />
<!--
  The FINAL design for the World Flower's petal chart (docs/SCROLL_DESIGN.md). A working mockup, not game code: one
  file, the game's own art and voice (public/a/…, by relative path) and the petal data from src/content/flower.ts
  (CHART_PETALS / PETALS, dumped 27 Sep 2026). Serve the repo root over http (the silhouettes are CSS masks of the
  pictures, which need the same origin), then open /docs/scroll-design/final/ with:
    ?child=year1|reception|new   the audit's three saves (default year1)
    &open=<petal>                open that petal's card
    &at=<petal>                  land on that petal's half-sheet
    &focus=<gem key>             land on it with the focus ring (a trip's ?gem=)
    &land=<gem key>              the gem-won landing (after the gem victory), e.g. land=ai>ae
    &unlock=<gem key>            a spelling just met (after its trip), e.g. child=reception&unlock=ai>ae
    &slow=<n>                    the landing and the unlock n times slower (for stills)
    &whole=1                     every sheet in one tall picture          &quiet=1  no voice on arrival
-->
<style>
:root {
  --ink: #2b1d14; --ink-soft: #5a4636;
  --wall: #efe4d1;                  /* the classroom wall; the letterbox is painted the same, so there are no bars */
  --paper: #fffefb;
  --pencil: #8b8177;                /* a spelling still to find (3.8:1 on the paper) */
  --pencil-x: #aaa095;              /* a spelling this version can't teach yet (2.5:1) */
  --gold: #ffc53d; --gold-deep: #c98a00; --good: #3fbf6a; --good-deep: #1f7a41;
  --blossom: #ff7aa2; --blossom-deep: #d9477a;
  --font-letters: "Andika", "Comic Sans MS", system-ui, sans-serif;
  --font-ui: "Baloo 2", "Andika", system-ui, sans-serif;
  --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
  --sal: env(safe-area-inset-left); --sar: env(safe-area-inset-right);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--wall); font-family: var(--font-ui); color: var(--ink); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; border: 0; padding: 0; background: none; cursor: pointer; touch-action: manipulation; }
img { -webkit-user-drag: none; user-select: none; }

/* ---------- the stage: 1280×720, scaled as src/ui/ui.tsx Stage does. The viewport is the wall too (no bars). */
.viewport { position: fixed; inset: 0; background: var(--wall); transition: background .2s; }
.card-open .viewport { background: #a19485; } /* the scrim's colour over the wall: the letterbox dims with the stage */
.stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; contain: layout paint; background: var(--wall); }

/* ---------- the chart: the whole stage scrolls, top to bottom, one half-sheet per screen (native, snapping) */
.scroller { position: absolute; inset: 0; z-index: 1; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
  scroll-snap-type: y mandatory; touch-action: pan-y; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.scroller::-webkit-scrollbar { display: none; }
.scroller.dragging { scroll-snap-type: none; }
.board { position: relative; width: 1280px; }
.edge { position: absolute; left: 0; right: 0; height: 18px; z-index: 2; pointer-events: none; }
.edge.t { top: 0; background: linear-gradient(var(--wall), rgba(239, 228, 209, 0)); }
.edge.b { bottom: 0; background: linear-gradient(rgba(239, 228, 209, 0), var(--wall)); }
.whole .edge { display: none; }

/* a laminated A4 sheet: white paper, the film's edge, a soft shadow and two drawing pins, pinned to the wall */
.sheet { position: relative; width: 936px; margin-left: 172px; }
.sheet::before { content: ""; position: absolute; left: 0; right: 0; top: 16px; bottom: 16px; background: var(--paper); border-radius: 14px;
  box-shadow: 0 0 0 7px rgba(255, 255, 255, .72), 0 0 0 8.5px rgba(128, 146, 168, .34), 0 18px 26px -14px rgba(74, 42, 20, .42); }
.sheet::after { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 30px; pointer-events: none; z-index: 3;
  background:
    radial-gradient(circle at 40% 36%, rgba(255, 255, 255, .85) 0 3px, transparent 4px) left 16px top 0 / 30px 30px no-repeat,
    radial-gradient(circle at 50% 50%, var(--pin) 0 10px, var(--pin-d) 11px 12px, transparent 13px) left 16px top 0 / 30px 30px no-repeat,
    radial-gradient(circle at 40% 36%, rgba(255, 255, 255, .85) 0 3px, transparent 4px) right 16px top 0 / 30px 30px no-repeat,
    radial-gradient(circle at 50% 50%, var(--pin) 0 10px, var(--pin-d) 11px 12px, transparent 13px) right 16px top 0 / 30px 30px no-repeat; }
/* half a sheet = one screen: 2 rows × 4 petals, exactly 720 tall, a snap point; skipped when far away */
.half { position: relative; z-index: 1; height: 720px; display: grid; grid-template-columns: repeat(4, 234px); grid-template-rows: repeat(2, 334px);
  align-content: start; padding-top: 40px; scroll-snap-align: start; scroll-snap-stop: always;
  content-visibility: auto; contain-intrinsic-size: auto 936px 720px; }
.half.lo { padding-top: 12px; }

/* ---------- a petal: the chart's slim downward teardrop, 136 × 296 (0.46), in a 234 × 334 cell that is the button.
   ::after = the thin outline in the sound's colour (a CSS mask of one SVG teardrop: no SVG nodes), ::before = the
   gold star at the point once every gem is won. Inside: nothing but the spellings, stacked, as on the chart. */
.petal { position: relative; display: block; width: 234px; height: 334px; cursor: pointer; outline: none; }
.petal::after { content: ""; position: absolute; left: 49px; top: 30px; width: 136px; height: 296px; pointer-events: none; background: var(--c);
  -webkit-mask: var(--m-line) 0 0 / 100% 100% no-repeat; mask: var(--m-line) 0 0 / 100% 100% no-repeat; }
.petal.done::before { content: ""; position: absolute; left: 97px; top: 305px; width: 40px; height: 40px; z-index: 2; pointer-events: none;
  background: var(--star) center / contain no-repeat; }
.petal:active .col, .petal:active .pic { transform: scale(.97); }
.pic { position: absolute; left: 154px; top: -2px; width: 72px; height: 72px; object-fit: contain; z-index: 2; pointer-events: none; }
.col { position: absolute; left: 49px; top: 30px; width: 136px; height: 296px; padding-top: var(--top); z-index: 1; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; }

/* the spellings: Andika, regular, black when the child has met them, pencil grey while still to find */
.ln { position: relative; flex: none; font-family: var(--font-letters); font-weight: 400; line-height: 1; white-space: nowrap;
  font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
.ln + .ln { margin-top: var(--gap, 0px); }
.ln.m { font-size: var(--M); height: calc(var(--M) * 1.12); color: var(--ink); }
.ln.f { font-size: var(--F); height: calc(var(--F) * 1.2); color: var(--pencil); }
.ln.f.x { color: var(--pencil-x); }
.ln.hint { font-size: min(var(--F), calc(var(--M) * .6)); height: calc(min(var(--F), calc(var(--M) * .6)) * 1.3); color: var(--ink-soft); }
.ln.hint b { font-weight: 400; color: var(--ink-c); }
/* one small mark to the right of the column, never on the letters: won = a jewel in the petal's colour,
   glowing (ready for a gem battle) = a gold gem with a glint. Charging has no mark on the sheet. */
.ln.w::after, .ln.r::after { content: ""; position: absolute; left: 100%; top: 18%; margin-left: calc(var(--M) * .1);
  width: calc(var(--M) * .52); height: calc(var(--M) * .47); background: var(--jewel) center / contain no-repeat; pointer-events: none; }
.ln.r::after { top: -2%; margin-left: calc(var(--M) * .03); width: max(30px, calc(var(--M) * .66)); height: max(30px, calc(var(--M) * .66)); background-image: var(--gold-gem); }
/* ready gems hop three times when their half-sheet arrives (or on Help), then rest: nothing endless */
.half.arrive .ln.r::after { animation: hop .62s cubic-bezier(.3, .8, .4, 1) 3; }
@keyframes hop { 0%, 100% { transform: none; } 38% { transform: translateY(-42%) scale(1.12) rotate(-8deg); } 70% { transform: translateY(4%) scale(.96); } }

/* not met yet: the petal is there, in its place and its colour, dotted, with its picture as a silhouette */
.petal.mys::after { -webkit-mask-image: var(--m-dots); mask-image: var(--m-dots); opacity: .8; }
.sil { position: absolute; left: 154px; top: -2px; width: 72px; height: 72px; z-index: 2; pointer-events: none; background: var(--sil);
  -webkit-mask: var(--pic) center / contain no-repeat; mask: var(--pic) center / contain no-repeat; }
.petal.shake { animation: shake .45s ease-in-out; transform-origin: 117px 60px; }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: rotate(-2.5deg); } 60% { transform: rotate(2deg); } }
.petal.shake .sil { animation: peek .6s ease-in-out; }
@keyframes peek { 0%, 100% { transform: none; } 30% { transform: translateY(-8px) rotate(-10deg) scale(1.08); } 65% { transform: rotate(6deg); } }

/* the focus ring (a trip's ?gem=): three soft pulses round the spelling, then it stays */
.ln.focus::before { content: ""; position: absolute; left: -12px; right: -12px; top: -6px; bottom: -4px; border-radius: 999px;
  border: 4px solid var(--gold); background: rgba(255, 214, 90, .18); animation: ring3 1s ease-in-out 3; }
@keyframes ring3 { 0%, 100% { transform: none; opacity: 1; } 50% { transform: scale(1.12); opacity: .45; } }

/* grown-ups' key, under the last row of sheet 3 */
.key { grid-column: 1 / -1; align-self: center; justify-self: center; margin-top: 40px; max-width: 820px; padding: 18px 26px; border-radius: 18px;
  border: 3px dashed #e6ddd1; color: #6d5f53; font: 600 25px/1.35 var(--font-ui); text-align: center; }
.key i { display: inline-block; vertical-align: -4px; width: 26px; height: 24px; background: center / contain no-repeat; margin: 0 4px; }
.key b { font: 400 28px/1 var(--font-letters); color: var(--ink); } .key s { text-decoration: none; font: 400 28px/1 var(--font-letters); color: var(--pencil); }

/* ---------- the unlock (a sound met for the first time) and a spelling inked in */
.petal.unlock::after { animation: fadein .5s ease-out both; }
.petal.unlock .dots { position: absolute; left: 49px; top: 30px; width: 136px; height: 296px; background: var(--c); opacity: .8; pointer-events: none;
  -webkit-mask: var(--m-dots) 0 0 / 100% 100% no-repeat; mask: var(--m-dots) 0 0 / 100% 100% no-repeat; animation: fadeout .5s ease-out both; }
.petal.unlock .sil { animation: fadeout .35s ease-out .25s both; }
.petal.unlock .pic { animation: stick .7s cubic-bezier(.3, 1.6, .5, 1) .3s both; }
.petal.unlock .ln { animation: writein .4s ease-out both; animation-delay: calc(var(--d) + 900ms); }
@keyframes fadein { from { opacity: 0; } } @keyframes fadeout { to { opacity: 0; } }
@keyframes stick { 0% { transform: scale(.2) rotate(-25deg); opacity: 0; } 60% { transform: scale(1.18) rotate(6deg); opacity: 1; } 100% { transform: none; } }
@keyframes writein { from { opacity: 0; transform: translateY(8px) scale(.9); } }
.ln.inked { animation: inked .7s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes inked { 0% { transform: scale(.6); opacity: .2; } 55% { transform: scale(1.25); opacity: 1; } 100% { transform: none; } }
/* the landing: the won jewel arrives beside its spelling */
.ln.pending::after { opacity: 0; }
.ln.landed { animation: inked .6s cubic-bezier(.3, 1.6, .5, 1) both; }
.ln.landed::after { animation: land .5s cubic-bezier(.3, 1.8, .5, 1) both; }
@keyframes land { 0% { transform: scale(2.2); opacity: .3; } 100% { transform: none; opacity: 1; } }

/* ---------- the frame: Home top-left and the World Flower under it; Hear it again top-right and the map under it;
   Help bottom-right (docs/NAVIGATION.md §3.1). Nothing else to tap outside the sheet. */
.btn-round { position: absolute; width: 100px; height: 100px; border-radius: 50%; display: grid; place-items: center; z-index: 30;
  background: radial-gradient(circle at 35% 30%, #fff 0%, var(--gold) 45%, var(--gold-deep) 100%); border: 5px solid var(--ink); box-shadow: 0 6px 0 var(--ink); }
.btn-round:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
.btn-round svg { width: 54%; height: 54%; }
.btn-round.pink { background: radial-gradient(circle at 35% 30%, #ffe3ee 0%, var(--blossom) 50%, var(--blossom-deep) 100%); }
.btn-round.go { background: radial-gradient(circle at 35% 30%, #d9ffe4 0%, var(--good) 50%, var(--good-deep) 100%); }
.btn-round.sm { width: 76px; height: 76px; border-width: 4px; box-shadow: 0 5px 0 var(--ink); }
.home { left: 18px; top: 16px; z-index: 84; }
.flower { left: 18px; top: 150px; }
.flower svg { width: 72%; height: 72%; }
.again { left: 1162px; top: 16px; }
.next { left: 964px; top: 562px; width: 132px; height: 132px; z-index: 84; opacity: 0; transform: scale(.6); pointer-events: none; transition: opacity .3s, transform .4s cubic-bezier(.3, 1.6, .5, 1); }
.next.on { opacity: 1; transform: none; pointer-events: auto; }
.next svg { width: 60%; height: 60%; }
.help-btn { position: absolute; right: 14px; bottom: 14px; z-index: 85; width: 124px; height: 124px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #fff8e6, #ffd98a 70%, #e0a53a); border: 6px solid var(--ink); box-shadow: 0 7px 0 var(--ink), 0 0 0 6px rgba(255, 244, 220, .8); }
.help-btn img { position: absolute; inset: 5px; width: calc(100% - 10px); height: calc(100% - 10px); border-radius: 50%; object-fit: cover; }
.help-q { position: absolute; left: -10px; top: -10px; width: 46px; height: 46px; border-radius: 50%; background: var(--good); border: 5px solid var(--ink);
  color: #fff; font: 800 30px/36px var(--font-ui); text-align: center; text-shadow: 0 2px 0 var(--ink); }

/* the map: the three sheets in miniature (the chart-wide progress bar: a petal colours in when met, fills when
   complete, a gold dot where a gem is glowing) and a frame round the half-sheet on screen. Tap or drag to go there. */
.map { position: absolute; left: 1146px; top: 136px; width: 124px; height: 420px; z-index: 30; touch-action: none; }
.msheet { position: absolute; left: 10px; width: 104px; height: 128px; background: #fffefb; border-radius: 8px;
  box-shadow: 0 0 0 2.5px rgba(128, 146, 168, .4), 0 5px 8px -3px rgba(74, 42, 20, .4); }
.mk { position: absolute; width: 13px; height: 25px; background: #e4ddd3; -webkit-mask: var(--m-fill) 0 0 / 100% 100%; mask: var(--m-fill) 0 0 / 100% 100%; }
.mk.met { background: var(--mc); opacity: .5; }
.mk.done { background: var(--mc); opacity: 1; }
.mdot { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 1.5px var(--ink); }
.mframe { position: absolute; left: 3px; top: 0; width: 118px; height: 70px; border: 5px solid var(--ink); border-radius: 12px; pointer-events: none;
  background: rgba(255, 197, 61, .14); box-shadow: 0 0 0 2px rgba(255, 255, 255, .85); transition: transform .32s cubic-bezier(.3, 1.3, .5, 1); }
.mk.pulse { animation: mkpulse .8s ease-out 2; }
@keyframes mkpulse { 50% { transform: scale(1.7); } }

/* Sensei's caption (grown-ups read it; the children hear it). Off on the chart by default, as in the game. */
.bubble { position: absolute; right: 150px; bottom: 26px; z-index: 86; max-width: 470px; padding: 10px 18px; font: 700 24px/1.2 var(--font-ui);
  background: #fffdf6; border: 4px solid var(--ink); border-radius: 24px; box-shadow: 0 5px 0 rgba(43, 29, 20, .35);
  opacity: 0; transform: translateY(10px); transition: opacity .2s, transform .2s; pointer-events: none; }
.bubble.on { opacity: 1; transform: none; }
.bubble::after { content: ""; position: absolute; right: -22px; bottom: 22px; border: 12px solid transparent; border-left: 18px solid var(--ink); }

/* ---------- the petal's card: the same petal up close on a laminated flash card, grown out of the tapped petal.
   The scrim covers everything but Home and Help; a tap on it closes the card. */
.scrim { position: absolute; inset: 0; z-index: 60; background: rgba(43, 29, 20, .40); opacity: 0; transition: opacity .2s; }
.card-open .scrim { opacity: 1; }
.card-open .again, .card-open .flower, .card-open .map { visibility: hidden; }
.card { position: absolute; left: 150px; top: 20px; width: 980px; height: 680px; z-index: 61; background: var(--paper); border-radius: 26px;
  box-shadow: 0 0 0 8px rgba(255, 255, 255, .75), 0 0 0 9.5px rgba(128, 146, 168, .42), 0 24px 40px -18px rgba(30, 15, 5, .6); }
.big { position: absolute; left: 50px; top: 104px; width: 250px; height: 560px; }
.big-line { position: absolute; inset: 0; background: var(--c); -webkit-mask: var(--m-bigline) 0 0 / 100% 100% no-repeat; mask: var(--m-bigline) 0 0 / 100% 100% no-repeat; pointer-events: none; }
.big.done::before { content: ""; position: absolute; left: 99px; top: 532px; width: 52px; height: 52px; background: var(--star) center / contain no-repeat; z-index: 2; }
.big-col { position: absolute; inset: 0; padding-top: var(--top); display: flex; flex-direction: column; align-items: center; }
.big { cursor: pointer; }
.big .ln { border-radius: 999px; padding: 0 12px; }
.big .ln.m { font-size: var(--BM); height: calc(var(--BM) * 1.12); }
.big .ln.f { font-size: var(--BF); height: calc(var(--BF) * 1.2); }
.big .ln.hint { font-size: min(var(--BF), calc(var(--BM) * .6)); height: calc(min(var(--BF), calc(var(--BM) * .6)) * 1.3); pointer-events: none; }
.big .ln.w::after, .big .ln.r::after, .big .ln.c::after { width: calc(var(--BM) * .5); height: calc(var(--BM) * .45); margin-left: calc(var(--BM) * .02); }
.big .ln.r::after { width: calc(var(--BM) * .6); height: calc(var(--BM) * .6); top: 2%; }
/* on the card, a charging gem shows its energy: a ring filling with gold */
.big .ln.c::after { content: ""; position: absolute; left: 100%; top: 16%; margin-left: 4px; width: calc(var(--BM) * .5); height: calc(var(--BM) * .5); border-radius: 50%;
  background: conic-gradient(var(--gold) calc(var(--e) * 1turn), #ded4c7 0); -webkit-mask: radial-gradient(circle, transparent 44%, #000 46%); mask: radial-gradient(circle, transparent 44%, #000 46%); }
.big .ln.sel { background: color-mix(in srgb, var(--c) 14%, #fff); box-shadow: 0 0 0 4px var(--c); }
.hear { position: absolute; left: 246px; top: 18px; width: 112px; height: 112px; z-index: 3; }
.hear img { width: 100%; height: 100%; object-fit: contain; }
.hear .spk { position: absolute; right: -10px; bottom: -6px; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #fff 0%, var(--gold) 45%, var(--gold-deep) 100%); border: 4px solid var(--ink); }
.hear .spk svg { width: 64%; height: 64%; }
.card .close { left: 866px; top: 20px; width: 92px; height: 92px; }
.trial { position: absolute; width: 104px; height: 104px; z-index: 4; }
.trial svg { width: 52%; height: 52%; margin-left: 8%; }
.trial.bob { animation: bob .7s ease-in-out 3; }
@keyframes bob { 50% { transform: scale(1.1); } }
.sensei { position: absolute; left: 414px; top: 30px; width: 116px; height: 116px; border-radius: 50%; border: 5px solid var(--ink); overflow: hidden;
  background: radial-gradient(circle at 40% 35%, #fff8e6, #ffd98a 70%, #e0a53a); box-shadow: 0 6px 0 var(--ink); }
.sensei img { width: 100%; height: 100%; object-fit: cover; }
.sensei.talk img { animation: talk .3s ease-in-out infinite alternate; }
@keyframes talk { to { transform: scale(1.06) translateY(-2px); } }
.say-chip { position: absolute; left: 562px; top: 40px; min-width: 120px; height: 96px; padding: 0 26px; border-radius: 30px; background: #fff;
  border: 5px solid var(--c); display: grid; place-items: center; font: 400 66px/1 var(--font-letters); color: var(--ink); font-variant-ligatures: none; }
.say-chip::before { content: ""; position: absolute; left: -22px; top: 30px; border: 12px solid transparent; border-right: 18px solid var(--c); }
.say-chip:empty { display: none; }
.shelf { position: absolute; left: 414px; top: 166px; width: 552px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.wc { height: 150px; border-radius: 18px; background: #fff; border: 3px solid #e5ddd2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 6px;
  box-shadow: 0 4px 0 #e5ddd2; }
.wc:active { transform: translateY(3px); box-shadow: 0 1px 0 #e5ddd2; }
.wc img { width: 76px; height: 76px; object-fit: contain; flex: none; }
.wc .wt { font: 700 50px/1.05 var(--font-letters); color: var(--ink); white-space: nowrap; font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
.wc .wt b { color: var(--ink-c); font-weight: 700; background: linear-gradient(transparent 62%, var(--wash) 62% 94%, transparent 94%); }
.wc.spot { border-color: var(--gold); box-shadow: 0 4px 0 var(--gold-deep), 0 0 0 5px #fff4c8; transform: scale(1.06); }
.card .gate { left: 808px; top: 530px; width: 128px; height: 128px; }
.card .gate svg { width: 64%; height: 64%; }
.gate-chip { position: absolute; left: 872px; top: 488px; translate: -50% 0; z-index: 32; min-width: 50px; padding: 0 12px; height: 50px; border-radius: 14px;
  background: #fff; border: 4px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font: 400 36px/42px var(--font-letters); text-align: center; font-variant-ligatures: none; }

/* sparks and rings (transform and opacity only; each removes itself) */
.ring { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 10px solid var(--rc, #ffd24a); z-index: 69; pointer-events: none; }
.spark { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; z-index: 70; pointer-events: none; background: var(--sc, #ffd24a);

function gemState(gem) {

  card.animate([{ transform: "none", opacity: 1 }, { transform: "scale(.22)", opacity: 0 }], { duration: 200, easing: "ease-in", fill: "forwards" }).onfinish = () => { if (!cardPt) layer.innerHTML = ""; };
}
layer.addEventListener("click", (e) => {
  const t = e.target;
  if (t.id === "scrim" || t.closest("#close")) return closeCard();
  if (t.closest("#hear")) return sound(cardPt.p);
  if (t.closest("#sensei")) return explain();
  if (t.closest("#gate")) return toast(`To the dojo: practise ‹${document.getElementById("gateChip").textContent}›`);
  const tr = t.closest(".trial"); if (tr) return toast(`Gem battle! ‹${gemByKey(tr.dataset.key).g}›`);
  const wc = t.closest(".wc"); if (wc) return word(wc.dataset.w);
  // the column is one target: the spelling nearest the finger (a bot's event on a spelling itself picks that one)
  let ln = t.closest(".big .ln");
  if (!ln && t.closest(".big")) {
    const lines = [...layer.querySelectorAll(".big .ln[data-st]")];
    ln = lines.sort((a, b) => Math.abs(e.clientY - (a.getBoundingClientRect().top + a.getBoundingClientRect().height / 2)) - Math.abs(e.clientY - (b.getBoundingClientRect().top + b.getBoundingClientRect().height / 2)))[0] || null;
  }
  if (ln && ln.dataset.st) {
    const st = ln.dataset.st;
    if (st === "hidden") return say("gem_hidden");
    if (st === "future") return say("gem_future");
    selKey = ln.dataset.key; markSel(); renderWords();
    if (st === "ready") return toast(`Gem battle! ‹${gemByKey(selKey).g}›`); // as today: a glowing gem starts its Gem Trial
    return explain();
  }
  if (t.closest(".big")) return sound(cardPt.p);
});
// the letterbox is part of the scrim too: a tap beside the stage closes the card (the bars are a quarter of a phone)
document.getElementById("viewport").addEventListener("pointerdown", (e) => { if (cardPt && e.target.id === "viewport") closeCard(); });
function toast(t) { bubble.textContent = t; bubble.classList.add("on"); clearTimeout(bubbleT); bubbleT = setTimeout(() => bubble.classList.remove("on"), 1600); }

// ------------------------------------------------------------------ celebrations on the sheet: sparks, rings, the landing, the unlock
const stageEl = document.getElementById("stage");
function stageBox() { const r = stageEl.getBoundingClientRect(); return { x: r.left, y: r.top, s: r.width / 1280 }; }
function stageScale() { return stageBox().s; }
function stagePos(el, fx = 0.5, fy = 0.5) { const st = stageBox(), r = el.getBoundingClientRect(); return { x: (r.left + r.width * fx - st.x) / st.s, y: (r.top + r.height * fy - st.y) / st.s }; }
function burst(x, y, n, colours, dist) {
  for (let i = 0; i < n; i++) {
    const s = document.createElement("i"); s.className = "spark";
    s.style.left = x + "px"; s.style.top = y + "px"; s.style.setProperty("--sc", colours[i % colours.length]);
    stageEl.appendChild(s);
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.4, d = dist * (0.55 + Math.random() * 0.6);
    s.animate([{ transform: "translate(0,0) scale(.3) rotate(0deg)", opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) scale(${0.7 + Math.random() * 0.8}) rotate(${Math.random() * 180}deg)`, opacity: 0 }],
      { duration: ms(650 + Math.random() * 400), easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => s.remove();
  }
}
function ring(x, y, scale, colour) {
  const r = document.createElement("i"); r.className = "ring"; r.style.left = x + "px"; r.style.top = y + "px"; r.style.setProperty("--rc", colour || "#ffd24a");
  stageEl.appendChild(r);
  r.animate([{ transform: "scale(.2)", opacity: 1 }, { transform: `scale(${scale})`, opacity: 0 }], { duration: ms(700), easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => r.remove();
}
const wait = (t) => new Promise((r) => setTimeout(r, t));
/** The gem-won landing: back from the gem victory, the won jewel flies down onto the chart and settles beside its spelling. */
async function landGem(key) {
  const pt = petalOfKey(key), gem = gemByKey(key), k = coloursOf(pt);
  const line = petalEls[pt.p].querySelector(`[data-gem-chip="${CSS.escape(key)}"]`);
  if (!line) return;
  line.classList.add("pending");
  await wait(ms(700));
  const M = +petalEls[pt.p].dataset.m;
  const to = stagePos(line, 1, 0.5); to.x += M * 0.36; to.y -= M * 0.06;
  const f = document.createElement("div"); f.className = "flyer"; f.style.setProperty("--jewel", k.jewel);
  f.innerHTML = "<i></i>"; stageEl.appendChild(f);
  // it comes from where the victory left it (the middle of the stage), big and glowing, rises and dives into its place
  const from = { x: 640, y: 380 }, scaleTo = (M * 0.52) / 110, peak = { x: from.x + (to.x - from.x) * 0.45, y: Math.min(from.y, to.y) - 120 };
  const anim = f.animate([
    { transform: `translate(${from.x}px,${from.y}px) scale(.4) rotate(-20deg)`, opacity: 0 },
    { transform: `translate(${from.x}px,${from.y - 20}px) scale(1.5) rotate(0deg)`, opacity: 1, offset: 0.22 },
    { transform: `translate(${peak.x}px,${peak.y}px) scale(1.15) rotate(160deg)`, opacity: 1, offset: 0.6 },
    { transform: `translate(${to.x}px,${to.y}px) scale(${scaleTo}) rotate(360deg)`, opacity: 1 },
  ], { duration: ms(1300), easing: "cubic-bezier(.4,0,.3,1)", fill: "forwards" });
  // a little trail of sparkles behind it
  for (let i = 1; i <= 4; i++) setTimeout(() => { const m = new DOMMatrix(getComputedStyle(f).transform); burst(m.e, m.f, 3, ["#fff3b0", "#ffd24a", k.jc], 40); }, ms(360 + i * 180));
  window.__landAnim = anim;
  await anim.finished;
  f.remove();
  window.__landed = performance.now();
  line.classList.remove("pending"); line.classList.add("landed");
  ring(to.x, to.y, 2.4, mix(k.jc, "#2b1d14", 0.15)); ring(to.x, to.y, 1.5, "#ffd24a");
  burst(to.x, to.y, 16, ["#fff3b0", k.jc, "#ffd24a"], 150);
  mapMarks[pt.p].classList.add("pulse"); renderMark(pt);
  sfx.chime();
  if (petalDone(pt)) petalEls[pt.p].classList.add("done");
  await wait(ms(900));
  document.getElementById("next").classList.add("on");
}
/** A spelling just met (after its trip): a new sound unlocks its petal; a new spelling of a known sound is inked in. */
async function unlockGem(key) {
  const gem = gemByKey(key), pt = petalOfKey(key), el = petalEls[pt.p];
  const wasMet = petalMet(pt);
  await wait(ms(900));
  known.add(spellingOf(gem));
  renderPetal(pt); renderMark(pt);
  const c = stagePos(el, 0.5, 0.35);
  if (!wasMet) {
    el.insertAdjacentHTML("afterbegin", `<i class="dots"></i><i class="sil"></i>`);
    el.style.setProperty("--sil", coloursOf(pt).sil); el.style.setProperty("--pic", `url(${picUrl(pt.p)})`);
    el.classList.add("unlock");
    if (SLOW > 1) requestAnimationFrame(() => el.getAnimations({ subtree: true }).forEach((a) => (a.playbackRate = 1 / SLOW)));
    sfx.tink();
    await wait(ms(600)); ring(c.x, c.y, 2.6, pt.colour); burst(c.x, c.y, 14, ["#fff3b0", pt.colour, "#ffd24a"], 190); sfx.chime();
    await wait(ms(1600)); el.classList.remove("unlock"); el.querySelectorAll(".dots, .sil").forEach((x) => x.remove());
  } else {
    const line = el.querySelector(`[data-gem-chip="${CSS.escape(key)}"]`);
    line?.classList.add("inked");
    const p = line ? stagePos(line) : c; burst(p.x, p.y, 10, ["#fff3b0", pt.colour, "#ffd24a"], 110); sfx.tink();
  }
  mapMarks[pt.p].classList.add("pulse");
}

// ------------------------------------------------------------------ the frame's buttons
document.getElementById("home").addEventListener("click", () => toast("Home: to the map"));
document.getElementById("flower").addEventListener("click", () => toast("Back to the World Flower"));
document.getElementById("again").addEventListener("click", () => say(...lastSaid));
document.getElementById("next").addEventListener("click", () => toast("Next: carry on"));
document.getElementById("help").addEventListener("click", () => {
  if (cardPt) return say("wf_help_petal");
  say("help_flower");
  // "a bouncing gem is ready": the ready gems on this half-sheet hop again
  const h = halves[current]; if (h) { h.classList.remove("arrive"); void h.offsetWidth; h.classList.add("arrive"); }
});
document.getElementById("flowerIcon").innerHTML = ["#e8312f", "#f7a23b", "#f3c74a", "#2fa65a", "#2ec4b6", "#4a7dff", "#8a3be0", "#f0226b"].map((c, i) =>
  `<path d="M0,20 C-2.88,11.2 -12,2.4 -12,-8 A12,12 0 0 1 12,-8 C12,2.4 2.88,11.2 0,20 Z" transform="rotate(${i * 45}) translate(0 -34)" fill="${c}" stroke="#2b1d14" stroke-width="4"/>`).join("") +
  `<circle r="17" fill="#ffc53d" stroke="#2b1d14" stroke-width="5"/>`;

// ------------------------------------------------------------------ the stage fit (src/ui/ui.tsx Stage)
function fitStage() {
  if (WHOLE) { stageEl.style.transform = `scale(${innerWidth / 1280})`; stageEl.style.left = "0"; stageEl.style.top = "0"; return; }
  const cs = getComputedStyle(document.documentElement), inset = (v) => parseFloat(cs.getPropertyValue(v)) || 0;
  const touch = matchMedia("(pointer: coarse)").matches;
  const top = Math.max(inset("--sat"), touch ? 10 : 0), bottom = Math.max(inset("--sab"), touch ? 26 : 0);
  const left = Math.max(inset("--sal"), touch ? 8 : 0), right = Math.max(inset("--sar"), touch ? 8 : 0);
  const aw = innerWidth - left - right, ah = innerHeight - top - bottom, s = Math.min(aw / 1280, ah / 720);
  stageEl.style.left = `${left + aw / 2}px`; stageEl.style.top = `${top + ah / 2}px`;
  stageEl.style.transform = `scale(${s}) translate(-50%, -50%)`;
}
addEventListener("resize", fitStage); addEventListener("orientationchange", fitStage);
fitStage();

// ------------------------------------------------------------------ go: wait for Andika (the fit measures it), build, land on the child's own sounds
(async () => {
  if (WHOLE) { document.body.classList.add("whole"); document.documentElement.classList.add("whole"); }
  try { await Promise.all([document.fonts.load("400 50px Andika"), document.fonts.load("700 40px Andika"), document.fonts.load("800 30px 'Baloo 2'")]); } catch {}
  const t0 = performance.now(); buildBoard(); buildMap(); window.__buildMs = performance.now() - t0;
  // where to land (set before the first paint: the chart never moves by itself): a trip's gem, a glowing gem (the
  // thing to do next), else the child's newest sound, else the start
  const byKey = (k) => (k && gemByKey(k) ? petalOfKey(k) : null);
  const newest = [...kid.known].reverse().map((s) => PETALS.find((pt) => pt.gems.some((g) => g.g === s && isMet(gemState(g))))).find(Boolean);
  const target = PETALS.find((x) => x.p === Q.get("at")) || byKey(Q.get("focus")) || byKey(LAND) || byKey(UNLOCK) || PETALS.find(petalReady) || newest || PETALS[0];
  const hi = halfOf(target);
  if (!WHOLE) scroller.scrollTop = hi * 720;
  // the half-sheet on screen: the map's frame moves there, its glowing gems hop (IntersectionObserver: no work while scrolling)
  const io = new IntersectionObserver((es) => { for (const e of es) if (e.isIntersecting) setCurrent(+e.target.dataset.half, true); }, { root: scroller, threshold: 0.6 });
  halves.forEach((h) => io.observe(h));
  setCurrent(hi, false);
  const focus = Q.get("focus");
  if (focus) petalEls[byKey(focus).p].querySelector(`[data-gem-chip="${CSS.escape(focus)}"]`)?.classList.add("focus");
  window.__snState = { scene: "tree", view: 1, open: null };
  document.body.dataset.ready = "1";
  const open = PETALS.find((x) => x.p === Q.get("open"));
  if (open) openCard(open, petalEls[open.p]);
  else if (LAND) landGem(LAND);
  else if (UNLOCK) unlockGem(UNLOCK);
  else if (!WHOLE && !Q.get("quiet")) say("flower_tap");
})();
