<!doctype html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1d1230" />
<title>Petal Chart Scroll</title>
<meta name="description" content="Super Ninja design mockup: the school's petal chart printed on a ninja scroll (Designer 2, chart-on-scroll)." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;600;700;800&display=block" rel="stylesheet" />
<style>
/* ---------------------------------------------------------------- tokens (as src/styles.css) */
:root {
  --ink: #2b1d14; --ink-soft: #5a4636;
  --gold: #ffc53d; --gold-deep: #c98a00;
  --good: #3fbf6a; --good-deep: #1f7a41;
  --blossom: #ff7aa2; --blossom-deep: #d9477a;
  --world: #6cc04a;
  --paper: #fffdf7;
  --ink-hidden: rgba(43, 29, 20, .30);   /* invisible ink: the game teaches it, not met yet */
  --ink-future: rgba(43, 29, 20, .17);   /* invisible ink, fainter: the game can't teach it yet */
  --ink-mystery: rgba(120, 88, 48, .17); /* a sound not met yet: the whole petal, lemon-juice ink */
  --font-letters: "Andika", "Comic Sans MS", system-ui, sans-serif;
  --font-ui: "Baloo 2", "Andika", system-ui, sans-serif;
  color-scheme: light;
}
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: #1d1230; font-family: var(--font-ui); color: var(--ink); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; padding: 0; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }

/* ---------------------------------------------------------------- the stage: 1280×720, scaled to fit like ui.tsx Stage */
.viewport { position: fixed; inset: 0; background: radial-gradient(ellipse at center, color-mix(in srgb, var(--world) 45%, #1d1230) 0%, #1d1230 75%); }
.stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; contain: layout paint; touch-action: none; background: #cfe3b0; }
.backdrop { position: absolute; inset: 0; background: linear-gradient(rgba(255, 250, 238, .38), rgba(255, 250, 238, .38)), url(../../../public/a/i/world_flower_bg.webp) center / cover; }

/* ---------------------------------------------------------------- the scroll: paper window, rollers, ribbon */
.paper-shadow { position: absolute; left: 344px; top: 54px; width: 756px; height: 652px; box-shadow: 0 10px 0 rgba(43, 29, 20, .18), 0 18px 30px rgba(43, 29, 20, .25); border-radius: 2px; }
.petal-scroll {
  position: absolute; left: 344px; top: 54px; width: 756px; height: 652px;
  overflow-x: auto; overflow-y: hidden; touch-action: pan-x; overscroll-behavior-x: contain;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
  background: var(--paper);
  scroll-timeline: --paper x;
}
.petal-scroll::-webkit-scrollbar { display: none; }
.paper { position: relative; height: 652px; background-color: var(--paper); background-image: var(--washi); background-size: 300px 300px; }
/* where one sheet of the chart is pasted to the next: a faint seam in the paper */
.seam { position: absolute; top: 0; bottom: 0; width: 14px; background: linear-gradient(90deg, rgba(120, 90, 50, 0) 0, rgba(120, 90, 50, .07) 45%, rgba(120, 90, 50, .16) 50%, rgba(255, 255, 255, .9) 54%, rgba(120, 90, 50, 0) 100%); pointer-events: none; }

/* the paper curls round the rollers: static shading over the window edges */
.curl { position: absolute; left: 344px; top: 54px; width: 756px; height: 652px; pointer-events: none;
  background:
    linear-gradient(90deg, rgba(90, 55, 25, .30), rgba(90, 55, 25, 0) 34px),
    linear-gradient(270deg, rgba(90, 55, 25, .30), rgba(90, 55, 25, 0) 34px),
    linear-gradient(rgba(90, 55, 25, .16), rgba(90, 55, 25, 0) 8px),
    linear-gradient(0deg, rgba(90, 55, 25, .16), rgba(90, 55, 25, 0) 8px);
  border-top: 2px solid rgba(120, 85, 45, .35); border-bottom: 2px solid rgba(120, 85, 45, .35); box-sizing: border-box; }

.roller { position: absolute; top: 44px; width: 46px; height: 672px; border-radius: 12px; overflow: hidden;
  background: linear-gradient(90deg, #4a2810 0%, #8a5226 22%, #c98c55 42%, #a8693a 60%, #6b3c1a 82%, #3e200c 100%);
  box-shadow: 0 0 0 3px var(--ink); }
.roller.l { left: 300px; } .roller.r { left: 1100px; }
.roller .grain { position: absolute; top: 0; bottom: 0; left: -24px; width: 94px;
  background: repeating-linear-gradient(90deg, rgba(40, 18, 4, .20) 0 3px, rgba(40, 18, 4, 0) 3px 11px, rgba(255, 220, 170, .10) 11px 13px, rgba(40, 18, 4, 0) 13px 24px); }
.roller::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0, 0, 0, .35), rgba(0, 0, 0, 0) 30%, rgba(255, 240, 210, .30) 44%, rgba(0, 0, 0, 0) 58%, rgba(0, 0, 0, .40)); }
/* the roller's ends: a turned knob with a gold shuriken inlaid in its top face; it turns as the paper moves */
.knob { position: absolute; width: 64px; height: 40px; }
.knob.t { top: 20px; } .knob.b { top: 690px; height: 30px; }
.knob.l { left: 291px; } .knob.r { left: 1091px; }
.knob::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; bottom: 0; border-radius: 0 0 16px 16px; background: linear-gradient(90deg, #7a1c12, #d8452f 40%, #f06a4d 50%, #b8321f 70%, #5e140c); box-shadow: 0 0 0 3px var(--ink); }
.knob .face { position: absolute; left: 0; top: 0; width: 64px; height: 24px; border-radius: 50%; background: radial-gradient(ellipse at 45% 40%, #ff8a6a, #d8452f 60%, #9a2a18); box-shadow: 0 0 0 3px var(--ink); overflow: hidden; }
.knob .face i { position: absolute; left: 12px; top: -8px; width: 40px; height: 40px; transform: scaleY(.38) rotate(var(--turn, 0deg)); }
.knob .face i::before { content: ""; position: absolute; inset: 0; background: var(--shuriken) center / contain no-repeat; }
.knob.b .face { display: none; }
.knob.b::before { top: 0; border-radius: 6px 6px 16px 16px; }

/* the progress ribbon: a minimap of the whole scroll, each petal a cell in its colour; the frame is where you are */
.ribbon { position: absolute; left: 350px; top: 12px; width: 744px; height: 36px; border-radius: 10px; box-sizing: border-box;
  border: 3px solid var(--ink); background: #fff8e8 var(--ribbon) center / 738px 30px no-repeat; box-shadow: 0 4px 0 rgba(43, 29, 20, .25); }
.ribbon::before { content: ""; position: absolute; inset: -14px 0; } /* taller hit area */
.rb-win { position: absolute; left: 0; top: -7px; height: 44px; width: var(--rbw, 130px); box-sizing: border-box; border: 4px solid var(--ink); border-radius: 10px; background: rgba(255, 255, 255, .28); box-shadow: 0 0 0 3px #fff8e8; pointer-events: none; transform: translateX(var(--rbx, 0px)); }

/* ---------------------------------------------------------------- one petal, chart-exact */
.pt { position: absolute; width: 184px; height: 334px; background-repeat: no-repeat; background-size: 184px 334px; cursor: pointer; }
.pt .pic { position: absolute; width: 74px; height: 74px; object-fit: contain; pointer-events: none; }
.sp { position: absolute; left: 50%; transform: translate(-50%, -50%); font-family: var(--font-letters); font-weight: 700; line-height: 1; white-space: nowrap; color: var(--ink); }
/* invisible ink */
.sp.hidden { color: var(--ink-hidden); }
.sp.future { color: var(--ink-future); }
.pt.mys .sp { color: var(--ink-mystery); }
.pt.mys .pic { opacity: .17; }
/* charging: an energy line under the letters fills with gold */
.sp.charging::after { content: ""; position: absolute; left: -.06em; right: -.06em; bottom: -.2em; height: max(9px, .16em); border-radius: 9px;
  background: linear-gradient(90deg, #f6b400 0 calc(var(--e) * 100%), rgba(43, 29, 20, .13) calc(var(--e) * 100%)); box-shadow: inset 0 0 0 1.5px rgba(43, 29, 20, .35); }
/* ready for a gem battle: a gold highlighter swash behind the letters, and a hop when you arrive */
.sp.ready::before { content: ""; position: absolute; z-index: -1; left: -.2em; right: -.2em; top: .06em; bottom: -.08em; border-radius: .5em; background: radial-gradient(ellipse at 50% 45%, #fff3b0 0%, #ffd84a 58%, rgba(255, 197, 61, .0) 100%); }
.sp.ready::after { content: ""; position: absolute; left: -.12em; right: -.12em; bottom: -.2em; height: max(9px, .16em); border-radius: 9px; background: #f6b400; box-shadow: inset 0 0 0 1.5px rgba(43, 29, 20, .35); }
.sp.ready { isolation: isolate; }
.sp.ready.hop { animation: hop .55s cubic-bezier(.3, 1.8, .5, 1) 2; }
@keyframes hop { 0%, 100% { transform: translate(-50%, -50%); } 40% { transform: translate(-50%, -78%); } }
/* won: a jewel in the petal's colour beside the letters */
.sp.won::after { content: ""; position: absolute; left: calc(100% + .08em); top: .3em; width: .5em; height: .6em; background: var(--gem) center / contain no-repeat; }
.sp.won.jl::after { left: auto; right: calc(100% + .08em); }

/* the invisible ink glints as the paper moves past (scroll-linked; nothing runs at rest) */
.pt.mys::after { content: ""; position: absolute; left: 47px; top: 34px; width: 90px; height: 270px; opacity: 0; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255, 255, 255, .9) 0%, rgba(255, 222, 140, .5) 38%, rgba(170, 210, 255, .32) 62%, rgba(170, 210, 255, 0) 100%);
  transform: rotate(16deg); transition: opacity .35s; }
.moving .pt.mys::after { opacity: 1; transition-duration: .12s; }
@supports (animation-timeline: view()) {
  .pt.mys::after { animation: glint linear both; animation-timeline: view(inline); }
  @keyframes glint { from { translate: 95px 0; } to { translate: -95px 0; } }
}
@supports not (animation-timeline: view()) {
  .moving .pt.mys::after { animation: glint-t .9s ease-out; }
  @keyframes glint-t { from { translate: 95px 0; } to { translate: -95px 0; } }
}
/* tapping a sound not met yet: the ink stirs */
.pt.mys.stir { animation: stir .6s ease-out; }
.pt.mys.stir::after { opacity: 1; animation: glint-t .6s ease-out; }
@keyframes stir { 0%, 100% { transform: none; } 25% { transform: rotate(-2.5deg); } 60% { transform: rotate(2deg); } }
.pt.press { transform: scale(.96); }

/* ---------------------------------------------------------------- scroll-driven rollers and ribbon */
@supports (animation-timeline: scroll()) {
  .stage { timeline-scope: --paper; }
  .sda .knob .face i { animation: turn linear both; animation-timeline: --paper; animation-iteration-count: var(--turns, 12); }
  .sda .roller .grain { animation: grain linear both; animation-timeline: --paper; animation-iteration-count: var(--grains, 100); }
  .sda .rb-win { animation: rbwin linear both; animation-timeline: --paper; }
  @keyframes turn { from { transform: scaleY(.38) rotate(0deg); } to { transform: scaleY(.38) rotate(360deg); } }
  @keyframes grain { from { transform: translateX(0); } to { transform: translateX(-24px); } }
  @keyframes rbwin { from { transform: translateX(0); } to { transform: translateX(var(--rbmax)); } }
}

/* ---------------------------------------------------------------- the frame: Home, Hear it again, the flower, the ninja, Help */
.btn-round { position: absolute; width: 100px; height: 100px; border-radius: 50%; display: grid; place-items: center; z-index: 84;
  background: radial-gradient(circle at 35% 30%, #fff 0%, var(--gold) 45%, var(--gold-deep) 100%); border: 5px solid var(--ink); box-shadow: 0 6px 0 var(--ink); box-sizing: border-box; transition: transform .08s, box-shadow .08s; }
.btn-round:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
.btn-round svg { width: 56%; height: 56%; }
.btn-round.go { background: radial-gradient(circle at 35% 30%, #d9ffe4 0%, var(--good) 50%, var(--good-deep) 100%); }
.btn-round.pink { background: radial-gradient(circle at 35% 30%, #ffe3ee 0%, var(--blossom) 50%, var(--blossom-deep) 100%); }
.home { left: 18px; top: 16px; }
.again { right: 18px; top: 16px; width: 116px; height: 116px; }
.flower { right: 26px; top: 290px; }
.ninja { position: absolute; left: 34px; bottom: 6px; height: 336px; pointer-events: none; z-index: 5; filter: drop-shadow(0 8px 0 rgba(43, 29, 20, .18)); }
.help-btn { position: absolute; right: 14px; bottom: 14px; z-index: 85; width: 124px; height: 124px; border-radius: 50%; box-sizing: border-box;
  background: radial-gradient(circle at 40% 35%, #fff8e6, #ffd98a 70%, #e0a53a); border: 6px solid var(--ink); box-shadow: 0 7px 0 var(--ink), 0 0 0 6px rgba(255, 244, 220, .8); }
.help-face { position: absolute; inset: 5px; width: calc(100% - 10px); height: calc(100% - 10px); border-radius: 50%; object-fit: cover; }
.help-q { position: absolute; left: -10px; top: -10px; width: 46px; height: 46px; border-radius: 50%; box-sizing: border-box; background: var(--good); border: 5px solid var(--ink); color: #fff; font: 800 30px/36px var(--font-ui); text-align: center; text-shadow: 0 2px 0 var(--ink); }
.help-btn.talking { animation: helptalk .5s ease-in-out infinite alternate; }
@keyframes helptalk { from { scale: 1; } to { scale: 1.07; } }
.caption { position: absolute; right: 150px; bottom: 96px; max-width: 470px; z-index: 86; padding: 12px 20px 14px; border-radius: 22px; background: #fffdf6; border: 4px solid var(--ink); box-shadow: 0 5px 0 var(--ink);
  font: 700 27px/1.25 var(--font-ui); color: var(--ink); opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; }
.caption.on { opacity: 1; transform: none; }
.caption::after { content: ""; position: absolute; right: -22px; bottom: 16px; border: 12px solid transparent; border-left: 18px solid var(--ink); }

/* ---------------------------------------------------------------- the petal's card */
.veil { position: absolute; inset: 0; z-index: 60; background: rgba(29, 18, 48, .32); opacity: 0; pointer-events: none; transition: opacity .22s; }
.veil.on { opacity: 1; pointer-events: auto; }
.card { position: absolute; left: 336px; top: 50px; width: 772px; height: 660px; z-index: 61; box-sizing: border-box; border-radius: 18px;
  background-color: var(--paper); background-image: var(--washi); background-size: 300px 300px; border: 5px solid var(--ink); box-shadow: 0 8px 0 var(--ink);
  opacity: 0; transform: scale(.4); pointer-events: none; transition: opacity .2s, transform .28s cubic-bezier(.3, 1.35, .5, 1); }
.card.on { opacity: 1; transform: none; pointer-events: auto; }
.card .big { position: absolute; left: 14px; top: 0; width: 310px; height: 650px; background-repeat: no-repeat; background-size: 310px 650px; }
.card .big .pic { position: absolute; width: 132px; height: 132px; object-fit: contain; cursor: pointer; }
.card .big .sp { cursor: pointer; }
.card .big .sp.hidden, .card .big .sp.future { min-width: 2.4em; text-align: center; padding: .2em 0; }
.card .big .sp.sel { text-decoration: underline; text-decoration-thickness: .08em; text-underline-offset: .12em; text-decoration-color: var(--c); }
.card .sound { left: 348px; top: 58px; width: 104px; height: 104px; }
.card .close { right: 18px; top: 16px; }
.card .practise { right: 24px; bottom: 22px; width: 132px; height: 132px; }
.card .practise svg { width: 62%; height: 62%; }
.card .practise.pulse { animation: pulse 1.3s ease-in-out 3; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.card .lead { left: 348px; bottom: 30px; width: 104px; height: 104px; overflow: hidden; padding: 0; }
.card .lead img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.card .lead .spk { position: absolute; right: -4px; bottom: -4px; width: 42px; height: 42px; border-radius: 50%; background: var(--gold); border: 4px solid var(--ink); display: grid; place-items: center; }
.card .lead .spk svg { width: 70%; height: 70%; }
.words { position: absolute; left: 346px; top: 180px; width: 404px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 16px; }
.wcard { position: relative; height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 8px 8px; overflow: hidden; box-sizing: border-box; border-radius: 20px; background: #fffdf6; border: 4px solid var(--ink); box-shadow: 0 5px 0 var(--ink); font: 700 44px/1 var(--font-letters); }
.wcard:not(:has(img)) { font-size: 52px; }
.wcard img { width: 84px; height: 84px; object-fit: contain; flex: none; }
.wcard b { font-weight: 700; color: var(--c2); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
.wcard.ghost { background: transparent; border: 3px dashed #d6cab8; box-shadow: none; color: var(--ink-hidden); }
.wcard.ghost img { opacity: .22; }
.wcard.ghost b { color: var(--ink-hidden); -webkit-text-stroke: 0; }
.wcard:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.words-empty { position: absolute; left: 346px; top: 186px; }

/* grown-ups: which child (not for the child; only with ?grownups) */
.gu { position: fixed; left: 8px; bottom: 6px; z-index: 999; font: 600 12px/1 system-ui; color: #fff; opacity: .6; }
.gu a { color: #fff; margin-right: 8px; }
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">
    <div class="backdrop"></div>
    <div class="paper-shadow"></div>
    <div class="petal-scroll" id="scroll" aria-label="Petal chart" role="region"><div class="paper" id="paper"></div></div>
    <div class="curl"></div>
    <div class="roller l"><i class="grain"></i></div>
    <div class="roller r"><i class="grain"></i></div>
    <div class="knob t l"><span class="face"><i></i></span></div>
    <div class="knob t r"><span class="face"><i></i></span></div>
    <div class="knob b l"></div>
    <div class="knob b r"></div>
    <div class="ribbon" id="ribbon" role="button" aria-label="Petal map"><i class="rb-win" id="rbwin"></i></div>

    <button class="btn-round home" aria-label="Home" data-nav="home"><svg viewBox="0 0 64 64"><path fill="#fff4dc" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M10 30 32 11l22 19v23H40V39H24v14H10z"/></svg></button>
    <button class="btn-round again" aria-label="Hear it again" data-nav="again"><svg viewBox="0 0 64 64"><path fill="#fff4dc" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M10 25h10l13-11v36L20 39H10z"/><path fill="none" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" d="M42 22c5 5 5 15 0 20M49 15c9 9 9 25 0 34"/></svg></button>
    <button class="btn-round pink flower" aria-label="The World Flower"><svg viewBox="-60 -60 120 120" id="flowerIcon"></svg></button>
    <img class="ninja" src="../../../public/a/i/hero_kai_idle.webp" alt="" />
    <button class="help-btn" id="help" aria-label="Help"><img class="help-face" src="../../../public/a/i/sensei_face_idle.webp" alt="" /><span class="help-q">?</span></button>
    <div class="caption" id="caption"></div>

    <div class="veil" id="veil"></div>
    <div class="card" id="card" role="dialog" aria-label="petal card">
      <div class="big" id="big"></div>
      <button class="btn-round sound" id="cardSound" aria-label="Hear the sound"><svg viewBox="0 0 64 64"><path fill="#fff4dc" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M10 25h10l13-11v36L20 39H10z"/><path fill="none" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" d="M42 22c5 5 5 15 0 20M49 15c9 9 9 25 0 34"/></svg></button>
      <div class="words" id="words"></div>
      <button class="btn-round lead" id="lead" aria-label="Hear about these words"><img src="../../../public/a/i/sensei_face_talk.webp" alt="" /><i class="spk"><svg viewBox="0 0 64 64"><path fill="#fff4dc" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M10 25h10l13-11v36L20 39H10z"/><path fill="none" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" d="M42 22c5 5 5 15 0 20"/></svg></i></button>
      <button class="btn-round go practise" id="practise" aria-label="Practise in the dojo"><svg viewBox="0 0 64 64"><path d="M6 14c14 4 38 4 52 0l-2 8c-13 3-35 3-48 0z" fill="#e8312f" stroke="#2b1d14" stroke-width="4" stroke-linejoin="round"/><rect x="10" y="26" width="44" height="7" rx="2" fill="#e8312f" stroke="#2b1d14" stroke-width="4"/><path d="M17 22v34M47 22v34" stroke="#2b1d14" stroke-width="11" stroke-linecap="round"/><path d="M17 22v34M47 22v34" stroke="#e8312f" stroke-width="5" stroke-linecap="round"/><rect x="28" y="22" width="8" height="11" fill="#fff4dc" stroke="#2b1d14" stroke-width="3"/></svg></button>
      <button class="btn-round close" id="close" aria-label="close"><svg viewBox="0 0 64 64"><path fill="none" stroke="#2b1d14" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M12 34l13 13 27-30"/></svg></button>
    </div>

const measureCtx = document.createElement("canvas").getContext("2d");

/** Lays out a petal's column of spellings. Returns { fs, ys, fz }: the base size, each line's centre (from the petal's

 *  what the child knows is the biggest thing on the petal). A long spelling near the point may shrink by up to a fifth.
 *  `pic`: the picture's left edge (from the centre) and bottom (from the top), which the first lines keep clear of.

function fit(spellings, w, h, { pic, marks, maxFs, stroke, wt }) {

    const half = (W[i] * f) / 200, jew = marks[i] ? f * 0.64 : 0, pad = f * 0.06;
    const avail = Math.min(halfW(yc + f * 0.3, w, h), halfW(yc - f * 0.32, w, h)) - stroke * 1.4;
    const availR = yc - f * 0.45 < pic.bottom ? Math.min(avail, pic.left - 3) : avail;
    if (half + jew + pad <= avail && half + pad <= availR) return (side[i] = "l");

  const canPractise = st.g.some((g) => g[2] === "charging" || g[2] === "ready" || g[2] === "won");
  document.getElementById("practise").style.display = canPractise ? "" : "none";
  // the card grows out of the petal that was tapped
  if (fromEl) {
    const r = fromEl.getBoundingClientRect(), cr = stage.getBoundingClientRect(), s = cr.width / 1280;
    const px = (r.left + r.width / 2 - cr.left) / s - 336, py = (r.top + r.height / 2 - cr.top) / s - 50;
    card.style.transformOrigin = `${px}px ${py}px`;
  }
  card.classList.add("on"); veil.classList.add("on");
}

// ================================================================ fit the stage like ui.tsx Stage
function fitStage() {
  const touch = matchMedia("(pointer: coarse)").matches;
  const top = touch ? 10 : 0, bottom = touch ? 26 : 0, left = touch ? 8 : 0, right = touch ? 8 : 0;
  const aw = innerWidth - left - right, ah = innerHeight - top - bottom;
  const s = Math.min(aw / 1280, ah / 720);
  stage.style.left = `${left + aw / 2}px`;
  stage.style.top = `${top + ah / 2}px`;
  stage.style.transform = `scale(${s}) translate(-50%, -50%)`;
  window.__stageScale = s;
}
fitStage();
addEventListener("resize", fitStage);

// ================================================================ open where the child's own newest sound is (no animation, nothing moves by itself)
function colOf(p) { return cols.findIndex((c) => c.top === p || c.bottom === p); }
function startAt(p) {
  const ci = colOf(p);
  // show the half-sheet (four columns) that holds it, centred in the window
  const first = cols.findIndex((c, i) => i <= ci && cols[ci].sheet === c.sheet && Math.floor((ci - cols.findIndex((d) => d.sheet === c.sheet)) / 4) === Math.floor((i - cols.findIndex((d) => d.sheet === c.sheet)) / 4));
  const x0 = cols[first].x, x1 = cols[Math.min(cols.length - 1, first + 3)].x + CW;
  return (x0 + x1) / 2 - 756 / 2;
}
document.fonts.ready.then(() => {

  scroller.scrollLeft = Math.max(0, at);
  setupMotion();
  if (Q.get("open")) { const el = petalEls[Q.get("open")]; openCard(Q.get("open"), el); }
  document.body.dataset.ready = "1";
  window.__mock = { cols, TOTAL, child: CHILD };
});
