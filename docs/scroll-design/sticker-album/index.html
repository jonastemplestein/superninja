<!doctype html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Sticker Album</title>
<!-- Designer 3, "sticker-album": the World Flower's petal chart as a page-turning album of the school chart's sheets.
     A working mockup, not game code. Uses the game's own assets by relative path (../../../public/a/). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;600;700;800&family=Luckiest+Guy&display=block" rel="stylesheet" />
<style>
:root {
  --ink: #2b1d14; --gold: #ffc53d; --gold-deep: #c98a00; --good: #3fbf6a; --good-deep: #1f7a41;
  --blossom: #ff7aa2; --blossom-deep: #d9477a; --desk: #f6e9da;
  --letters: "Andika", "Comic Sans MS", system-ui, sans-serif;
  --ui: "Baloo 2", "Andika", system-ui, sans-serif;
  --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom); --sal: env(safe-area-inset-left); --sar: env(safe-area-inset-right);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--desk); font-family: var(--ui); color: var(--ink); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; border: 0; padding: 0; margin: 0; background: none; cursor: pointer; touch-action: manipulation; }
img { -webkit-user-drag: none; user-select: none; }

/* the viewport takes the desk colour, so there are no purple bars beside the stage */
.viewport { position: fixed; inset: 0; background: var(--desk); }
.stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; background: var(--desk); }
.vscrim { position: absolute; inset: 0; background: rgba(60, 38, 20, 0.34); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.vscrim.on { opacity: 1; }

/* ---------- the album: a native horizontal scroller, one chart sheet per page, snapping page by page */
.album { position: absolute; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
  overscroll-behavior-x: contain; scrollbar-width: none; z-index: 1; }
.album::-webkit-scrollbar { display: none; }
.page { flex: 0 0 1280px; height: 720px; position: relative; scroll-snap-align: start; scroll-snap-stop: always; }
.sheet { position: absolute; left: 282px; top: 126px; width: 840px; height: 584px; background: #fff; border-radius: 18px;
  box-shadow: 0 2px 0 rgba(120, 80, 40, 0.10), 0 10px 24px rgba(120, 80, 40, 0.14); contain: layout paint style; }
/* the page under it: one plain sheet edge, so it reads as an album (static) */
.under { position: absolute; left: 290px; top: 134px; width: 840px; height: 584px; border-radius: 18px; background: #fbf7f1; border: 2px solid #eadfd1; }
.pno { position: absolute; right: 22px; bottom: 10px; font: 700 26px/1 var(--ui); color: #d5c8b8; }

/* ---------- a petal: the chart's slim teardrop, thin outline in the sound's colour, spellings in a column,
   the picture on the top-right shoulder. The outline is a background image (no SVG nodes). */
.petal { position: absolute; isolation: isolate; }
.petal::before, .petal::after { content: ""; position: absolute; left: var(--ox); top: var(--oy); width: var(--w); height: var(--h);
  background-repeat: no-repeat; background-size: 100% 100%; z-index: 0; pointer-events: none; }
.petal::before { background-image: var(--o); }
.petal::after { background-image: var(--m); opacity: 0; }
.petal.myst::before { opacity: 0; }
.petal.myst::after { opacity: 1; }
.pic { position: absolute; width: 60px; height: 60px; object-fit: contain; left: calc(var(--ox) + var(--w) - 40px); top: calc(var(--oy) - 31px);
  z-index: 3; pointer-events: none; }
.key { position: absolute; width: 46px; height: 46px; left: calc(var(--ox) + var(--w) / 2 - 23px); top: calc(var(--oy) + var(--w) / 2 - 18px);
  background: var(--k) center / 100% 100% no-repeat; z-index: 2; pointer-events: none; }

/* a spelling line. States (engine/gems.ts gemState), told apart by shape as well as colour:
   won = a highlighter band in the petal's tint; ready = a gold band with a sparkle, bouncing when the page arrives;
   charging = a "sound line" under the letters that fills up; hidden = ghost letters in a dashed slot;
   future (not in the game yet) = ghost print, as on the chart */
.sp { position: absolute; left: calc(var(--ox) + var(--w) / 2); translate: -50% 0; white-space: nowrap; text-align: center;
  font-family: var(--letters); font-weight: 700; color: var(--ink); z-index: 1; padding: 0 0.16em; border-radius: 0.24em; pointer-events: none; }
.sp.won { background: var(--t); }
.sp.ready { background: #ffd54f; }
.sp.ready::after { content: "✦"; position: absolute; right: -0.34em; top: -0.34em; font-size: 0.5em; line-height: 1; color: #e0a000; }
.sp.charging { background:
  linear-gradient(var(--d), var(--d)) left 0.16em bottom 0 / calc((100% - 0.32em) * var(--e)) 0.12em no-repeat,
  linear-gradient(#e9e1d7, #e9e1d7) left 0.16em bottom 0 / calc(100% - 0.32em) 0.12em no-repeat; }
.sp.hidden { color: rgba(43, 29, 20, 0.34); font-weight: 400; border: 2px dashed rgba(43, 29, 20, 0.3); }
.sp.future { color: rgba(43, 29, 20, 0.26); font-weight: 400; }
.petal.done .sp.won { background: none; }
/* the ready gems bounce a few times when their page arrives, then rest (nothing runs forever) */
.page.live .sp.ready { animation: bob 0.8s ease-in-out 0.3s 3; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px) scale(1.06); } 70% { transform: translateY(1px); } }

/* ---------- the frame: Home top-left, Hear it again top-right, page arrows either side, Help bottom-right */
.btn-round { position: absolute; width: 100px; height: 100px; border-radius: 50%; display: grid; place-items: center; z-index: 20;
  background: radial-gradient(circle at 35% 30%, #fff 0%, var(--gold) 45%, var(--gold-deep) 100%); border: 5px solid var(--ink);
  box-shadow: 0 6px 0 var(--ink); transition: transform 0.08s; }
.btn-round:active { transform: translateY(4px); }
.btn-round svg { width: 54%; height: 54%; overflow: visible; }
.btn-round.go { background: radial-gradient(circle at 35% 30%, #d9ffe4 0%, var(--good) 50%, var(--good-deep) 100%); }
.btn-round.pink { background: radial-gradient(circle at 35% 30%, #ffe3ee 0%, var(--blossom) 50%, var(--blossom-deep) 100%); }
.home { left: 18px; top: 16px; }
.again { right: 14px; top: 16px; }
.turn { width: 120px; height: 120px; top: 240px; }
.turn svg { width: 60%; height: 60%; }
.turn.prev { left: 152px; }
.turn.next { left: 1135px; }
.turn[disabled] { opacity: 0.3; pointer-events: none; }
.help-btn { position: absolute; right: 14px; bottom: 14px; z-index: 30; width: 124px; height: 124px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #fff8e6, #ffd98a 70%, #e0a53a); border: 6px solid var(--ink);
  box-shadow: 0 7px 0 var(--ink), 0 0 0 6px rgba(255, 244, 220, 0.8); }
.help-btn img { position: absolute; inset: 5px; width: calc(100% - 10px); height: calc(100% - 10px); border-radius: 50%; object-fit: cover; }
.help-q { position: absolute; left: -10px; top: -10px; width: 46px; height: 46px; border-radius: 50%; background: var(--good); border: 5px solid var(--ink);
  color: #fff; font: 30px/38px "Luckiest Guy", var(--ui); text-align: center; text-shadow: 0 2px 0 var(--ink); }

/* the child's ninja, bottom-left, never takes taps */
.ninja { position: absolute; left: 30px; bottom: 12px; width: 212px; pointer-events: none; z-index: 5; transform-origin: 50% 100%; }
.ninja-shadow { position: absolute; left: 44px; bottom: 4px; width: 184px; height: 30px; border-radius: 50%; z-index: 4; pointer-events: none;
  background: radial-gradient(closest-side, rgba(110, 70, 30, 0.32), rgba(110, 70, 30, 0)); }

/* ---------- the page strip (top centre): the World Flower, then one small flower per page that colours in */
.strip { position: absolute; left: 300px; top: 8px; width: 800px; height: 112px; display: flex; align-items: center; justify-content: center; gap: 18px;
  z-index: 15; pointer-events: none; }
.strip > * { pointer-events: auto; }
.strip .btn-round { position: relative; flex: 0 0 auto; width: 96px; height: 96px; margin-right: 22px; }
.strip .btn-round svg { width: 78%; height: 78%; }
.tab { position: relative; width: 150px; height: 100px; border-radius: 20px; background: #fffdf9; border: 3px solid #e4d7c8; display: grid; place-items: center; }
.tab svg { width: 96px; height: 96px; }
.tab.on { border: 5px solid var(--ink); box-shadow: 0 5px 0 var(--ink); }
.tab.on::after { content: ""; position: absolute; left: 50%; bottom: -17px; translate: -50% 0; border: 11px solid transparent; border-top: 11px solid var(--ink); border-bottom: 0; }

/* ---------- Sensei's caption (the grown-ups' captions setting) */
.caption { position: absolute; right: 150px; bottom: 96px; max-width: 460px; padding: 12px 20px; border-radius: 22px; background: #fffaf0; border: 4px solid var(--ink);
  font: 600 27px/1.25 var(--ui); z-index: 40; opacity: 0; transform: translateY(8px); transition: opacity 0.2s, transform 0.2s; pointer-events: none; }
.caption.on { opacity: 1; transform: none; }
.caption::after { content: ""; position: absolute; right: -16px; bottom: 16px; border: 12px solid transparent; border-left: 16px solid var(--ink); border-right: 0; }

/* ---------- the petal card */
.scrim { position: absolute; inset: 0; background: rgba(60, 38, 20, 0.34); z-index: 50; opacity: 0; transition: opacity 0.2s; }
.scrim.on { opacity: 1; }
.card { position: absolute; left: 282px; top: 16px; width: 840px; height: 696px; background: #fff; border-radius: 28px; z-index: 51;
  box-shadow: 0 3px 0 rgba(120, 80, 40, 0.14), 0 18px 40px rgba(60, 38, 20, 0.28); }
.card .close { right: 12px; top: 12px; width: 92px; height: 92px; }
.bigpetal { position: absolute; left: 44px; top: 96px; width: 196px; height: 300px; }
.bigpetal .bp { position: absolute; inset: 0; background: var(--o) center / 100% 100% no-repeat; }
.bigpetal .bpic { position: absolute; width: 138px; height: 138px; object-fit: contain; left: 29px; top: 26px; pointer-events: none; }
.bigpetal .spk { position: absolute; left: 50%; top: 178px; width: 64px; height: 64px; margin-left: -32px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #fff 0%, var(--gold) 45%, var(--gold-deep) 100%); border: 4px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
.bigpetal .spk svg { width: 58%; height: 58%; }
.card .gate { left: 82px; top: 452px; width: 120px; height: 120px; }
.card .gate svg { width: 66%; height: 66%; }
.slots { position: absolute; left: 312px; top: 30px; width: 420px; }
.slot { position: absolute; display: grid; place-items: center; border-radius: 20px; font-family: var(--letters); font-weight: 700; color: var(--ink); line-height: 1; }
.slot.won { background: var(--t); border: 4px solid var(--c); }
.slot.ready { background: radial-gradient(circle at 40% 30%, #fff3bf, #ffd54f 70%); border: 4px solid #d99a00; box-shadow: 0 0 0 7px rgba(255, 213, 79, 0.35); }
.slot.charging { background: #fff; border: 4px solid #e2d8cc; }
.slot.hidden { border: 3px dashed #cdbfad; color: rgba(43, 29, 20, 0.34); font-weight: 400; }
.slot.future { color: rgba(43, 29, 20, 0.26); font-weight: 400; }
.slot .bar { position: absolute; left: 12px; right: 12px; bottom: 9px; height: 11px; border-radius: 6px; background: #eee6dc; overflow: hidden; }
.slot .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--e) * 100%); background: var(--d); border-radius: 6px; }
.slot .gem { position: absolute; right: -10px; top: -12px; width: 34px; height: 34px; }
.slot .play { position: absolute; right: -20px; bottom: -20px; width: 44px; height: 44px; border-radius: 50%; background: var(--good); border: 4px solid var(--ink); display: grid; place-items: center; }
.slot .play svg { width: 55%; height: 55%; }
.slot.ready.bounce { animation: bob 0.8s ease-in-out 0.4s 3; }
.words { position: absolute; left: 312px; top: 282px; width: 510px; height: 400px; }
.whead { position: absolute; left: 0; top: 0; height: 92px; display: flex; align-items: center; gap: 16px; }
.whead .who { width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--ink); background: #ffe9b8 var(--img) 49% 13% / 240% auto no-repeat; }
.whead .who.sensei { background-size: cover; background-position: center; }
.whead .btn-round { position: relative; width: 92px; height: 92px; border-width: 5px; }
.wlist { position: absolute; left: 0; top: 106px; width: 510px; display: flex; flex-wrap: wrap; gap: 14px; }
.word { display: flex; align-items: center; gap: 6px; height: 96px; padding: 0 16px 0 8px; border-radius: 18px; background: #fffdf8; border: 3px solid #e4d8ca;
  font: 700 42px/1 var(--letters); }
.word img { width: 76px; height: 76px; object-fit: contain; }
.word b { color: var(--d); font-weight: 700; text-decoration: underline; text-decoration-thickness: 4px; text-underline-offset: 6px; }
.word.dim { opacity: 0.35; }

/* ---------- mockup-only controls (outside the stage; hidden with ?clean) */
.dev { position: fixed; left: 6px; bottom: 6px; z-index: 100; display: flex; flex-wrap: wrap; gap: 4px; max-width: 96px; font: 600 11px/1.1 system-ui, sans-serif; }
.dev button { background: rgba(43, 29, 20, 0.78); color: #fff; border-radius: 6px; padding: 5px 6px; }
.dev button.on { background: #d9477a; }
.clean .dev { display: none; }
.toast { position: absolute; left: 50%; top: 300px; translate: -50% 0; padding: 18px 30px; border-radius: 24px; background: var(--ink); color: #fff;
  font: 700 34px/1 var(--ui); z-index: 90; pointer-events: none; }
.fx { position: absolute; inset: 0; z-index: 60; pointer-events: none; }
.spark { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; background: var(--sc, #ffc53d);
  clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); }
.ring { position: absolute; width: 160px; height: 160px; margin: -80px 0 0 -80px; border-radius: 50%; border: 8px solid var(--sc, #ffc53d); }
</style>
</head>
<body>
<div class="viewport">
  <div class="vscrim" id="vscrim"></div>
  <div class="stage" id="stage">
    <div class="album" id="album" aria-label="Petal chart"></div>
    <div class="ninja-shadow"></div>
    <img class="ninja" id="ninja" src="../../../public/a/i/hero_kai_idle.webp" alt="" />
    <nav class="strip" id="strip"></nav>
    <button class="btn-round home" data-nav="home" aria-label="Home"><svg viewBox="0 0 64 64"><path fill="#fff4dc" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M10 30 32 11l22 19v23H40V39H24v14H10z"/></svg></button>
    <button class="btn-round again" data-nav="again" aria-label="Hear it again"><svg viewBox="0 0 64 64"><path fill="#fff4dc" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M10 25h10l13-11v36L20 39H10z"/><path fill="none" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" d="M42 22c5 5 5 15 0 20M49 15c9 9 9 25 0 34"/></svg></button>
    <button class="btn-round turn prev" id="prev" aria-label="Previous page"><svg viewBox="0 0 64 64"><path fill="none" stroke="#2b1d14" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M38 14 20 32l18 18"/></svg></button>
    <button class="btn-round turn next" id="next" aria-label="Next page"><svg viewBox="0 0 64 64"><path fill="none" stroke="#2b1d14" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M26 14l18 18-18 18"/></svg></button>
    <button class="help-btn" aria-label="Help"><img src="../../../public/a/i/sensei_face_idle.webp" alt="" /><span class="help-q">?</span></button>
    <div class="caption" id="caption"></div>
    <div class="fx" id="fx"></div>
  </div>
</div>
<div class="dev" id="dev"></div>

"use strict";
const A = "../../../public/a/";
const DATA = JSON.parse(document.getElementById("data").textContent);
const Q = new URLSearchParams(location.search);
if (Q.has("clean")) document.body.classList.add("clean");
const W_STAGE = 1280, H_STAGE = 720, PAGE_W = 1280;
const SLOW = Math.max(1, +(Q.get("slow") || 1)), ms = (t) => t * SLOW;   // ?slow=6: the unlock and the win in slow motion
const stage = document.getElementById("stage"), album = document.getElementById("album"), strip = document.getElementById("strip");
const fxLayer = document.getElementById("fx"), capEl = document.getElementById("caption"), vscrim = document.getElementById("vscrim");

// ------------------------------------------------------------------ the stage, fitted the way ui.tsx Stage does it
let scale = 1;
function fit() {
  const cs = getComputedStyle(document.documentElement);
  const inset = (v) => parseFloat(cs.getPropertyValue(v)) || 0;
  const touch = matchMedia("(pointer: coarse)").matches;
  const top = Math.max(inset("--sat"), touch ? 10 : 0), bottom = Math.max(inset("--sab"), touch ? 26 : 0);
  const left = Math.max(inset("--sal"), touch ? 8 : 0), right = Math.max(inset("--sar"), touch ? 8 : 0);
  const aw = innerWidth - left - right, ah = innerHeight - top - bottom;
  scale = Math.min(aw / W_STAGE, ah / H_STAGE);
  stage.style.left = `${left + aw / 2}px`;
  stage.style.top = `${top + ah / 2}px`;
  stage.style.transform = `scale(${scale}) translate(-50%, -50%)`;
}
fit();
addEventListener("resize", fit);

// ------------------------------------------------------------------ colours
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const hex = (c) => "#" + c.map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("");
const mix = (a, b, t) => hex(rgb(a).map((v, i) => v + (rgb(b)[i] - v) * t));
const lum = (h) => { const [r, g, b] = rgb(h).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const contrast = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
/** the sound's colour, darkened just enough to read on white (3:1): for energy lines and coloured letters */
const deep = (c) => { let t = 0; while (contrast(mix(c, "#2b1d14", t), "#ffffff") < 3.2 && t < 0.9) t += 0.05; return mix(c, "#2b1d14", t); };
const tint = (c) => mix(c, "#ffffff", 0.7);

// ------------------------------------------------------------------ the teardrop (src/ui/petal.ts teardropAt, top-left origin)
function tearPath(w, h, sw) {
  const W = w - sw, H = h - sw, r = W / 2, x0 = w / 2, y0 = sw / 2;
  const P = (x, y) => `${+(x0 + x).toFixed(1)},${+(y0 + y).toFixed(1)}`;

}
// single-quoted and fully escaped, because these URLs go into style="…" attributes
const svgUrl = (s) => `url('data:image/svg+xml,${encodeURIComponent(s).replace(/'/g, "%27").replace(/\(/g, "%28").replace(/\)/g, "%29")}')`;

const keyUrl = (c) => svgUrl(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 50'><circle cx='25' cy='25' r='21' fill='${mix(c, "#ffffff", 0.9)}' stroke='${mix(c, "#ffffff", 0.5)}' stroke-width='3'/><path d='M25 13a6.4 6.4 0 0 0-3.5 11.8L19.6 36h10.8l-1.9-11.2A6.4 6.4 0 0 0 25 13z' fill='${mix(deep(c), "#ffffff", 0.3)}'/></svg>`);
/** half the petal's width at height y (its own coordinates): the round top, then the bezier sides into the point */
function halfWidthFn(W, H) {
  const r = W / 2, pts = [];
  for (let i = 0; i <= 80; i++) {
    const t = i / 80, u = 1 - t;
    const x = u * u * u * r + 3 * u * u * t * r + 3 * u * t * t * (0.12 * W) + t * t * t * 0;
    const y = u * u * u * r + 3 * u * u * t * (0.56 * H) + 3 * u * t * t * (0.78 * H) + t * t * t * H;
    pts.push([y, x]);
  }

    if (y <= r) return Math.sqrt(Math.max(0, r * r - (r - y) * (r - y)));
    for (let i = 1; i < pts.length; i++) if (pts[i][0] >= y) { const [y0, x0] = pts[i - 1], [y1, x1] = pts[i]; return x0 + ((y - y0) / Math.max(1e-6, y1 - y0)) * (x1 - x0); }

}
const cv = document.createElement("canvas").getContext("2d");
const textW = (s, px, weight) => { cv.font = `${weight} ${px}px Andika`; return cv.measureText(s).width; };

/** The spellings of one petal as a column, the chart's way: every spelling, in the chart's order. Met spellings are big;
 *  the ones still to find (hidden) and the ones the game can't teach yet (future) are smaller ghost print. */
function layoutColumn(items, W, H) {
  const wt = (st) => (st === "future" ? 0.36 : st === "hidden" ? 0.6 : 1);
  const hw = halfWidthFn(W, H);
  const t0 = H * 0.035, t1 = H * 0.82;
  const sum = items.reduce((a, x) => a + wt(x.st), 0);
  const u = Math.min(70, (t1 - t0) / sum);
  const T = u * sum;
  let y = Math.max(t0, Math.min(W * 0.56 - T / 2, t1 - T));
  return items.map((x) => {
    const h = u * wt(x.st);
    const cy = y + h / 2;
    let f = h * (x.st === "future" ? 0.9 : 0.78);
    const weight = x.st === "future" || x.st === "hidden" ? 400 : 700;
    const avail = 2 * Math.min(hw(cy - f * 0.3), hw(cy + f * 0.3)) - 6;
    const need = textW(x.g, f, weight) + f * 0.32;
    if (need > avail) f = Math.max(9, f * (avail / need));
    y += h;
    return { ...x, cy, f };

}

// petal geometry on the sheet: 8 across (6 on the third page), 2 rows; the chart's rows of four run left to right
const PW = 92, PH = 242, OY = 32;

  return { x: 14 + col * cw, y: row * 290, w: cw, h: 284, ox: (cw - PW) / 2 };

  const s = ST[pt.p], c = cellOf(pageIdx, i), col = pt.colour;

  const m = tearUrl(PW, PH, "#ffffff", mix(col, "#ffffff", 0.62), 3.5);
  const style = `left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px;--ox:${c.ox}px;--oy:${OY}px;--w:${PW}px;--h:${PH}px;--o:${o};--m:${m};--k:${myst ? keyUrl(col) : "none"};--t:${tint(col)};--d:${deep(col)}`;
  let inner = "";

  else {
    const items = pt.spellings.map((sp, k) => ({ g: sp.g, st: s.gems[k].st, e: s.gems[k].e }));
    for (const ln of layoutColumn(items, PW, PH)) {
      const hgt = ln.f * 1.16;
      inner += `<span class="sp ${ln.st}" style="top:${(OY + ln.cy - hgt / 2).toFixed(1)}px;font-size:${ln.f.toFixed(1)}px;line-height:${hgt.toFixed(1)}px;height:${hgt.toFixed(1)}px;--e:${ln.e}">${ln.g}</span>`;

// the strip: one small flower per page, a petal per sound, coloured in once met (filled darker once complete)
function rosette(pts) {
  const n = pts.length, R0 = 15, R1 = 47, c = R1 - 0, L = R1 - R0;

  const cc = R1 - w / 2;
  const d = `M0,${-R0} C${-w * 0.14},${-R0 - L * 0.3} ${-w / 2},${-cc + L * 0.28} ${-w / 2},${-cc} A${w / 2},${w / 2} 0 0 1 ${w / 2},${-cc} C${w / 2},${-cc + L * 0.28} ${w * 0.14},${-R0 - L * 0.3} 0,${-R0} Z`;
  let met = 0, done = 0;

    const fill = s.complete ? pt.colour : s.met ? mix(pt.colour, "#ffffff", 0.45) : "#ffffff";
    const stroke = s.met ? deep(pt.colour) : mix(pt.colour, "#ffffff", 0.55);
    return `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="1.6" transform="rotate(${((i + 0.5) * 360) / n})"/>`;

  const all = done === n;

const FLOWER_ICON = `<svg viewBox="-60 -60 120 120">${["#e8312f", "#f7a23b", "#f3c74a", "#2fa65a", "#2ec4b6", "#4a7dff", "#8a3be0", "#f0226b"].map((c, i) => `<path d="M0,20 C-2.88,11.2 -12,2.4 -12,-8 A12,12 0 0 1 12,-8 C12,2.4 2.88,11.2 0,20 Z" transform="rotate(${i * 45}) translate(0 -34)" fill="${c}" stroke="#2b1d14" stroke-width="4"/>`).join("")}<circle r="17" fill="#ffc53d" stroke="#2b1d14" stroke-width="5"/></svg>`;

const soundOf = (p) => play(`${A}p/${p}.mp3`);
const wordOf = (w) => play(`${A}w/${w}.mp3`);
let ac = null;
const sfx = {

// ------------------------------------------------------------------ taps on petals (click, so a swipe that starts on a petal never opens it)
album.addEventListener("click", (e) => {
  const b = e.target.closest(".petal");
  if (!b) return;
  const p = b.dataset.p;
  if (!ST[p].met) {
    sfx.clunk();
    b.querySelector(".key")?.animate([{ transform: "rotate(0)" }, { transform: "rotate(-16deg)" }, { transform: "rotate(12deg)" }, { transform: "rotate(-6deg)" }, { transform: "rotate(0)" }], { duration: 480 });

// ------------------------------------------------------------------ the unlock: the keyhole turns, the colour comes in, the picture sticks on
function unlock(p) {
  const pt = byP[p];
  const b = album.querySelector(`.petal[data-p="${p}"]`);
  if (!b) return;
  const s = ST[p];
  s.met = true;
  s.gems = s.gems.map((g, k) => (pt.spellings[k].inPlay && g.st === "hidden" && !s.gems.some((x) => x.st !== "hidden" && x.st !== "future") && k === pt.spellings.findIndex((x) => x.inPlay) ? { st: "charging", e: 0.12 } : g));
  const pageIdx = PAGES.findIndex((ps) => ps.includes(pt)), i = PAGES[pageIdx].indexOf(pt);
  const tmp = document.createElement("div");
  tmp.innerHTML = petalHTML(pt, pageIdx, i);
  const nb = tmp.firstChild;
  const key = document.createElement("span"); key.className = "key"; key.style.setProperty("--k", keyUrl(pt.colour)); nb.appendChild(key);
  b.replaceWith(nb);
  nb.classList.add("myst");
  const pic = nb.querySelector(".pic"), lines = [...nb.querySelectorAll(".sp")];
  pic.style.opacity = 0; lines.forEach((l) => (l.style.opacity = 0));
  const r = stageRect(nb);
  sfx.clunk();
  key.animate([{ transform: "rotate(0)" }, { transform: "rotate(-30deg)", offset: 0.25 }, { transform: "rotate(90deg) scale(1.1)", offset: 0.6 }, { transform: "rotate(90deg) scale(1.9)", opacity: 0 }], { duration: ms(900), easing: "ease-in-out", fill: "forwards" });
  setTimeout(() => {
    nb.classList.remove("myst");
    nb.animate([{ transform: "scale(1)" }, { transform: "scale(1.08)", offset: 0.4 }, { transform: "scale(1)" }], { duration: ms(500), easing: "ease-out" });
    sparks(r.x + r.w / 2, r.y + OY + PW * 0.5, [pt.colour, "#ffc53d", deep(pt.colour)], 12, 120);
    sfx.sparkle();
  }, ms(650));
  setTimeout(() => {
    pic.style.opacity = "";
    pic.animate([{ transform: "translate(-30px, -70px) scale(1.9) rotate(-18deg)", opacity: 0 }, { transform: "translate(0, 6px) scale(0.92) rotate(4deg)", opacity: 1, offset: 0.7 }, { transform: "none", opacity: 1 }], { duration: ms(520), easing: "cubic-bezier(.3,.9,.4,1)" });
    soundOf(p);
  }, ms(950));
  lines.forEach((l, k) => setTimeout(() => { l.style.opacity = ""; l.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: ms(320), easing: "ease-out" }); }, ms(1250 + k * 90)));
  setTimeout(() => { key.remove(); renderStrip(); }, ms(1500));

// a gem won: its spelling sticks into the petal with a highlighter swipe and a burst

  s.gems[k] = { st: "won", e: 1 };
  const need = pt.spellings.map((x, j) => [x, j]).filter(([x]) => x.inPlay);
  const nowDone = need.every(([, j]) => s.gems[j].st === "won");
  const b = album.querySelector(`.petal[data-p="${p}"]`);
  const pageIdx = PAGES.findIndex((ps) => ps.includes(pt)), i = PAGES[pageIdx].indexOf(pt);
  const tmp = document.createElement("div"); tmp.innerHTML = petalHTML(pt, pageIdx, i);
  const nb = tmp.firstChild; b.replaceWith(nb);
  const line = nb.querySelectorAll(".sp")[k];
  const r = stageRect(line);
  line.animate([{ transform: "scale(1.6)", opacity: 0.4 }, { transform: "scale(0.94)", opacity: 1, offset: 0.6 }, { transform: "none" }], { duration: 520, easing: "cubic-bezier(.3,.9,.4,1)" });
  sparks(r.x + r.w / 2, r.y + r.h / 2, [pt.colour, "#ffc53d", deep(pt.colour)], 10, 90);

      done.animate([{ transform: "scale(1)" }, { transform: "scale(1.1) rotate(-2deg)", offset: 0.35 }, { transform: "scale(0.98)", offset: 0.7 }, { transform: "none" }], { duration: 700 });
      const rr = stageRect(done); sparks(rr.x + rr.w / 2, rr.y + rr.h / 2, [pt.colour, "#ffc53d", deep(pt.colour)], 16, 170); say("petal_complete"); renderStrip(); }, 700);
  } else renderStrip();

// ------------------------------------------------------------------ the petal card
let cardEls = null;

  closeCard(true);
  const pt = byP[p], s = ST[p], col = pt.colour;
  const scrim = document.createElement("div"); scrim.className = "scrim";
  const card = document.createElement("div"); card.className = "card";
  card.style.cssText = `--c:${col};--t:${tint(col)};--d:${deep(col)};--o:${tearUrl(196, 300, s.complete ? mix(col, "#ffffff", 0.84) : "#ffffff", col, 7)}`;
  const n = pt.spellings.length, perRow = n <= 3 ? 3 : n === 4 ? 4 : n <= 6 ? 3 : 4;
  const gap = 12, sw = (408 - gap * (perRow - 1)) / perRow, sh = n <= 3 ? 116 : 100;

      : g.st === "ready" ? `<span class="play"><svg viewBox="0 0 64 64"><path fill="#fff" stroke="#2b1d14" stroke-width="7" stroke-linejoin="round" d="M22 12l30 20-30 20z"/></svg></span>`
      : g.st === "charging" ? `<span class="bar" style="--e:${Math.max(0.06, g.e)}"><i></i></span>` : "";
    return `<button class="slot ${g.st}${g.st === "ready" ? " bounce" : ""}" data-k="${k}" aria-label="gem ${sp.g}" style="left:${c * (sw + gap)}px;top:${row * (sh + gap)}px;width:${sw}px;height:${sh}px;font-size:${f.toFixed(1)}px;padding-bottom:${g.st === "charging" ? 14 : 0}px">${sp.g}${extra}</button>`;
  }).join("");
  const found = s.words;
  const words = found.length ? found : [...new Set(pt.spellings.map((sp) => sp.g))].flatMap((g, k) => (s.gems[k] && ["won", "charging", "ready"].includes(s.gems[k].st) ? DATA.examples[pt.spellings[k].key] || [] : [])).slice(0, 4);
  const wordHTML = words.slice(0, 6).map((w) => {
    const txt = w.segs.map(([g, ph]) => (ph === p ? `<b>${g}</b>` : g)).join("");
    return `<button class="word" data-w="${w.t}" data-g="${w.segs.filter(([, ph]) => ph === p).map(([g]) => g).join(" ")}">${w.pic ? `<img src="${A}i/pic_${w.t}.webp" alt="" />` : ""}<span>${txt}</span></button>`;
  }).join("");
  // who the words come from: the child's ninja (words you found) or Sensei (her examples, when none are found yet)
  const who = found.length ? `<span class="who" style="--img:url('${A}i/hero_kai_idle.webp')"></span>` : `<span class="who sensei" style="--img:url('${A}i/sensei_face_idle.webp')"></span>`;
  card.innerHTML = `
    <button class="bigpetal" aria-label="Hear the sound"><span class="bp"></span><img class="bpic" src="${A}i/petal_${p}.webp" alt="" /><span class="spk"><svg viewBox="0 0 64 64"><path fill="#fff4dc" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M10 25h10l13-11v36L20 39H10z"/><path fill="none" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" d="M42 22c5 5 5 15 0 20M49 15c9 9 9 25 0 34"/></svg></span></button>
    <button class="btn-round go gate" aria-label="Practise"><svg viewBox="0 0 64 64"><path d="M6 14c14 4 38 4 52 0l-2 8c-13 3-35 3-48 0z" fill="#e8312f" stroke="#2b1d14" stroke-width="4" stroke-linejoin="round"/><rect x="10" y="26" width="44" height="7" rx="2" fill="#e8312f" stroke="#2b1d14" stroke-width="4"/><path d="M17 22v34M47 22v34" stroke="#2b1d14" stroke-width="11" stroke-linecap="round"/><path d="M17 22v34M47 22v34" stroke="#e8312f" stroke-width="5" stroke-linecap="round"/><rect x="28" y="22" width="8" height="11" fill="#fff4dc" stroke="#2b1d14" stroke-width="3"/></svg></button>
    <div class="slots">${slots}</div>
    <div class="words" style="top:${30 + Math.ceil(n / perRow) * (sh + gap) + 6}px"><div class="whead">${who}<button class="btn-round hearall" aria-label="Hear the words"><svg viewBox="0 0 64 64"><path fill="#fff4dc" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M10 25h10l13-11v36L20 39H10z"/><path fill="none" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" d="M42 22c5 5 5 15 0 20M49 15c9 9 9 25 0 34"/></svg></button></div><div class="wlist">${wordHTML}</div></div>
    <button class="btn-round close" aria-label="Close"><svg viewBox="0 0 64 64"><path fill="none" stroke="#2b1d14" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" d="M12 34l13 13 27-30"/></svg></button>`;
  stage.append(scrim, card);
  // only the words that fit on the card (the newest first would be the game's choice; here, the save's order)
  const wordsEl = card.querySelector(".words"), room = 696 - wordsEl.offsetTop - 16 - 106;
  card.querySelectorAll(".word").forEach((w) => { if (w.offsetTop + w.offsetHeight > room) w.remove(); });
  requestAnimationFrame(() => { scrim.classList.add("on"); vscrim.classList.add("on"); });
  if (fromEl) {
    const r = stageRect(fromEl);
    const dx = r.x + r.w / 2 - (282 + 420), dy = r.y + r.h / 2 - (16 + 348);
    card.animate([{ transform: `translate(${dx}px, ${dy}px) scale(0.16)`, opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 300, easing: "cubic-bezier(.2,.9,.3,1.08)" });
  }
  cardEls = { scrim, card, p };
  scrim.addEventListener("click", () => closeCard());
  card.querySelector(".close").addEventListener("click", () => { sfx.tap(); closeCard(); });
  const bp = card.querySelector(".bigpetal");
  bp.addEventListener("click", () => { soundOf(p); bp.animate([{ transform: "scale(1)" }, { transform: "scale(1.07)" }, { transform: "scale(1)" }], { duration: 420, easing: "ease-out" }); });
  card.querySelector(".gate").addEventListener("click", () => { sfx.tap(); toast("→ the dojo: practise this sound"); });
  card.querySelector(".hearall").addEventListener("click", () => { sfx.tap(); const ws = [...card.querySelectorAll(".word")]; ws.forEach((w, i) => setTimeout(() => { wordOf(w.dataset.w); w.animate([{ transform: "scale(1)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 380 }); }, i * 1100)); });
  card.querySelector(".wlist").addEventListener("click", (e) => { const w = e.target.closest(".word"); if (w) { wordOf(w.dataset.w); w.animate([{ transform: "scale(1)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 380 }); } });
  card.querySelector(".slots").addEventListener("click", (e) => {
    const b = e.target.closest(".slot"); if (!b) return;
    const k = +b.dataset.k, g = s.gems[k], sp = pt.spellings[k];
    b.animate([{ transform: "scale(1)" }, { transform: "scale(1.1)" }, { transform: "scale(1)" }], { duration: 360, easing: "ease-out" });
    if (g.st === "hidden") return say("gem_hidden");
    if (g.st === "future") return say("gem_future");
    if (g.st === "ready") { say("gem_ready"); toast("→ a gem battle for this gem"); return; }
    soundOf(p);
    card.querySelectorAll(".word").forEach((w) => w.classList.toggle("dim", !w.dataset.g.split(" ").includes(sp.g)));
  });
}
function closeCard(now) {
  if (!cardEls) return;
  const { scrim, card } = cardEls; cardEls = null;
  vscrim.classList.remove("on");
  if (now) { scrim.remove(); card.remove(); return; }
  scrim.classList.remove("on");
  card.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "scale(0.94)" }], { duration: 160 }).onfinish = () => { scrim.remove(); card.remove(); };
}

// ------------------------------------------------------------------ mockup-only controls
function renderDev() {
  const dev = document.getElementById("dev");
  dev.innerHTML = ["new", "reception", "year1"].map((c) => `<button data-child="${c}" class="${c === childName ? "on" : ""}">${c === "year1" ? "Year 1" : c === "new" ? "New" : "Reception"}</button>`).join("") +
    `<button data-act="unlock">Unlock one</button><button data-act="win">Win a gem</button>`;
  dev.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.child) { childName = b.dataset.child; ST = structuredClone(DATA.children[childName]); boot(); return; }
    if (b.dataset.act === "unlock") {
      const pts = PAGES[cur];
      const m = pts.find((pt) => !ST[pt.p].met && pt.spellings.some((x) => x.inPlay)) || pts.find((pt) => !ST[pt.p].met);
      if (m) unlock(m.p); else toast("every sound on this page is met");
    }
    if (b.dataset.act === "win") {
      for (const pt of PAGES[cur]) { const k = ST[pt.p].gems.findIndex((g) => g.st === "ready"); if (k >= 0) return winGem(pt.p, k); }
      for (const pt of PAGES[cur]) { const k = ST[pt.p].gems.findIndex((g) => g.st === "charging"); if (k >= 0) return winGem(pt.p, k); }
      toast("no gem to win on this page");
    }
  };
}

// ------------------------------------------------------------------ boot
function startPage() {
  if (Q.has("page")) return Math.max(0, Math.min(2, +Q.get("page") - 1));
  const p = NEWEST[childName];
  return PAGES.findIndex((ps) => ps.some((x) => x.p === p));
}
function boot() {
  closeCard(true);
  const unl = Q.get("unlock");
  if (unl && ST[unl]) { ST[unl] = { ...ST[unl], met: false, complete: false, gems: ST[unl].gems.map((g) => (g.st === "future" ? g : { st: "hidden", e: 0 })) }; }
  renderAlbum();
  cur = -1;
  const sp = startPage();
  album.scrollLeft = sp * PAGE_W;      // opens where the child's newest sound is, with no nudge
  setCur(sp);
  renderStrip();
  liveIdx = -1;
  requestAnimationFrame(() => settled());
  renderDev();
  window.__album = { count: () => ({ page: document.querySelectorAll("*").length, album: album.querySelectorAll("*").length, strip: strip.querySelectorAll("*").length }), scale: () => scale, cur: () => cur };
  if (unl) setTimeout(() => unlock(unl), +(Q.get("unlockAt") || 700));
  if (Q.get("open")) setTimeout(() => { const b = album.querySelector(`.petal[data-p="${Q.get("open")}"]`); if (b) openCard(Q.get("open"), Q.has("instant") ? null : b); }, 50);
}
document.fonts.load("700 40px Andika").then(() => document.fonts.load("400 40px Andika")).then(() => document.fonts.ready).then(boot, boot);
</script>
