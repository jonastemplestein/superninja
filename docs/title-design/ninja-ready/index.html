<!doctype html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#4a2f6e" />
<title>Super Ninja title: ninja ready</title>
<!-- the art first: the dusk sky sized for the phone, the bloom and the ninja; fonts after -->
<link rel="preload" as="image" href="art/dusk-2400.webp" imagesrcset="art/dusk-1600.webp 1600w, art/dusk-2400.webp 2400w" imagesizes="104vw" fetchpriority="high" />
<link rel="preload" as="image" href="art/flower-bloom.webp" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&family=Luckiest+Guy&display=block" rel="stylesheet" />
<style>
:root {
  --ink: #2b1d14; --paper: #fff4dc; --gold: #ffc53d; --gold-deep: #c98a00; --red: #e2412f;
  --good: #3fbf6a; --good-deep: #1f7a41; --lacquer: #c7372b; --lacquer-deep: #7d1d17;
  --font-display: "Luckiest Guy", "Baloo 2", system-ui, sans-serif;
  --font-ui: "Baloo 2", "Andika", system-ui, sans-serif;
  --font-letters: "Andika", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
/* the first paint is already dusk (never the old flat grey), matching the painting's own colours */
body {
  background: linear-gradient(180deg, #8a6fd0 0%, #f08fb0 30%, #ffc98f 52%, #b9c46e 64%, #6f8a4a 100%);
  font-family: var(--font-ui); color: var(--ink);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none;
}
img { -webkit-user-drag: none; user-select: none; display: block; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--gold); outline-offset: 4px; }

/* ---------- the stage: 1280×720 scaled to the phone like the game's Stage (src/ui/ui.tsx); the art bleeds past it */
.viewport { position: fixed; inset: 0; overflow: hidden; }
.stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 0 0; }
.world { position: absolute; inset: 0; }
.world.shake { animation: shake .42s cubic-bezier(.3,.6,.4,1); }
@keyframes shake { 0%{transform:translate(0,0)} 15%{transform:translate(-9px,5px)} 30%{transform:translate(8px,-6px)} 45%{transform:translate(-6px,4px)} 60%{transform:translate(4px,-2px)} 80%{transform:translate(-2px,1px)} 100%{transform:none} }
.bleed { position: absolute; left: -240px; top: -64px; width: 1760px; height: 846px; pointer-events: none; }
.bleed img { width: 100%; height: 100%; object-fit: cover; }
.abs { position: absolute; }
.nopoint { pointer-events: none; }

/* ---------- the World Flower: warm glow, slowly turning rays, the stem, the bloom, petals dancing round it */
.flower { position: absolute; left: 770px; top: -8px; width: 430px; height: 430px; pointer-events: none; }
.f-glow { position: absolute; inset: -170px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,246,200,.95), rgba(255,217,112,.55) 45%, rgba(255,197,61,0) 100%); animation: breathe 5s ease-in-out infinite; }
@keyframes breathe { 0%,100% { opacity: .75; transform: scale(.97); } 50% { opacity: 1; transform: scale(1.03); } }
.f-rays { position: absolute; inset: -150px; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(255,240,180,.55) 0deg 6deg, rgba(255,240,180,0) 6deg 22.5deg);
  -webkit-mask: radial-gradient(closest-side, #000 30%, transparent 100%); mask: radial-gradient(closest-side, #000 30%, transparent 100%);
  animation: spin 90s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.f-stem { position: absolute; left: 18.96%; top: 40.2%; width: 95.6%; }
.f-bloom { position: absolute; inset: 0; width: 100%; height: 100%; animation: bloom 6s ease-in-out infinite; }
@keyframes bloom { 0%,100% { transform: rotate(-1.5deg) scale(1); } 50% { transform: rotate(1.5deg) scale(1.02); } }
.orbit { position: absolute; inset: -40px; animation: spin 40s linear infinite; }
.orbit i { position: absolute; left: 50%; top: 50%; width: 34px; height: 46px; margin: -23px 0 0 -17px; }
/* a sound petal: a teardrop in its own colour, inked like the painting's (not the old pale opal ones) */
.petal { display: block; width: 100%; height: 100%; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; clip-path: path('M15,40 C11,31 0,25 0,15 A15,15 0 0 1 30,15 C30,25 19,31 15,40 Z');
  background: radial-gradient(circle at 38% 30%, #fff 0 8%, transparent 26%), linear-gradient(180deg, color-mix(in srgb, var(--c) 55%, #fff), var(--c) 58%, color-mix(in srgb, var(--c) 80%, #2b1d14)); }
.sparkle { position: absolute; width: 34px; height: 34px; margin: -17px; pointer-events: none;
  background: radial-gradient(circle, #fff 0 12%, transparent 16%), conic-gradient(from 0deg, transparent 0 40deg, #fff6c8 43deg 47deg, transparent 50deg 130deg, #fff6c8 133deg 137deg, transparent 140deg 220deg, #fff6c8 223deg 227deg, transparent 230deg 310deg, #fff6c8 313deg 317deg, transparent 320deg);
  border-radius: 50%; animation: twinkle 2.6s ease-in-out infinite; opacity: 0; }
@keyframes twinkle { 0%,100% { opacity: 0; transform: scale(.3) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 70% { opacity: 0; transform: scale(.5) rotate(90deg); } }

/* ---------- drifting sound petals over the scene */
.drift { position: absolute; left: -240px; right: -240px; top: -64px; bottom: -64px; pointer-events: none; overflow: hidden; }
.drift i { position: absolute; top: -50px; width: 26px; height: 35px; animation: drift linear infinite; opacity: .95; }
@keyframes drift { 0% { transform: translate(0,0) rotate(0deg); } 100% { transform: translate(-260px, 900px) rotate(600deg); } }

/* ---------- Baron Muddle in his storm cloud, glowering at the flower */
.baron { position: absolute; left: 1078px; top: 196px; width: 230px; height: 250px; pointer-events: none; animation: baron-in .8s ease-out 1.1s both, hover 5.5s ease-in-out 1.9s infinite; }
@keyframes baron-in { from { translate: 260px -40px; opacity: 0; } to { translate: 0 0; opacity: 1; } }
@keyframes hover { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.baron img { position: absolute; left: 16px; top: -10px; width: 210px; filter: drop-shadow(0 0 12px rgba(160,80,255,.6)); }
.b-aura { position: absolute; left: -40px; top: -50px; width: 310px; height: 280px; border-radius: 50%; background: radial-gradient(closest-side, rgba(120,60,200,.55), rgba(120,60,200,0)); animation: aura 3.2s ease-in-out infinite; }
@keyframes aura { 0%,100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
.cloud { position: absolute; left: -6px; top: 124px; width: 246px; height: 112px; overflow: visible; }
.bolt { position: absolute; left: 30px; top: 196px; width: 60px; height: 120px; opacity: 0; animation: bolt 6.5s linear infinite; }
.bolt.b2 { left: 160px; top: 206px; animation-delay: -3.1s; transform: scaleX(-1); }
@keyframes bolt { 0%, 90%, 94%, 100% { opacity: 0; } 91%, 93% { opacity: 1; } 92% { opacity: .3; } }

/* ---------- the logo (the game's lockup: Luckiest Guy, gold over red, thick ink, a tilt) */
.logo { position: absolute; left: 36px; top: 16px; font-family: var(--font-display); line-height: .86; letter-spacing: 4px; text-align: center;
  -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; text-shadow: 0 11px 0 var(--ink), 0 22px 30px rgba(60,20,60,.35);
  transform: rotate(-4deg); pointer-events: none; animation: logo-in .7s cubic-bezier(.3,1.5,.5,1) both; }
.logo .l1 { display: block; color: var(--gold); font-size: 124px; }
.logo .l2 { display: block; color: var(--red); font-size: 158px; }
@keyframes logo-in { from { transform: translateY(-60px) rotate(-10deg) scale(.7); opacity: 0; } to { transform: rotate(-4deg); opacity: 1; } }

/* ---------- the ninja, ready on their rock */
.rock { position: absolute; width: 340px; }
/* entrances use the individual translate/scale properties, so they never fight the loops on transform */
.ninja-wrap { position: absolute; transform-origin: 50% 100%; animation: land .55s cubic-bezier(.45,0,.6,1.35) .2s both; }
.ninja-wrap.back { animation-delay: .38s; }
@keyframes land { from { translate: 0 -620px; } 80% { translate: 0 8px; } to { translate: 0 0; } }
.ninja { position: absolute; left: 0; bottom: 0; transform-origin: 50% 100%; animation: ready 1.15s ease-in-out infinite alternate; }
@keyframes ready { from { transform: translateY(0) scale(1, 1); } to { transform: translateY(5px) scale(1.012, .982); } }
.shadow { position: absolute; height: 34px; border-radius: 50%; background: radial-gradient(closest-side, rgba(43,29,20,.45), rgba(43,29,20,0)); animation: shadow 1.15s ease-in-out infinite alternate; }
@keyframes shadow { to { transform: scaleX(1.05); } }
.nameplate { position: absolute; transform: translateX(-50%) rotate(-2deg); padding: 2px 18px 0; border-radius: 12px; border: 4px solid var(--ink);
  background: linear-gradient(180deg, #fff7e3, #f3dcae); box-shadow: 0 4px 0 var(--ink); font: 700 30px/1.25 var(--font-letters); white-space: nowrap; pointer-events: none; }
.nameplate:empty { display: none; }
.puff { position: absolute; width: 220px; height: 220px; margin: -110px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 35% 40%, #fff 0 22%, transparent 23%), radial-gradient(circle at 65% 35%, #fff 0 20%, transparent 21%), radial-gradient(circle at 55% 65%, #fff 0 24%, transparent 25%), radial-gradient(circle at 30% 68%, #fff 0 17%, transparent 18%);
  animation: puff .55s ease-out forwards; }
@keyframes puff { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
.ninja-wrap.lunge .ninja { animation: none; }
.ninja-wrap.lunge { animation: lunge .3s cubic-bezier(.3,1.6,.5,1) forwards; }
@keyframes lunge { to { transform: translateX(46px) rotate(4deg); } }
.ninja-wrap.leap { animation: leap .7s cubic-bezier(.4,-0.3,.6,1) forwards; }
@keyframes leap { 0% { transform: translate(46px,0) rotate(4deg); } 25% { transform: translate(40px,24px) scale(1.05,.9); } 100% { transform: translate(420px,-760px) rotate(28deg); } }

/* ---------- PLAY: a big gold gong in a red-lacquer crescent cradle, under the ninja's fist */
.gong { position: absolute; left: 698px; top: 300px; width: 340px; height: 400px; touch-action: manipulation; animation: gong-in .5s cubic-bezier(.3,1.7,.5,1) .7s both; }
@keyframes gong-in { from { scale: .2; opacity: 0; } to { scale: 1; opacity: 1; } }
.g-glow { position: absolute; left: 30px; top: 0; width: 280px; height: 280px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255,250,210,.95), rgba(255,214,102,.7) 55%, rgba(255,197,61,0));
  transform: scale(1.45); animation: gglow 1.8s ease-in-out infinite; }
@keyframes gglow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
.g-ring { position: absolute; left: 30px; top: 0; width: 280px; height: 280px; border-radius: 50%; border: 10px solid #fff6c8; pointer-events: none;
  box-shadow: 0 0 22px 4px rgba(255,220,120,.9); animation: gring 1.8s ease-out infinite; }
@keyframes gring { 0% { transform: scale(.98); opacity: .95; } 100% { transform: scale(1.45); opacity: 0; } }
.cradle { position: absolute; inset: 0; pointer-events: none; }
.c-arc { position: absolute; left: 2px; top: 128px; width: 336px; height: 180px; border: 26px solid var(--lacquer); border-top: 0; border-radius: 0 0 168px 168px / 0 0 168px 168px;
  box-shadow: 0 0 0 6px var(--ink), inset 0 -5px 0 var(--lacquer-deep); background: none; }
.c-arc::after { content: ""; position: absolute; inset: auto 24% -26px; height: 10px; background: rgba(255,255,255,.25); border-radius: 10px; }
.c-cap { position: absolute; top: 112px; width: 52px; height: 30px; border-radius: 10px; background: linear-gradient(180deg, #ffe38a, var(--gold) 55%, var(--gold-deep)); border: 5px solid var(--ink); }
.c-shadow { position: absolute; left: 20px; right: 20px; top: 352px; height: 34px; border-radius: 50%; background: radial-gradient(closest-side, rgba(43,29,20,.5), rgba(43,29,20,0)); }
.disc { position: absolute; left: 30px; top: 0; width: 280px; height: 280px; border-radius: 50%; animation: gbreathe 1.8s ease-in-out infinite; transition: transform .08s; }
@keyframes gbreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
.d-gem { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px; border-radius: 50%; border: 4px solid var(--ink);
  background: radial-gradient(circle at 35% 30%, #fff 0 14%, color-mix(in srgb, var(--c) 60%, #fff) 30%, var(--c) 70%); }
.d-face { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; border: 8px solid var(--ink);
  background:
    repeating-radial-gradient(circle at 50% 50%, rgba(125,72,0,0) 0 9px, rgba(125,72,0,.24) 9px 11px, rgba(255,250,220,.35) 11px 12px),
    repeating-conic-gradient(from 0deg, rgba(255,250,215,.16) 0deg 3deg, rgba(255,250,215,0) 3deg 15deg),
    radial-gradient(circle at 36% 30%, #fffbe0 0%, #ffd35a 34%, #f0a91e 64%, #b86f08 100%);
  box-shadow: 0 12px 0 var(--ink), inset 0 -10px 0 rgba(120,60,0,.35); }
.d-dot { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px; border-radius: 50%; border: 5px solid var(--ink); }
.d-boss { position: absolute; left: 50%; top: 50%; width: 176px; height: 176px; margin: -88px; border-radius: 50%; border: 8px solid var(--ink);
  background: radial-gradient(circle at 36% 30%, #eafff0 0%, #7ee29a 22%, var(--good) 55%, var(--good-deep) 100%);
  box-shadow: 0 7px 0 rgba(43,29,20,.55), inset 0 -8px 0 rgba(0,60,20,.35); display: grid; place-items: center; }
.d-boss svg { width: 100px; height: 100px; margin-left: 12px; overflow: visible; }
.d-glint { position: absolute; left: -40%; top: -20%; width: 34%; height: 140%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.75), rgba(255,255,255,0));
  transform: translateX(-120%) rotate(22deg); animation: glint 3.6s ease-in-out infinite; mix-blend-mode: screen; }
@keyframes glint { 0% { transform: translateX(-60%) rotate(22deg); } 30%, 100% { transform: translateX(460%) rotate(22deg); } }
.plaque { position: absolute; left: 50%; top: 282px; transform: translateX(-50%); padding: 10px 26px 2px; border-radius: 16px; border: 6px solid var(--ink);
  background: linear-gradient(180deg, #e04a3c, var(--lacquer) 60%, var(--lacquer-deep)); box-shadow: 0 6px 0 var(--ink);
  font: 400 50px/1 var(--font-display); letter-spacing: 3px; color: var(--gold); -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; pointer-events: none; }
@media (hover: hover) { .gong:hover .disc { transform: scale(1.07); animation-play-state: paused; } .gong:hover .g-glow { opacity: 1; } }
.gong.pressed .disc { transform: translateY(10px) scale(.95); animation: none; filter: brightness(.92); }
.gong.struck .disc { animation: wobble .9s cubic-bezier(.3,.7,.4,1); }
@keyframes wobble { 0% { transform: scale(.9) rotate(0); } 15% { transform: scale(1.12) rotate(-7deg); } 32% { transform: scale(1.02) rotate(5deg); } 50% { transform: scale(1.05) rotate(-3deg); } 70% { transform: rotate(1.5deg); } 100% { transform: none; } }
.shock { position: absolute; width: 300px; height: 300px; margin: -150px; border-radius: 50%; border: 18px solid #fffbe0; pointer-events: none; box-shadow: 0 0 40px 10px rgba(255,220,120,.8); animation: shock .8s ease-out forwards; }
@keyframes shock { from { transform: scale(.8); opacity: 1; } to { transform: scale(4.2); opacity: 0; } }
.burst { position: absolute; width: 34px; height: 46px; margin: -23px -17px; pointer-events: none; animation: burst 1.1s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes burst { from { transform: translate(0,0) rotate(0) scale(.4); opacity: 1; } 70% { opacity: 1; } to { transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1); opacity: 0; } }
/* the way on: a warm golden iris from the gong (not the old cut to near-black) */
.wipe { position: absolute; width: 3200px; height: 3200px; margin: -1600px; border-radius: 50%; pointer-events: none; z-index: 200;
  background: radial-gradient(closest-side, #fffbe8 0%, #fff4dc 70%, #ffe3a0 100%); animation: wipe .75s cubic-bezier(.5,0,.8,.6) forwards; }
@keyframes wipe { from { transform: scale(.02); } to { transform: scale(1); } }

/* ---------- players: little ninja badges, bottom-left (a tap picks who's playing; it doesn't start) */
.players { position: absolute; left: 22px; bottom: 14px; width: 372px; display: flex; flex-wrap: wrap-reverse; gap: 8px 10px; align-items: flex-end; z-index: 60; }
.players:empty { display: none; }
.badge { position: relative; width: 84px; height: 104px; display: flex; flex-direction: column; align-items: center; touch-action: manipulation; }
.b-face { position: relative; width: 84px; height: 84px; border-radius: 50%; border: 5px solid var(--ink); overflow: hidden; background: var(--bc, #9ea3f0);
  box-shadow: 0 5px 0 var(--ink); transition: transform .2s cubic-bezier(.3,1.6,.5,1); }
.b-face img { position: absolute; left: -4%; top: 2%; width: 108%; }
.b-face .ini { position: absolute; inset: 0; display: grid; place-items: center; font: 700 48px/1 var(--font-letters); }
.b-name { margin-top: -12px; max-width: 96px; padding: 1px 8px 0; border-radius: 10px; border: 3px solid var(--ink); background: #fff7e3; font: 700 17px/1.2 var(--font-letters); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
.badge.on .b-face { transform: scale(1.12); box-shadow: 0 5px 0 var(--ink), 0 0 0 6px var(--gold), 0 0 0 10px var(--ink), 0 0 22px 8px rgba(255,220,120,.8); }
.badge.on .b-name { background: var(--gold); }
.badge.new .b-face { background: rgba(255,244,220,.8); border-style: dashed; box-shadow: none; display: grid; place-items: center; font: 400 58px/1 var(--font-display); color: var(--good); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; padding-top: 8px; }
.badge.new { width: 58px; height: 58px; margin-bottom: 18px; }
.badge.new .b-face { width: 58px; height: 58px; font-size: 42px; border-width: 4px; }
.players.many .badge:not(.new) { width: 70px; height: 90px; }
.players.many .badge:not(.new) .b-face { width: 70px; height: 70px; border-width: 4px; }
.players.many .b-name { font-size: 16px; max-width: 80px; margin-top: -10px; padding: 0 6px; border-width: 3px; }
.players.many .ini { font-size: 40px; }
.players.many .badge.new { width: 50px; height: 50px; margin-bottom: 14px; }
.players.many .badge.new .b-face { width: 50px; height: 50px; font-size: 34px; }

/* ---------- grown-ups: the gear (press and hold 2 s), top-right as on the map */
.gear { position: absolute; right: 18px; top: 18px; width: 92px; height: 92px; z-index: 70; display: grid; place-items: center; touch-action: none; }
.gear .g-plate { position: absolute; inset: 8px; border-radius: 50%; background: rgba(255,244,220,.72); border: 5px solid rgba(43,29,20,.75); }
.gear svg.cog { position: relative; width: 44px; height: 44px; fill: var(--ink); opacity: .8; }
.gear svg.prog { position: absolute; inset: 0; width: 92px; height: 92px; transform: rotate(-90deg); }
.gear svg.prog circle { fill: none; stroke: var(--gold); stroke-width: 9; stroke-dasharray: 245; stroke-dashoffset: 245; stroke-linecap: round; }
.gear.holding svg.prog circle { transition: stroke-dashoffset 2s linear; stroke-dashoffset: 0; }
.hint { position: absolute; right: 0; top: calc(100% + 8px); white-space: nowrap; font: 700 26px/1 var(--font-ui); color: var(--ink); background: #fffdf6; border: 4px solid var(--ink); border-radius: 18px; padding: 10px 16px; pointer-events: none; }

/* ---------- Sensei's Help coin: bottom-right, as on every screen. Its "?" is sky blue now: Play is the only green thing */
.help-btn { position: absolute; right: 14px; bottom: 14px; z-index: 85; width: 124px; height: 124px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #fff8e6, #ffd98a 70%, #e0a53a); border: 6px solid var(--ink); box-shadow: 0 7px 0 var(--ink), 0 0 0 6px rgba(255,244,220,.8); }
.help-btn img { position: absolute; inset: 5px; width: calc(100% - 10px); height: calc(100% - 10px); border-radius: 50%; object-fit: cover; }
.help-q { position: absolute; left: -10px; top: -10px; width: 46px; height: 46px; border-radius: 50%; background: #4aa8e0; border: 5px solid var(--ink); color: #fff; font: 400 30px/38px var(--font-display); text-align: center; text-shadow: 0 2px 0 var(--ink); }
.help-btn.talking { animation: helptalk .5s ease-in-out infinite alternate; }
@keyframes helptalk { from { transform: scale(1); } to { transform: scale(1.07); } }
.bubble { position: absolute; right: 16px; bottom: 164px; max-width: 280px; padding: 12px 20px 8px; border-radius: 26px; border: 5px solid var(--ink); background: #fffdf6; box-shadow: 0 6px 0 var(--ink);
  font: 800 30px/1.15 var(--font-ui); z-index: 86; pointer-events: none; transform-origin: 80% 100%; text-align: center; animation: pop .35s cubic-bezier(.3,1.6,.5,1) both; }
.bubble::after { content: ""; position: absolute; right: 48px; bottom: -19px; width: 30px; height: 30px; background: #fffdf6; border-right: 5px solid var(--ink); border-bottom: 5px solid var(--ink); transform: rotate(45deg); }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- what comes after the wipe (a stand-in, so the mockup can be replayed) */
.next { position: absolute; inset: 0; z-index: 210; display: grid; place-items: center; background: #fff4dc; animation: fadein .3s both; }
.next .card { text-align: center; font: 800 44px/1.2 var(--font-ui); }
.next .card small { display: block; font: 600 26px/1.4 var(--font-ui); color: #6e5341; margin-top: 12px; }
.next button { margin-top: 26px; font: 800 30px/1 var(--font-ui); padding: 16px 30px; border-radius: 999px; border: 5px solid var(--ink); background: var(--gold); box-shadow: 0 6px 0 var(--ink); }
@keyframes fadein { from { opacity: 0; } }
.sheet { position: absolute; left: 240px; right: 240px; top: 70px; bottom: 70px; z-index: 220; background: #fff4dc; border: 7px solid var(--ink); border-radius: 36px; box-shadow: 0 10px 0 var(--ink); padding: 30px 40px; font: 700 30px/1.35 var(--font-ui); animation: pop .3s both; }
.sheet h2 { margin: 0 0 12px; font: 400 52px/1 var(--font-display); color: var(--red); -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; letter-spacing: 2px; }
.sheet button { position: absolute; right: 26px; top: 22px; font: 800 28px/1 var(--font-ui); padding: 12px 22px; border-radius: 999px; border: 5px solid var(--ink); background: var(--gold); box-shadow: 0 5px 0 var(--ink); }

/* ---------- the demo strip (not part of the design; hidden with ?ui=0) */
.demo { position: fixed; left: 50%; top: 0; transform: translateX(-50%); z-index: 999; display: flex; gap: 4px; padding: 3px 6px; background: rgba(29,18,48,.78); border-radius: 0 0 10px 10px; font: 600 11px/1 system-ui, sans-serif; color: #fff; opacity: .55; }
.demo:hover { opacity: 1; }
.demo button { color: #fff; font: 600 11px/1 system-ui, sans-serif; padding: 4px 7px; border-radius: 6px; background: rgba(255,255,255,.12); }
.demo button.on { background: #ffc53d; color: #2b1d14; }

.rotate { display: none; }
@media (orientation: portrait) and (max-width: 600px) {
  .rotate { display: grid; position: fixed; inset: 0; z-index: 1000; place-items: center; background: #4a2f6e; color: #fff4dc; font: 800 28px/1.3 var(--font-ui); text-align: center; padding: 30px; }
}
@media (prefers-reduced-motion: reduce) {
  .f-rays, .orbit, .drift i, .sparkle, .bolt { animation: none !important; }
  .drift { display: none; }
}
</style>
</head>
<body>
<div class="viewport" id="viewport">
  <div class="stage" id="stage">
    <div class="world scene title" id="world">
      <div class="bleed"><img src="art/dusk-2400.webp" srcset="art/dusk-1600.webp 1600w, art/dusk-2400.webp 2400w" sizes="104vw" alt="" fetchpriority="high" /></div>

      <div class="flower" id="flower">
        <div class="f-glow"></div>
        <div class="f-rays"></div>
        <img class="f-stem" src="../../../public/a/i/world_flower_stem.webp" alt="" />
        <img class="f-bloom" src="art/flower-bloom.webp" alt="" />
        <div class="orbit" id="orbit"></div>
      </div>

      <div class="baron">
        <svg class="bolt" viewBox="0 0 60 120"><path d="M34 0 L8 62 L28 62 L14 120 L54 44 L32 44 L46 0 Z" fill="#fff38a" stroke="#2b1d14" stroke-width="4" stroke-linejoin="round"/></svg>
        <svg class="bolt b2" viewBox="0 0 60 120"><path d="M34 0 L8 62 L28 62 L14 120 L54 44 L32 44 L46 0 Z" fill="#fff38a" stroke="#2b1d14" stroke-width="4" stroke-linejoin="round"/></svg>
        <div class="b-aura"></div>
        <img src="../../../public/a/i/baron_idle.webp" alt="" />
        <svg class="cloud" viewBox="0 0 300 136"><defs><linearGradient id="cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a88ad8"/><stop offset=".55" stop-color="#6d4f9e"/><stop offset="1" stop-color="#43306a"/></linearGradient></defs>
          <path d="M22,102 C-2,100 2,66 26,66 C20,40 52,26 72,42 C80,12 124,8 136,34 C148,4 200,8 206,40 C226,22 266,32 260,62 C292,62 300,100 272,106 C262,124 228,126 214,112 C198,130 158,130 144,114 C128,130 90,128 78,114 C62,128 28,124 22,102 Z" fill="url(#cl)" stroke="#2b1d14" stroke-width="6" stroke-linejoin="round"/>
          <path d="M58,86 c-8,-14 8,-28 22,-20 c10,6 4,20 -6,16 M150,74 c-6,-16 14,-30 28,-18 c9,8 1,20 -9,14 M232,92 c-2,-10 12,-16 18,-8" fill="none" stroke="#c9b6f2" stroke-width="5" stroke-linecap="round" opacity=".85"/></svg>
      </div>

      <div class="drift" id="drift"></div>

      <div class="logo"><span class="l1">Super</span><span class="l2">Ninja</span></div>
      <div class="sparkle" style="left:92px;top:40px;animation-delay:-.4s"></div>
      <div class="sparkle" style="left:470px;top:150px;animation-delay:-1.7s"></div>

      <div id="heroes"></div>

      <button class="gong" id="gong" aria-label="Start">
        <div class="g-glow"></div>
        <div class="g-ring"></div>
        <div class="cradle">
          <div class="c-shadow"></div>
          <div class="c-arc"></div>
          <div class="c-cap" style="left:-10px"></div><div class="c-cap" style="right:-10px"></div>
        </div>
        <div class="disc" id="disc">
          <div class="d-face" id="dface">
            <div class="d-glint"></div>
          </div>
          <div class="d-boss"><svg viewBox="0 0 100 100"><path d="M18 8 L92 50 L18 92 Z" fill="#fff" stroke="#2b1d14" stroke-width="12" stroke-linejoin="round" paint-order="stroke"/></svg></div>
        </div>
        <div class="plaque">Play</div>
      </button>

      <div class="players" id="players"></div>

      <button class="gear" id="gear" aria-label="Grown-ups">
        <div class="g-plate"></div>
        <svg class="prog" viewBox="0 0 92 92"><circle cx="46" cy="46" r="39"/></svg>
        <svg class="cog" viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.2 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>

      <button class="help-btn" id="help" aria-label="Help">
        <img src="../../../public/a/i/sensei_face_idle.webp" alt="" />
        <span class="help-q">?</span>
      </button>
    </div>
  </div>
  <div class="rotate">Turn your phone sideways to play</div>
</div>
<div class="demo" id="demo"></div>
<audio id="music" src="../../../public/a/m/title.mp3" preload="none" loop></audio>

<script>
(() => {
  // ------------------------------------------------------------ fit the stage like the game (src/ui/ui.tsx Stage)
  const stage = document.getElementById("stage");
  const fit = () => {
    const touch = matchMedia("(pointer: coarse)").matches;
    const cs = getComputedStyle(document.documentElement);
    const top = touch ? 10 : 0, bottom = touch ? 26 : 0, side = touch ? 8 : 0;
    const aw = innerWidth - side * 2, ah = innerHeight - top - bottom;
    const s = Math.min(aw / 1280, ah / 720);
    stage.style.left = `${side + aw / 2}px`;
    stage.style.top = `${top + ah / 2}px`;
    stage.style.transform = `scale(${s}) translate(-50%, -50%)`;
    window.__scale = s;
  };
  fit();
  addEventListener("resize", fit);

  const $ = (id) => document.getElementById(id);
  const world = $("world");
  const params = new URLSearchParams(location.search);
  window.__snState = { scene: "title" };

  // ------------------------------------------------------------ states
  const P = (name, hero, colour) => ({ name, hero, colour });
  const STATES = {
    first: [],
    returning: [P("Maya", "suki", "#8fe0cc")],
    many: [P("Maya", "suki", "#8fe0cc"), P("Leo", "kai", "#9ea3f0"), P("Ava", "suki", "#ff9ec0"), P("Theo", null, "#ffc53d")],
    lots: [P("Maya", "suki", "#8fe0cc"), P("Leo", "kai", "#9ea3f0"), P("Ava", "suki", "#ff9ec0"), P("Theo", null, "#ffc53d"), P("Isabella", "kai", "#b99cff"), P("Sam", "suki", "#ffa46b"), P("Noor", null, "#8fd16a")],
  };
  let stateName = params.get("state") in STATES ? params.get("state") : "returning";
  let players = STATES[stateName];
  let active = 0;

  // ------------------------------------------------------------ petals (sound colours from src/content/flower.ts)
  const COLS = ["#e8312f", "#f5821f", "#f3c74a", "#2fa65a", "#2ec4b6", "#4a7dff", "#8a3be0", "#f0226b", "#5ec8f2", "#9ae29a", "#ff8fb8", "#c42fd1"];
  const petal = (c) => `<span class="petal" style="--c:${c}"></span>`;
  const orbit = $("orbit");
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * 360, r = 250 + (i % 3) * 16;
    orbit.insertAdjacentHTML("beforeend", `<i style="transform:rotate(${a}deg) translateY(-${r}px) rotate(${(i % 2 ? 1 : -1) * 20}deg) scale(${0.8 + (i % 3) * 0.12})">${petal(COLS[i])}</i>`);
  }
  const drift = $("drift");
  for (let i = 0; i < 11; i++) {
    const left = 8 + ((i * 137) % 100) * 0.9, dur = 11 + (i * 7) % 9, delay = -((i * 3.7) % dur), s = 0.75 + (i % 4) * 0.15;
    drift.insertAdjacentHTML("beforeend", `<i style="left:${left}%;animation-duration:${dur}s;animation-delay:${delay}s;scale:${s}">${petal(COLS[(i * 5) % COLS.length])}</i>`);
  }
  const fl = $("flower");
  [[70, 90, -0.3], [390, 60, -1.1], [430, 330, -2.0], [40, 300, -1.5], [230, -10, -0.8]].forEach(([x, y, d]) =>
    fl.insertAdjacentHTML("beforeend", `<div class="sparkle" style="left:${x}px;top:${y}px;animation-delay:${d}s"></div>`));

  // ------------------------------------------------------------ the ninja(s) on the rock
  const HERO = { kai: { w: 702, h: 853 }, suki: { w: 764, h: 855 } };
  const img = (hero, pose) => `../../../public/a/i/hero_${hero}_${pose}.webp`;
  const NINJA_H = 430, FEET_X = 520, FEET_Y = 632;
  function renderHeroes() {
    const p = players[active];
    const heroes = $("heroes");
    const rock = (x, y, w) => `<img class="rock" src="../../../public/a/i/item_stone_platform.webp" alt="" style="left:${x - w * 0.53}px;top:${y - w * 0.17}px;width:${w}px" />`;
    let html = "";
    const one = (hero, x, y, scale, cls, delay) => {
      const h = NINJA_H * scale, w = (h * HERO[hero].w) / HERO[hero].h;
      return `<div class="shadow" style="left:${x - w * 0.36}px;top:${y - 18}px;width:${w * 0.66}px"></div>` +
        `<div class="ninja-wrap ${cls}" data-hero="${hero}" style="left:${x - w * 0.47}px;top:${y - h}px;width:${w}px;height:${h}px"><img class="ninja" src="${img(hero, "ready")}" alt="" style="width:${w}px;animation-delay:${delay}s" /></div>`;
    };
    if (!p || !p.hero) {
      // no ninja chosen yet (first launch, or a player who hasn't chosen): both, side by side, Suki a step back
      html += one("suki", FEET_X - 205, FEET_Y - 34, 0.88, "back", -0.5) + rock(FEET_X + 30, FEET_Y, 340) + one("kai", FEET_X + 30, FEET_Y, 1, "front", 0);
    } else {
      html += rock(FEET_X, FEET_Y, 340) + one(p.hero, FEET_X, FEET_Y, 1, "front", 0);
    }
    html += `<div class="nameplate" id="nameplate" style="left:${FEET_X + 6}px;top:${FEET_Y + 22}px">${p ? esc(p.name) : ""}</div>`;
    heroes.innerHTML = html;
    clearTimeout(landT);
    landT = setTimeout(() => puffAt(FEET_X, FEET_Y - 20, true), 620);
  }
  let landT = 0;
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  // ------------------------------------------------------------ player badges (bottom-left)
  function renderPlayers() {
    const box = $("players");
    box.classList.toggle("many", players.length >= 4);
    if (!players.length) return void (box.innerHTML = ""); // first launch: Play itself makes the first player
    box.innerHTML = players.map((p, i) => `<button class="badge ${i === active ? "on" : ""}" data-i="${i}" aria-label="player ${esc(p.name)}">
        <span class="b-face" style="--bc:${p.colour}">${p.hero ? `<img src="art/badge-${p.hero}.webp" alt="" />` : `<span class="ini">${esc([...p.name][0])}</span>`}</span>
        <span class="b-name">${esc(p.name)}</span></button>`).join("") +
      `<button class="badge new" data-new="1" aria-label="New player"><span class="b-face">+</span></button>`;
  }
  $("players").addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    const b = e.target.closest(".badge");
    if (!b || going) return;
    if (b.dataset.new) { unlock(); sfx("pop"); return showNext("new"); }
    const i = +b.dataset.i;
    if (i === active) { unlock(); kiai(); return; }
    active = i;
    unlock();
    sfx("pop");
    const wrap = document.querySelector(".ninja-wrap.front");
    puffAt(FEET_X, FEET_Y - 200);
    setTimeout(() => { renderHeroes(); renderPlayers(); greet(true); }, 120);
  });

  // ------------------------------------------------------------ sound: unlocked by the first tap; music streams (never decoded)
  let ctx = null, unlocked = false;
  const music = $("music");
  function unlock() {
    if (unlocked) return;
    unlocked = true;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch {}
    music.volume = 0.32;
    music.play().catch(() => {});
    setTimeout(() => { if (!going) greet(false); }, 500);
  }
  function tone(f, dur, vol, delay = 0, type = "sine") {
    if (!ctx) return;
    const t = ctx.currentTime + delay, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, freq, sweep) {
    if (!ctx) return;
    const t = ctx.currentTime, len = Math.ceil(ctx.sampleRate * dur), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = buf; f.type = "bandpass"; f.frequency.setValueAtTime(freq, t); if (sweep) f.frequency.exponentialRampToValueAtTime(sweep, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(ctx.destination); s.start(t);
  }
  const SFX = {
    gong: () => { [110, 220.5, 331, 443].forEach((f, i) => tone(f, 3.2 - i * 0.5, 0.25 / (i + 1))); noise(0.4, 0.2, 900); },
    whoosh: () => noise(0.35, 0.35, 400, 3000),
    pop: () => { tone(520, 0.12, 0.35, 0, "sine"); noise(0.05, 0.15, 3000); },
    sparkle: () => [1568, 2093, 2637, 3136].forEach((f, i) => tone(f, 0.3, 0.1, i * 0.035)),
  };
  const sfx = (n) => { try { SFX[n](); } catch {} };
  let voice = null;
  function say(line, text) {
    if (!unlocked) return;
    try { voice?.pause(); } catch {}
    voice = new Audio(`../../../public/a/l/${line}.mp3`);
    music.volume = 0.14;
    const help = $("help");
    help.classList.add("talking");
    if (text) bubble(text);
    voice.onended = () => { help.classList.remove("talking"); music.volume = 0.32; };
    voice.play().catch(() => help.classList.remove("talking"));
  }
  let bubbleT = 0;
  function bubble(text) {
    document.querySelector(".bubble")?.remove();
    world.insertAdjacentHTML("beforeend", `<div class="bubble">${text}</div>`);
    clearTimeout(bubbleT);
    bubbleT = setTimeout(() => document.querySelector(".bubble")?.remove(), 3200);
  }
  function kiai() {
    const p = players[active];
    const hero = p?.hero ?? "kai";
    if (unlocked) new Audio(`../../../public/a/fx/kiai_${hero}_${1 + Math.floor(Math.random() * 3)}.mp3`).play().catch(() => {});
  }
  function greet(switched) {
    const p = players[active];
    if (!unlocked) return;
    if (p) say("tv_welcome_back", `Welcome back, ${esc(p.name)}!`);
    else if (!switched) say("tap_start", "Tap to start!");
  }

  // ------------------------------------------------------------ START: the whole scene starts (as today), controls excepted
  let going = false;
  const gong = $("gong");
  async function start() {
    if (going) return; // one start per tap: the old double start (button + scene) can't happen
    going = true;
    unlock();
    clearTimeout(idleT);
    gong.classList.add("pressed");
    const front = document.querySelector(".ninja-wrap.front");
    front?.classList.add("lunge");
    kiai();
    await wait(110);
    gong.classList.remove("pressed");
    gong.classList.add("struck");
    sfx("gong");
    world.classList.add("shake");
    const cx = 698 + 170, cy = 300 + 140;
    world.insertAdjacentHTML("beforeend", `<div class="shock" style="left:${cx}px;top:${cy}px"></div>`);
    for (let i = 0; i < 26; i++) {
      const a = (i / 26) * Math.PI * 2 + Math.random() * 0.2, d = 260 + Math.random() * 260;
      world.insertAdjacentHTML("beforeend", `<i class="burst" style="left:${cx}px;top:${cy}px;--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d - 60}px;--r:${Math.random() * 720 - 360}deg">${petal(COLS[i % COLS.length])}</i>`);
    }
    sfx("sparkle");
    await wait(360);
    document.querySelectorAll(".ninja-wrap").forEach((w) => {
      w.classList.remove("lunge");
      w.classList.add("leap");
      const im = w.querySelector("img");
      im.src = img(w.dataset.hero, "jump");
    });
    sfx("whoosh");
    await wait(420);
    world.insertAdjacentHTML("beforeend", `<div class="wipe" style="left:${cx}px;top:${cy}px"></div>`);
    await wait(760);
    showNext(players.length ? "map" : "new");
  }
  const SLOW = +params.get("slow") || 1;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms * SLOW));
  gong.addEventListener("pointerdown", (e) => { e.stopPropagation(); e.preventDefault(); start(); });
  world.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".gear, .help-btn, .players, .next, .sheet")) return;
    e.preventDefault();
    start();
  });

  function showNext(kind) {
    going = true;
    const p = players[active];
    const text = kind === "new" ? `What's your name?<small>(next: the name screen, then the film and Choose)</small>`
      : `${esc(p.name)}'s adventure<small>(next: the map, where ${esc(p.name)} left off: one tap from the title)</small>`;
    world.insertAdjacentHTML("beforeend", `<div class="next"><div class="card">${text}<br><button id="again">↺ Back to the title</button></div></div>`);
    $("again").addEventListener("pointerdown", (e) => { e.stopPropagation(); reset(); });
  }
  function reset() {
    going = false;
    world.querySelectorAll(".next, .wipe, .shock, .burst, .bubble, .puff").forEach((n) => n.remove());
    gong.classList.remove("pressed", "struck");
    world.classList.remove("shake");
    renderHeroes(); renderPlayers();
    armIdle();
  }
  function puffAt(x, y, flat) {
    world.insertAdjacentHTML("beforeend", `<div class="puff" style="left:${x}px;top:${y}px;${flat ? "height:120px;margin-top:-60px;z-index:1" : ""}"></div>`);
    setTimeout(() => world.querySelector(".puff")?.remove(), 600);
  }

  // ------------------------------------------------------------ idle: after 8 s, the ninja nudges and Sensei says "Tap to start!" (timers, no rAF)
  let idleT = 0;
  function armIdle() {
    clearTimeout(idleT);
    idleT = setTimeout(() => { if (!going) { say("tap_start", "Tap to start!"); kiai(); armIdle(); } }, 12000);
  }
  addEventListener("pointerdown", armIdle, true);

  // ------------------------------------------------------------ Help
  $("help").addEventListener("pointerdown", (e) => { e.stopPropagation(); unlock(); say("help_start", "Tap the big green button to start!"); });

  // ------------------------------------------------------------ grown-ups: press and hold the gear for 2 s
  const gear = $("gear");
  let holdT = 0;
  gear.addEventListener("pointerdown", (e) => {
    e.stopPropagation(); e.preventDefault();
    gear.classList.add("holding");
    holdT = setTimeout(() => {
      gear.classList.remove("holding");
      world.insertAdjacentHTML("beforeend", `<div class="sheet"><h2>Grown-ups</h2>Players: ${players.map((p) => esc(p.name)).join(", ") || "none yet"}<br>Music volume · Captions · School year<br><small style="font-size:22px;color:#6e5341">(a stand-in for the grown-ups page)</small><button id="closesheet">Done</button></div>`);
      $("closesheet").addEventListener("pointerdown", (ev) => { ev.stopPropagation(); world.querySelector(".sheet")?.remove(); });
    }, 2000);
  });
  const release = () => {
    if (!gear.classList.contains("holding")) return;
    gear.classList.remove("holding");
    clearTimeout(holdT);
    gear.querySelector(".hint")?.remove();
    gear.insertAdjacentHTML("beforeend", `<span class="hint">Grown-ups: press and hold</span>`);
    setTimeout(() => gear.querySelector(".hint")?.remove(), 1800);
  };
  gear.addEventListener("pointerup", release);
  gear.addEventListener("pointerleave", release);
  gear.addEventListener("pointercancel", release);

  // ------------------------------------------------------------ demo strip
  const demo = $("demo");
  if (params.get("ui") === "0") demo.style.display = "none";
  const tabs = [["first", "First launch"], ["returning", "Returning (Maya)"], ["many", "4 players"], ["lots", "7 players"]];
  demo.innerHTML = tabs.map(([k, l]) => `<button data-s="${k}" class="${k === stateName ? "on" : ""}">${l}</button>`).join("") + `<button data-sound="1">Sound on</button>`;
  demo.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.sound) { unlock(); b.classList.add("on"); return; }
    stateName = b.dataset.s; players = STATES[stateName]; active = 0;
    demo.querySelectorAll("[data-s]").forEach((x) => x.classList.toggle("on", x.dataset.s === stateName));
    reset();
    greet(false);
  });

  renderHeroes();
  renderPlayers();
  armIdle();
  // warm the next poses once the title has painted (the old boot fetched all 32 poses before the painting)
  addEventListener("load", () => setTimeout(() => ["kai", "suki"].forEach((h) => ["jump"].forEach((p) => { const i = new Image(); i.src = img(h, p); })), 600));
})();
</script>
</body>
</html>
