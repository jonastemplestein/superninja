<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Super Ninja title: hero poster</title>
<!-- Designer 1, "hero-poster": the marketing hero reborn as the game's title (docs/title-design/audit.md is the brief's
     audit). A working mockup at the game's 1280x720 stage, scaled like src/ui/ui.tsx Stage, with the painting bleeding to
     every edge of the phone outside it.
     States: ?state=first (no players yet) | back (one child: Maya) | many (four) | lots (seven: the "..." coin).
     Forced for screenshots: ?hover=1, ?press=1, ?paw=1 (the 8 s idle paw now). ?sound=1 behaves as if audio were already
     unlocked (a browser tab after Get ready, or Home). ?dev=1 shows a state switcher.
     Assets: the site's own hero-wide.webp (cached from the site on the path site -> Play now) and, made here by make/*:
     logo.webp + logo-fill.webp (the lockup and its glint mask), play-word.webp, patch-*.webp (the painting's own pixels
     that breathe), mist.webp. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- the painting is the marketing site's own hero, so on the path site -> Play now it is already in the HTTP cache -->
<link rel="preload" as="image" href="../../../public/media/landing/hero-wide.webp" fetchpriority="high" />
<link rel="preload" as="image" href="logo.webp" fetchpriority="high" />
<link rel="preload" as="image" href="play-word.webp" fetchpriority="high" />
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;600;700;800&family=Luckiest+Guy&display=block" rel="stylesheet" />
<style>
:root {
  --ink: #2b1d14; --paper: #fff4dc; --gold: #ffc53d; --gold-deep: #c98a00; --good: #3fbf6a; --good-deep: #1f7a41;
  --font-display: "Luckiest Guy", "Baloo 2", system-ui, sans-serif; --font-ui: "Baloo 2", "Andika", system-ui, sans-serif;
  --font-letters: "Andika", system-ui, sans-serif;
  --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom); --sal: env(safe-area-inset-left); --sar: env(safe-area-inset-right);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: #f6e6d2; font-family: var(--font-ui); color: var(--ink); user-select: none; -webkit-user-select: none; touch-action: manipulation; overscroll-behavior: none; }
img { -webkit-user-drag: none; user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }

/* ---------- the frame: the game's .viewport, but the title paints edge to edge (no plum bars) */
.viewport { position: fixed; inset: 0; overflow: hidden; background: #f3e3cf; }
/* both the art and the stage use the stage's coordinates (1280 x 720, scaled from the top-left); the art is not clipped
   to the stage, so it bleeds to every edge of the phone */
.tp-world, .stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; transform: translate(var(--x0), var(--y0)) scale(var(--s)); }
.stage { overflow: hidden; contain: layout paint; touch-action: none; }
.scene { position: absolute; inset: 0; }

/* ---------- the painting (stage px): the marketing hero at the phone's full height, its left edge at stage x --L. Left of
   it, the same image mirrored: the sky and misty hills reflect seamlessly, so no new file is needed for the bleed */
.tp-cam { position: absolute; inset: 0; transform-origin: var(--fx) var(--fy); animation: tp-cam 26s ease-in-out infinite alternate; }
@keyframes tp-cam { from { transform: none; } to { transform: translate(-8px, 4px) scale(1.035); } }
.tp-artbox { position: absolute; left: var(--L); top: var(--T); width: var(--Wa); height: var(--Ha); }
.tp-artbox > img.tp-art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tp-mirror { position: absolute; right: 100%; top: 0; width: var(--Wm); height: 100%; overflow: hidden; }
.tp-mirror img { position: absolute; right: 0; top: 0; width: var(--Wa); height: 100%; transform: scaleX(-1); }
/* a touch more colour than the site's page: the same painting, as a game (the patches get the same filter so they match) */
.tp-art, .tp-mirror img, .tp-patch { filter: saturate(1.12) contrast(1.02); }
/* morning mist sliding along the foot of the painting, in front of the hills and roots and behind the words (one tile's
   width per 70 s, so the loop has no seam; not inside the camera, so it slides against the camera's drift) */
.tp-mist { position: absolute; left: calc(var(--vwL) - 20px); top: calc(var(--T) + var(--Ha) - 190px); width: 3200px; height: 200px; pointer-events: none;
  background: url(mist.webp) 0 0 / 1600px 200px repeat-x; opacity: 0.85; animation: tp-mist 70s linear infinite; transition: opacity 0.4s; }
@keyframes tp-mist { to { transform: translateX(-1600px); } }
.viewport.going .tp-mist { opacity: 0; }
/* art-space helpers: positions are the painting's own pixels (2400 x 1340) */
.ap { position: absolute; left: calc(var(--ax) / 2400 * 100%); top: calc(var(--ay) / 1340 * 100%); width: calc(var(--aw) / 2400 * 100%); height: calc(var(--ah) / 1340 * 100%); }
/* the breathing patches: the painting's own pixels with a soft edge, moved a few px on the compositor */
.tp-patch { display: block; will-change: transform; }
.tp-heroes { --ax: 927; --ay: 515; --aw: 629; --ah: 620; animation: tp-hover 3.1s ease-in-out infinite; }
@keyframes tp-hover { 0%, 100% { transform: translateY(1px) rotate(0deg); } 50% { transform: translateY(-7px) rotate(-0.8deg); } }
.tp-baron { --ax: 1785; --ay: 0; --aw: 615; --ah: 644; transform-origin: 62% 40%; animation: tp-baron 5.6s ease-in-out infinite; }
@keyframes tp-baron { 0%, 100% { transform: none; } 45% { transform: translate(-3px, 5px) scale(1.03) rotate(-0.8deg); } 60% { transform: translate(-2px, 4px) scale(1.035) rotate(0.4deg); } }
.tp-sensei { --ax: 1979; --ay: 800; --aw: 421; --ah: 481; transform-origin: 50% 88%; animation: tp-breath 2.4s ease-in-out infinite; }
@keyframes tp-breath { 0%, 100% { transform: none; } 50% { transform: scale(1.012, 1.03); } }
/* the World Flower shines: a halo ring that breathes and slow rays turning behind it (both are HTML layers whose
   opacity or rotation change: compositor only) */
.tp-rays { --ax: 870; --ay: -205; --aw: 1500; --ah: 1500; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(255, 249, 222, 0) 0deg 8deg, rgba(255, 249, 222, 0.55) 11deg 14deg, rgba(255, 249, 222, 0) 17deg 22.5deg);
  -webkit-mask: radial-gradient(closest-side, transparent 38%, #000 44%, rgba(0,0,0,.6) 70%, transparent 100%); mask: radial-gradient(closest-side, transparent 38%, #000 44%, rgba(0,0,0,.6) 70%, transparent 100%);
  animation: tp-spin 90s linear infinite; opacity: 0.8; }
@keyframes tp-spin { to { transform: rotate(360deg); } }
.tp-halo-ring { --ax: 1270; --ay: 195; --aw: 700; --ah: 700; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 250, 230, 0) 72%, rgba(255, 246, 205, 0.85) 82%, rgba(255, 236, 160, 0.4) 88%, rgba(255, 236, 160, 0) 100%);
  animation: tp-glow 3.2s ease-in-out infinite alternate; }
.tp-core { --ax: 1500; --ay: 425; --aw: 240; --ah: 240; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 235, 0.95), rgba(255, 230, 120, 0.5) 45%, rgba(255, 220, 90, 0) 100%);
  animation: tp-glow 1.9s ease-in-out infinite alternate; }
@keyframes tp-glow { from { opacity: 0.25; } to { opacity: 1; } }
/* Baron's storm flickers */
.tp-bolt { --ax: 1780; --ay: -60; --aw: 700; --ah: 700; border-radius: 50%; background: radial-gradient(closest-side, rgba(245, 232, 255, 0.85), rgba(190, 150, 255, 0.45) 40%, rgba(160, 120, 255, 0) 100%);
  opacity: 0; animation: tp-flash 6.4s linear infinite 1.2s; }
@keyframes tp-flash { 0%, 58% { opacity: 0; } 59% { opacity: 0.8; } 61% { opacity: 0.1; } 63% { opacity: 0.6; } 68%, 100% { opacity: 0; } }
/* twinkles round the flower */
.tp-tw { width: calc(56 / 2400 * 100%); height: auto; aspect-ratio: 1; left: calc(var(--ax) / 2400 * 100%); top: calc(var(--ay) / 1340 * 100%); position: absolute;
  background: var(--star) center / contain no-repeat; opacity: 0; animation: tp-twinkle 2.8s ease-in-out infinite; }
@keyframes tp-twinkle { 0%, 100% { opacity: 0; transform: scale(0.2) rotate(0deg); } 40% { opacity: 1; transform: scale(1) rotate(45deg); } 70% { opacity: 0; transform: scale(0.4) rotate(90deg); } }

/* the calm behind the words: a soft cream glow, like the site's behind its copy */
.tp-calm { position: absolute; left: -380px; top: -120px; width: 1100px; height: 960px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255, 250, 236, 0.55), rgba(255, 248, 232, 0.3) 55%, rgba(255, 248, 232, 0) 100%); }

/* drifting World Flower petals (the painting's saturated teardrops, not opal bubbles): behind the words, across the
   whole bleed, down and to the left like the site's */
.pt { position: absolute; width: 30px; height: 38px; background: var(--petal) center / contain no-repeat; opacity: 0; will-change: transform; }
.pt.s { width: 20px; height: 26px; }
.pt.l { width: 44px; height: 56px; }
.pt.a { animation: tp-drift-a var(--d) linear var(--dl) infinite; }
.pt.b { animation: tp-drift-b var(--d) linear var(--dl) infinite; }
@keyframes tp-drift-a {
  0% { transform: translate(0, 0) rotate(0deg); opacity: 0; } 6% { opacity: 1; }
  30% { transform: translate(-190px, 230px) rotate(110deg); } 55% { transform: translate(-460px, 380px) rotate(190deg); }
  80% { transform: translate(-640px, 610px) rotate(290deg); } 93% { opacity: 1; } 100% { transform: translate(-880px, 760px) rotate(380deg); opacity: 0; } }
@keyframes tp-drift-b {
  0% { transform: translate(0, 0) rotate(20deg); opacity: 0; } 6% { opacity: 1; }
  25% { transform: translate(-260px, 150px) rotate(-60deg); } 50% { transform: translate(-420px, 380px) rotate(-150deg); }
  75% { transform: translate(-700px, 520px) rotate(-230deg); } 93% { opacity: 1; } 100% { transform: translate(-860px, 800px) rotate(-320deg); opacity: 0; } }

/* ---------- the lockup (stage px): the logo, then Play, in the calm sky on the left */
.tp-logo { position: absolute; left: 22px; top: 8px; width: 548px; aspect-ratio: 1222 / 761; transform-origin: 50% 60%; animation: tp-logo-in 0.7s cubic-bezier(0.3, 1.5, 0.5, 1) 0.1s both; }
.tp-logo-in { position: absolute; inset: 0; animation: tp-logo-breathe 4.2s ease-in-out 1s infinite; }
.tp-logo-in > img { display: block; width: 100%; height: 100%; }
@keyframes tp-logo-breathe { 0%, 100% { transform: none; } 50% { transform: scale(1.014) rotate(-0.4deg); } }
@keyframes tp-logo-in { from { transform: translateY(-70px) scale(0.86) rotate(3deg); opacity: 0; } 40% { opacity: 1; } to { transform: none; opacity: 1; } }
/* the glint: a bright band crossing the letters every few seconds. Its parent is masked by the letters' own shape
   (logo-fill.webp), and only the band moves */
.tp-glint { position: absolute; inset: 0; -webkit-mask: url(logo-fill.webp) center / 100% 100% no-repeat; mask: url(logo-fill.webp) center / 100% 100% no-repeat; overflow: hidden; pointer-events: none; }
.tp-glint i { position: absolute; top: -20%; left: 0; width: 26%; height: 140%; background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.15) 30%, rgba(255,255,255,0.95) 50%, rgba(255,255,255,0.15) 70%, rgba(255,255,255,0) 100%);
  transform: translateX(-120%) skewX(-18deg); animation: tp-glint 4.2s cubic-bezier(0.45, 0, 0.3, 1) 1.1s infinite; }
@keyframes tp-glint { 0% { transform: translateX(-120%) skewX(-18deg); } 26%, 100% { transform: translateX(420%) skewX(-18deg); } }
.tp-spark { position: absolute; width: 58px; height: 58px; left: 468px; top: 14px; background: var(--star) center / contain no-repeat; opacity: 0; animation: tp-twinkle 4.2s ease-in-out 1.7s infinite; }

/* ---------- PLAY: the site's .btn-go, made huge and chunky: a glossy green pill, thick ink line, a hard ink drop, a
   cream disc with the play arrow, and the word. It breathes, a glint crosses it, a gold ring ripples out of it */
.tp-go { position: absolute; left: 36px; top: 450px; width: 548px; height: 228px; animation: tp-go-in 0.55s cubic-bezier(0.3, 1.7, 0.55, 1) 0.4s both; }
@keyframes tp-go-in { from { transform: scale(0.55) translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.tp-glow { position: absolute; left: -150px; right: -150px; top: -120px; bottom: -120px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255, 246, 206, 0.9), rgba(255, 238, 180, 0.5) 50%, rgba(255, 232, 160, 0.14) 78%, rgba(255, 226, 140, 0) 100%);
  animation: tp-glow 1.6s ease-in-out infinite alternate; }
.tp-ripple { position: absolute; inset: 0; border-radius: 120px; border: 10px solid rgba(255, 214, 90, 0.95); pointer-events: none; opacity: 0; animation: tp-ripple 1.6s ease-out 1s infinite; }
@keyframes tp-ripple { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.16, 1.34); opacity: 0; } }
.tp-play { position: absolute; inset: 0; border-radius: 120px; border: 10px solid var(--ink); overflow: hidden; isolation: isolate;
  display: flex; align-items: center; gap: 26px; padding: 0 44px 0 24px;
  background: linear-gradient(180deg, #a5f2ad 0%, #66d47a 22%, #45b95e 52%, #2c9a4b 80%, #1e7f3f 100%);
  box-shadow: 0 16px 0 var(--ink), 0 36px 40px -10px rgba(43, 29, 20, 0.5), inset 0 -16px 0 rgba(15, 70, 30, 0.35);
  scale: 1; translate: 0 0; animation: tp-breathe 1.6s ease-in-out infinite; transition: translate 0.12s, box-shadow 0.12s; }
@keyframes tp-breathe { 0%, 100% { scale: 1; } 50% { scale: 1.045; } }
/* the gloss: a pale band along the top */
.tp-play::before { content: ""; position: absolute; left: 34px; right: 34px; top: 12px; height: 34%; border-radius: 80px; background: linear-gradient(rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.05)); z-index: -1; }
/* the press/hover light */
.tp-play::after { content: ""; position: absolute; inset: 0; background: #fff; opacity: 0; transition: opacity 0.12s; pointer-events: none; }
.tp-shine { position: absolute; top: -10%; left: 0; width: 22%; height: 120%; background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,0.75) 50%, rgba(255,255,255,0)); transform: translateX(-140%) skewX(-20deg); animation: tp-shine 3.2s ease-in-out 1.6s infinite; z-index: 0; pointer-events: none; }
@keyframes tp-shine { 0% { transform: translateX(-140%) skewX(-20deg); } 30%, 100% { transform: translateX(560%) skewX(-20deg); } }
.tp-disc { position: relative; z-index: 1; overflow: visible; flex: none; width: 164px; height: 164px; border-radius: 50%; border: 9px solid var(--ink); display: grid; place-items: center;
  background: radial-gradient(circle at 36% 28%, #ffffff 0 22%, #fff6de 55%, #f1d9a4 100%); box-shadow: 0 8px 0 rgba(20, 60, 30, 0.55); }
.tp-disc svg { width: 104px; height: 104px; margin-left: 16px; animation: tp-nudge 1.6s ease-in-out infinite; }
@keyframes tp-nudge { 0%, 100% { transform: none; } 50% { transform: translateX(6px); } }
/* the word is pre-rendered (make/logo.ts), so Play is whole at first paint, before Luckiest Guy arrives */
.tp-word { position: relative; z-index: 1; display: block; width: 318px; height: 117.5px; margin-top: 8px; }
/* hover (a mouse or an iPad pointer): it lifts and brightens */
@media (hover: hover) { .tp-play:hover { translate: 0 -6px; box-shadow: 0 22px 0 var(--ink), 0 44px 44px -10px rgba(43, 29, 20, 0.5), inset 0 -16px 0 rgba(15, 70, 30, 0.35); } .tp-play:hover::after { opacity: 0.14; } }
.tp-play.hover { translate: 0 -6px; box-shadow: 0 22px 0 var(--ink), 0 44px 44px -10px rgba(43, 29, 20, 0.5), inset 0 -16px 0 rgba(15, 70, 30, 0.35); }
.tp-play.hover::after { opacity: 0.14; }
/* press: it goes down onto its shadow and flashes */
.tp-play.pressed, .tp-play:active { translate: 0 13px; animation-play-state: paused; box-shadow: 0 3px 0 var(--ink), 0 10px 16px -8px rgba(43, 29, 20, 0.5), inset 0 -10px 0 rgba(15, 70, 30, 0.35); }
.tp-play.pressed::after, .tp-play:active::after { opacity: 0.35; transition: none; }
/* idle for 8 s: the game's pointing paw taps Play (any tap starts the 8 s again) */
/* (the wrapper fades, the hand inside taps: one property each, so both stay on the compositor) */
.tp-paw { position: absolute; left: 400px; top: 118px; width: 130px; height: 130px; pointer-events: none; opacity: 0; z-index: 3; animation: tp-fade-in 0.35s ease-out 8s forwards; }
.tp-paw svg { display: block; animation: taphint 1.4s ease-in-out 8s infinite; }
@keyframes taphint { 0%, 100% { transform: translate(0, 0) scale(1); } 45% { transform: translate(-10px, -18px) scale(1.05); } 60% { transform: translate(0, 0) scale(0.92); } }
.paw-now .tp-paw, .paw-now .tp-paw svg { animation-delay: 0s; }

/* the flower's messenger: every 9 s a golden petal leaves the World Flower's heart, arcs over the sky and lands in Play's
   disc, which flashes (the same 9 s clock and start, so they stay in step). --cdx/--cdy: flower to disc, set by fit() */
.tp-comet { position: absolute; left: var(--cx); top: var(--cy); width: 0; height: 0; z-index: 8; pointer-events: none; }
/* (armed only once fit() has set --cdx/--cdy: a composited animation keeps the keyframe values it started with, so it must
   not start before the custom properties it uses exist; fit() re-arms it on a resize) */
.tp-comet i { position: absolute; left: -36px; top: -44px; width: 72px; height: 88px; background: var(--petal-gold) center / contain no-repeat; opacity: 0; }
.tp-comet i + i { width: 30px; height: 30px; left: -15px; top: -15px; background-image: var(--star); }
.tp-comet i + i + i { width: 22px; height: 22px; left: -11px; top: -11px; }
.armed .tp-comet i { animation: tp-comet 9s cubic-bezier(0.4, 0, 0.6, 1) 2.4s infinite; }
.armed .tp-comet i + i { animation-delay: 2.5s; }
.armed .tp-comet i + i + i { animation-delay: 2.6s; }
@keyframes tp-comet {
  0% { transform: translate(0, 0) scale(0.3) rotate(0deg); opacity: 0; }
  3% { transform: translate(calc(var(--cdx) * 0.04), -40px) scale(1.1) rotate(-40deg); opacity: 1; }
  12% { transform: translate(calc(var(--cdx) * 0.3), calc(var(--cdy) * 0.02 - 110px)) scale(1) rotate(-160deg); }
  20% { transform: translate(calc(var(--cdx) * 0.6), calc(var(--cdy) * 0.2 - 90px)) scale(0.95) rotate(-280deg); }
  27% { transform: translate(calc(var(--cdx) * 0.88), calc(var(--cdy) * 0.62)) scale(0.8) rotate(-380deg); opacity: 1; }
  30% { transform: translate(var(--cdx), var(--cdy)) scale(0.5) rotate(-420deg); opacity: 1; }
  31.5%, 100% { transform: translate(var(--cdx), var(--cdy)) scale(1.6) rotate(-420deg); opacity: 0; } }
.tp-disc::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 12px solid #ffe07a; opacity: 0; pointer-events: none; }
.armed .tp-disc::after { animation: tp-catch 9s ease-out 2.4s infinite; }
@keyframes tp-catch { 0%, 29.5% { opacity: 0; transform: scale(0.8); } 30.5% { opacity: 1; transform: scale(1); } 38%, 100% { opacity: 0; transform: scale(1.7); } }

/* ---------- who's playing, on the title: the child's face and name on a tag clipped to Play's top edge. With several
   children, the others' faces sit beside it; a tap on a face makes that child the one who plays */
.tp-who { position: absolute; left: 70px; top: 372px; height: 100px; display: flex; align-items: flex-end; gap: 14px; z-index: 6; animation: tp-who-in 0.5s cubic-bezier(0.3, 1.5, 0.5, 1) 0.75s both; }
@keyframes tp-who-in { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.tp-tag { display: flex; align-items: center; gap: 10px; height: 86px; padding: 0 26px 0 7px; border-radius: 50px; background: linear-gradient(#fffdf4, #f6e6c2); border: 6px solid var(--ink); box-shadow: 0 6px 0 var(--ink); }
.tp-tag b { font: 700 40px/1 var(--font-letters); color: var(--ink); padding-bottom: 2px; }
.tp-face { display: block; position: relative; flex: none; width: 66px; height: 66px; border-radius: 50%; border: 5px solid var(--ink); overflow: hidden; background-color: var(--bg, #dfe0ff); background-repeat: no-repeat; background-size: 190%; background-position: 76% 24%; }
.tp-face.kai { --bg: #cfd2ff; background-image: url(../../../public/a/i/hero_kai_idle.webp); }
.tp-face.suki { --bg: #bff0e2; background-image: url(../../../public/a/i/hero_suki_idle.webp); background-size: 150%; background-position: 82% 5%; }
.tp-face.initial { display: grid; place-items: center; font: 700 40px/1 var(--font-letters); color: var(--ink); }
.tp-other { position: relative; width: 84px; height: 84px; border-radius: 50%; margin-bottom: 1px; }
.tp-other .tp-face { width: 84px; height: 84px; border-width: 6px; box-shadow: 0 5px 0 var(--ink); }
.tp-other .ini { position: absolute; right: -6px; bottom: -6px; width: 38px; height: 38px; border-radius: 50%; border: 4px solid var(--ink); background: var(--c); font: 700 24px/30px var(--font-letters); text-align: center; color: var(--ink); }
.tp-other.more .tp-face { background: #fffdf4; display: grid; place-items: center; font: 800 40px/1 var(--font-ui); }
.hop { animation: tp-hop 0.5s cubic-bezier(0.3, 1.6, 0.5, 1); }
@keyframes tp-hop { 0% { transform: none; } 40% { transform: translateY(-22px) scale(1.08); } 100% { transform: none; } }

/* ---------- grown-ups: the gear, top-right, opens only on a 2 s hold (as on the map) */
.tp-gear { position: absolute; right: 22px; top: 20px; width: 92px; height: 92px; border-radius: 50%; z-index: 20; border: 5px solid var(--ink); box-shadow: 0 5px 0 var(--ink);
  background: radial-gradient(circle at 35% 30%, #fff 0%, #efe4cd 55%, #cdb88f 100%); display: grid; place-items: center; animation: tp-fade-in 0.4s ease-out 0.9s both; }
.tp-gear svg { width: 62%; height: 62%; position: relative; z-index: 1; }
.tp-gear .ring { position: absolute; inset: -12px; border-radius: 50%; background: conic-gradient(var(--gold) calc(var(--p, 0) * 1turn), transparent 0); -webkit-mask: radial-gradient(closest-side, transparent 78%, #000 80%); mask: radial-gradient(closest-side, transparent 78%, #000 80%); }
.hold-hint { position: absolute; right: 0; top: calc(100% + 14px); white-space: nowrap; font: 700 26px/1 var(--font-ui); color: var(--ink); background: #fffdf6; border: 4px solid var(--ink); border-radius: 18px; padding: 10px 16px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.tp-gear.hint .hold-hint { opacity: 1; }
@keyframes tp-fade-in { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Sensei's Help coin: bottom-right as on every screen. On the title its badge is not green, so the only
   green thing on the screen is Play */
.help-btn { position: absolute; right: 14px; bottom: 14px; z-index: 85; width: 124px; height: 124px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #fff8e6, #ffd98a 70%, #e0a53a); border: 6px solid var(--ink); box-shadow: 0 7px 0 var(--ink), 0 0 0 6px rgba(255, 244, 220, 0.8); animation: tp-fade-in 0.4s ease-out 0.9s both; }
.help-face { position: absolute; inset: 5px; width: calc(100% - 10px); height: calc(100% - 10px); border-radius: 50%; object-fit: cover; }
.help-q { position: absolute; left: -10px; top: -10px; width: 46px; height: 46px; border-radius: 50%; background: #5b6fe0; border: 5px solid var(--ink); color: #fff; font-family: var(--font-display); font-size: 30px; line-height: 40px; text-align: center; text-shadow: 0 2px 0 var(--ink); }
.help-btn.talking { animation: helptalk 0.5s ease-in-out infinite alternate; }
@keyframes helptalk { from { scale: 1; } to { scale: 1.07; } }
/* what Sensei says, as a caption beside her coin (the game shows it only with captions on) */
.tp-say { position: absolute; right: 158px; bottom: 44px; z-index: 86; max-width: 420px; padding: 14px 24px 16px; border-radius: 26px; background: #fffdf6; border: 5px solid var(--ink); box-shadow: 0 6px 0 var(--ink);
  font: 800 34px/1.1 var(--font-ui); color: var(--ink); opacity: 0; transform: translateX(20px) scale(0.9); transform-origin: 100% 60%; transition: opacity 0.25s, transform 0.35s cubic-bezier(0.3, 1.6, 0.5, 1); pointer-events: none; }
.tp-say::after { content: ""; position: absolute; right: -19px; bottom: 26px; width: 26px; height: 26px; background: inherit; border-right: 5px solid var(--ink); border-top: 5px solid var(--ink); transform: rotate(45deg); }
.tp-say.on { opacity: 1; transform: none; }

/* ---------- Start: the button goes down and flashes, a gong and Kai's shout, petals burst out of it, the heroes spring,
   the camera flies into the World Flower and the next screen blooms out of its light (never a cut to black) */
.tp-burst i { position: absolute; left: 0; top: 0; width: 46px; height: 58px; margin: -29px 0 0 -23px; background: var(--petal) center / contain no-repeat; opacity: 0; }
.going .tp-burst i { animation: tp-burst 1s cubic-bezier(0.15, 0.7, 0.3, 1) forwards; }
@keyframes tp-burst { 0% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(0.4); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--bx), var(--by)) rotate(var(--br)) scale(1.1); } }
.going .tp-cam { animation: tp-push 1.05s cubic-bezier(0.55, 0, 0.75, 0.35) 0.18s forwards; }
@keyframes tp-push { from { transform: none; } to { transform: scale(1.9); } }
.going .tp-heroes { animation: tp-spring 0.6s cubic-bezier(0.3, 1.4, 0.5, 1) forwards; }
@keyframes tp-spring { 0% { transform: none; } 30% { transform: translateY(6px) scale(1.02, 0.97); } 100% { transform: translateY(-12px); } }
.going .tp-logo { animation: tp-out-up 0.5s cubic-bezier(0.5, 0, 0.8, 0.4) 0.25s forwards; }
@keyframes tp-out-up { to { transform: translateY(-460px) rotate(-6deg); } }
.going .tp-go, .going .tp-who { animation: tp-out-down 0.5s cubic-bezier(0.5, 0, 0.8, 0.4) 0.32s forwards; }
@keyframes tp-out-down { to { transform: translateY(420px) scale(0.9); } }
.going .tp-play { animation: tp-launch 0.3s ease-out; }
@keyframes tp-launch { 0% { scale: 0.94; } 50% { scale: 1.1; } 100% { scale: 1; } }
.tp-bloom { position: absolute; inset: 0; z-index: 95; pointer-events: none; opacity: 0; background: radial-gradient(circle at var(--bloom-x, 82%) var(--bloom-y, 42%), #fffdf2 0%, #fff4d6 45%, #ffe7b8 100%); }
.viewport.going .tp-bloom { animation: tp-fade-in 0.55s ease-in 0.72s forwards; }
.tp-next { position: absolute; inset: 0; z-index: 96; display: grid; place-items: center; opacity: 0; pointer-events: none; }
.tp-next > div { text-align: center; font: 800 22px/1.2 var(--font-ui); color: var(--ink); }
.tp-next small { display: block; font: 600 14px/1.3 var(--font-ui); color: #6b5443; margin-top: 6px; }
.tp-next button { margin-top: 16px; font: 800 16px/1 var(--font-ui); padding: 12px 20px; border-radius: 999px; border: 3px solid var(--ink); background: #fffdf6; box-shadow: 0 3px 0 var(--ink); }
.viewport.going .tp-next { animation: tp-fade-in 0.4s ease-out 1.25s forwards; pointer-events: auto; }

/* the dev switcher (?dev=1): not part of the design */
.dev { position: fixed; left: 8px; bottom: 8px; z-index: 999; display: none; gap: 4px; font: 600 11px/1 system-ui; }
.dev button { background: rgba(255,255,255,.9); border: 1px solid #0004; border-radius: 6px; padding: 5px 7px; }
.dev.on { display: flex; }

@media (prefers-reduced-motion: reduce) {
  .tp-cam, .tp-rays, .pt, .tp-tw, .tp-bolt, .tp-heroes, .tp-baron, .tp-sensei { animation: none !important; }
  .pt { opacity: 0 !important; }
}
</style>
</head>
<body>
<div class="viewport" id="vp">
  <!-- the painting and everything that lives in it (behind the stage's words and buttons) -->
  <div class="tp-world" aria-hidden="true">
    <div class="tp-cam" id="cam">
      <div class="tp-artbox">
        <div class="tp-mirror"><img src="../../../public/media/landing/hero-wide.webp" alt="" decoding="async" /></div>
        <img class="tp-art" src="../../../public/media/landing/hero-wide.webp" alt="" fetchpriority="high" />
        <div class="ap tp-rays"></div>
        <div class="ap tp-halo-ring"></div>
        <img class="ap tp-patch tp-baron" src="patch-baron.webp" alt="" fetchpriority="low" />
        <div class="ap tp-bolt"></div>
        <div class="ap tp-core"></div>
        <img class="ap tp-patch tp-heroes" src="patch-heroes.webp" alt="" fetchpriority="low" />
        <img class="ap tp-patch tp-sensei" src="patch-sensei.webp" alt="" fetchpriority="low" />
        <i class="tp-tw" style="--ax: 1330; --ay: 250; animation-delay: -0.2s"></i>
        <i class="tp-tw" style="--ax: 1950; --ay: 560; animation-delay: -1.1s"></i>
        <i class="tp-tw" style="--ax: 1390; --ay: 760; animation-delay: -2s"></i>
        <i class="tp-tw" style="--ax: 1545; --ay: 150; animation-delay: -0.7s"></i>
        <i class="tp-tw" style="--ax: 1180; --ay: 420; animation-delay: -1.6s"></i>
      </div>
    </div>
    <div class="tp-mist"></div>
    <div class="tp-calm"></div>
    <div id="petals"></div>
  </div>

  <div class="stage" id="stage">
    <div class="scene title" id="scene">
      <div class="tp-logo" id="logo"><div class="tp-logo-in"><img src="logo.webp" alt="Super Ninja" /><div class="tp-glint"><i></i></div></div><i class="tp-spark"></i></div>
      <div class="tp-go" id="go">
        <div class="tp-glow"></div>
        <div class="tp-ripple"></div>
        <button class="tp-play" id="play" aria-label="Start">
          <i class="tp-shine"></i>
          <span class="tp-disc"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M20 10 L52 32 L20 54 Z" fill="#3fbf6a" stroke="#2b1d14" stroke-width="7" stroke-linejoin="round" /><path d="M25 19 L39 28" stroke="#c8f7d2" stroke-width="5" stroke-linecap="round" /></svg></span>
          <img class="tp-word" src="play-word.webp" alt="" />
        </button>
        <div class="tp-paw"><svg viewBox="0 0 64 64" width="130" height="130"><path d="M26 30V12a5 5 0 0 1 10 0v16l3-1a5 5 0 0 1 6 3l1 1a5 5 0 0 1 6 4v8c0 9-6 16-15 16h-3c-6 0-10-3-13-8l-7-11a4 4 0 0 1 6-5l6 6z" fill="#fff4dc" stroke="#2b1d14" stroke-width="4" stroke-linejoin="round" /></svg></div>
      </div>
      <div class="tp-who" id="who"></div>
      <div class="tp-comet" aria-hidden="true"><i></i><i></i><i></i></div>
      <button class="tp-gear" id="gear" aria-label="Grown-ups">
        <span class="ring"></span>
        <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="9" fill="none" stroke="#2b1d14" stroke-width="7" /><path d="M32 8v8M32 48v8M8 32h8M48 32h8M15 15l6 6M43 43l6 6M15 49l6-6M43 21l6-6" fill="none" stroke="#2b1d14" stroke-width="7" stroke-linecap="round" /></svg>
        <span class="hold-hint">Grown-ups: press and hold</span>
      </button>
      <button class="help-btn" id="help" aria-label="Help"><img class="help-face" src="../../../public/a/i/sensei_face_idle.webp" alt="" /><span class="help-q">?</span></button>
      <div class="tp-say" id="say"></div>
      <div class="tp-burst" id="burst"></div>
    </div>
  </div>
  <div class="tp-bloom"></div>
  <div class="tp-next" id="next"><div><span id="next-what"></span><small>(the next screen blooms out of the flower's light)</small><button id="again">Back to the title</button></div></div>
</div>
<div class="dev" id="dev"><button data-s="first">first launch</button><button data-s="back">returning</button><button data-s="many">several</button><button data-s="lots">7 players</button><button id="dev-paw">paw</button></div>
<audio id="music" src="../../../public/a/m/title.mp3" preload="none" loop></audio>

<script>
(() => {
  const W = 1280, H = 720, AW = 2400, AH = 1340;
  const q = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  const vp = $("vp"), scene = $("scene"), play = $("play");
  window.__snState = { scene: "title" };

  // ---------- fit: the game's Stage maths (src/ui/ui.tsx), plus where the painting goes
  function fit() {
    const cs = getComputedStyle(document.documentElement);
    const inset = (v) => parseFloat(cs.getPropertyValue(v)) || 0;
    const touch = matchMedia("(pointer: coarse)").matches;
    const top = Math.max(inset("--sat"), touch ? 10 : 0), bottom = Math.max(inset("--sab"), touch ? 26 : 0);
    const left = Math.max(inset("--sal"), touch ? 8 : 0), right = Math.max(inset("--sar"), touch ? 8 : 0);
    const vw = innerWidth, vh = innerHeight, aw = vw - left - right, ah = vh - top - bottom;
    const s = Math.min(aw / W, ah / H);
    const x0 = left + aw / 2 - (W * s) / 2, y0 = top + ah / 2 - (H * s) / 2;
    // the painting fills the phone's height; its left edge sits at stage x 86 (the calm sky left of it holds the logo
    // and Play), unless the phone is so wide that its right edge would show
    const Ha = vh / s, T = -y0 / s, Wa = (Ha * AW) / AH, vwL = -x0 / s, vwR = (vw - x0) / s;
    const L = Math.max(86, vwR + 16 - Wa);
    const Wm = Math.max(0, L - vwL + 40);
    const st = vp.style;
    st.setProperty("--s", s); st.setProperty("--x0", x0 + "px"); st.setProperty("--y0", y0 + "px");
    st.setProperty("--L", L + "px"); st.setProperty("--T", T + "px"); st.setProperty("--Wa", Wa + "px"); st.setProperty("--Ha", Ha + "px"); st.setProperty("--Wm", Wm + "px"); st.setProperty("--vwL", vwL + "px");
    // the camera turns about the World Flower's heart
    st.setProperty("--fx", L + (1620 / AW) * Wa + "px"); st.setProperty("--fy", T + (545 / AH) * Ha + "px");
    // the flower's messenger: from the halo's edge to the centre of Play's disc (tp-go 36,450 + padding 24 + border 10 + radius 82)
    const cx = L + (1370 / AW) * Wa, cy = T + (560 / AH) * Ha; // the halo's left edge, beside the green petal
    st.setProperty("--cx", cx + "px"); st.setProperty("--cy", cy + "px");
    st.setProperty("--cdx", 36 + 10 + 24 + 82 - cx + "px"); st.setProperty("--cdy", 450 + 114 - cy + "px");
    window.__fit = { s, x0, y0, L, T, Wa, Ha, vwL, vwR };
  }
  fit();
  // arm the flower's messenger now that its custom properties exist (and again after a resize)
  const arm = () => { scene.classList.remove("armed"); void scene.offsetWidth; scene.classList.add("armed"); };
  arm();
  addEventListener("resize", () => { fit(); arm(); });

  // ---------- petals: glassy teardrops in the phonics chart's colours (drawn once, as images; only transforms move)
  const COLS = [["#e8312f", "#a81d1b"], ["#f5821f", "#b8540a"], ["#f3c74a", "#c38f10"], ["#2fa65a", "#17693a"], ["#2ec4b6", "#16857a"], ["#4a7dff", "#2748b8"], ["#8a3be0", "#5a1f9e"], ["#f0226b", "#a3104a"]];
  const petalSvg = (c, d) => `<svg xmlns='http://www.w3.org/2000/svg' viewBox='-26 -32 52 64'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#fff'/><stop offset='.42' stop-color='${c}'/><stop offset='1' stop-color='${d}'/></linearGradient><filter id='b' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3'/></filter></defs><path d='M0,27 C-3,16 -15,6 -15,-9 A15,15 0 0 1 15,-9 C15,6 3,16 0,27Z' fill='${c}' opacity='.55' filter='url(#b)'/><g><path d='M0,26 C-3,16 -14,6 -14,-8 A14,14 0 0 1 14,-8 C14,6 3,16 0,26Z' fill='url(#g)' stroke='#2b1d14' stroke-opacity='.7' stroke-width='2.2'/><ellipse cx='-5' cy='-11' rx='3.6' ry='6' fill='#fff' opacity='.8' transform='rotate(24 -5 -11)'/></g></svg>`;
  const uri = (svg) => `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  const star = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='-20 -20 40 40'><defs><radialGradient id='r'><stop offset='0' stop-color='#fff'/><stop offset='.5' stop-color='#fff6c8'/><stop offset='1' stop-color='#ffd55a' stop-opacity='0'/></radialGradient></defs><circle r='9' fill='url(#r)'/><path d='M0,-19 C1.5,-4 4,-1.5 19,0 C4,1.5 1.5,4 0,19 C-1.5,4 -4,1.5 -19,0 C-4,-1.5 -1.5,-4 0,-19Z' fill='#fffbe8'/></svg>`;
  const css = [`:root{--star:${uri(star)}}`];
  css.push(`:root{--petal-gold:${uri(petalSvg('#ffd84a', '#e08a00').replace("opacity='.55'", "opacity='.9'"))}}`);
  COLS.forEach(([c, d], i) => css.push(`.c${i}{--petal:${uri(petalSvg(c, d))}}`));
  const style = document.createElement("style");
  style.textContent = css.join("\n");
  document.head.appendChild(style);

  // the drifting petals, in stage px (they start round the flower and the top edge and drift down-left across the sky)
  const DRIFT = [
    [760, -40, "s", "a", 17, -3], [980, 60, "", "b", 15, -9], [1180, -30, "l", "a", 13, -1], [1360, 120, "s", "b", 19, -12],
    [880, 240, "", "a", 16, -6], [1240, 300, "s", "a", 18, -15], [620, -60, "", "b", 14, -11], [1480, -20, "l", "b", 16, -4],
    [1080, 160, "s", "b", 20, -17], [1400, 360, "", "a", 17, -8],
  ];
  const petals = $("petals");
  DRIFT.forEach(([x, y, size, path, d, dl], i) => {
    const p = document.createElement("i");
    p.className = `pt ${size} ${path} c${i % 8}`;
    p.style.cssText = `left:${x}px;top:${y}px;--d:${d}s;--dl:${dl}s`;
    petals.appendChild(p);
  });
  // ---------- players (seeded like the audit: Maya, Leo, Ava, Theo, Isabella)
  const NAME_COLOURS = ["#ffc53d", "#8fd16a", "#6cc6f0", "#ff9ec0", "#b99cff", "#ffa46b"];
  const colourOf = (n) => NAME_COLOURS[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % NAME_COLOURS.length];
  const PLAYERS = {
    first: [],
    back: [{ name: "Maya", hero: "suki" }],
    many: [{ name: "Maya", hero: "suki" }, { name: "Leo", hero: "kai" }, { name: "Ava", hero: null }, { name: "Theo", hero: "kai" }],
    lots: [{ name: "Maya", hero: "suki" }, { name: "Leo", hero: "kai" }, { name: "Ava", hero: null }, { name: "Theo", hero: "kai" }, { name: "Isabella", hero: "suki" }, { name: "Sam", hero: "kai" }, { name: "Zara", hero: null }],
  };
  let state = PLAYERS[q.get("state")] ? q.get("state") : "first";
  let players = PLAYERS[state].slice();
  const faceHtml = (p, cls = "") => p.hero ? `<span class="tp-face ${p.hero} ${cls}"></span>` : `<span class="tp-face initial ${cls}" style="--bg:${colourOf(p.name)}">${[...p.name][0]}</span>`;
  function renderWho() {
    const who = $("who");
    who.innerHTML = "";
    if (!players.length) return;
    const [me, ...others] = players;
    const tag = document.createElement("button");
    tag.className = "tp-tag";
    tag.setAttribute("aria-label", `Playing: ${me.name}. Tap to change who's playing`);
    tag.innerHTML = `${faceHtml(me)}<b>${me.name}</b>`;
    stopTap(tag, () => note("Opens Who's playing? (switch child, or add one)"));
    who.appendChild(tag);
    // up to four other children beside the tag; more than that and the fourth is "..." (the full list: no child is lost)
    const shown = others.length > 4 ? others.slice(0, 3) : others;
    shown.forEach((p) => {
      const b = document.createElement("button");
      b.className = "tp-other";
      b.setAttribute("aria-label", p.name);
      b.innerHTML = `${faceHtml(p)}<span class="ini" style="--c:${colourOf(p.name)}">${[...p.name][0]}</span>`;
      if (!p.hero) b.querySelector(".ini").remove();
      stopTap(b, () => pick(p));
      who.appendChild(b);
    });
    if (others.length > 4) {
      const b = document.createElement("button");
      b.className = "tp-other more";
      b.setAttribute("aria-label", "Everyone");
      b.innerHTML = `<span class="tp-face">&middot;&middot;&middot;</span>`;
      stopTap(b, () => note("Opens Who's playing? with every child"));
      who.appendChild(b);
    }
  }
  function pick(p) {
    // the picked child takes the tag and the one who had it takes their place: nobody else moves (the audit's "cards keep
    // their order while the screen is open"); the choice is saved only as the game leaves the title
    const i = players.indexOf(p);
    players = players.slice();
    [players[0], players[i]] = [players[i], players[0]];
    renderWho();
    const tag = document.querySelector(".tp-tag");
    tag.classList.add("hop");
    say(null, `${p.name}!`, 1400);
  }
  renderWho();

  // ---------- sound: the first tap unlocks it (the game's unlockAudio). Music streams through <audio>, never decoded
  const music = $("music");
  let unlocked = q.has("sound");
  const L = (n) => `../../../public/a/l/${n}.mp3`;
  let voice = null;
  function say(line, text, ms = 2600) {
    const help = $("help"), bubble = $("say");
    bubble.textContent = text;
    bubble.classList.add("on");
    help.classList.add("talking");
    if (line && unlocked) { try { voice?.pause(); voice = new Audio(L(line)); voice.play().catch(() => {}); } catch {} }
    clearTimeout(say.t);
    say.t = setTimeout(() => { bubble.classList.remove("on"); help.classList.remove("talking"); }, ms);
  }
  function unlock() {
    if (unlocked) return;
    unlocked = true;
    music.volume = 0.35;
    music.play().catch(() => {});
  }
  // on a title reached with sound already on (a browser tab after Get ready, or Home), Sensei greets the child
  function greet() {
    if (players.length) say("tv_welcome_back", `Welcome back, ${players[0].name}!`, 3000);
    else if (unlocked) say("tap_start", "Tap to start!", 1800);
  }
  if (unlocked) { music.volume = 0.35; music.play().catch(() => {}); }
  setTimeout(greet, 1300);
  // idle 8 s: the paw taps Play (CSS, .tp-paw) and, with sound on, Sensei says so; any tap starts the 8 s again
  let idleT = setTimeout(function nudge() { if (unlocked && !going) say("help_start", "Tap the big green button to start!", 2600); }, 8000);
  addEventListener("pointerdown", () => { clearTimeout(idleT); document.querySelectorAll(".tp-paw, .tp-paw svg").forEach((el) => { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; }); }, true);

  // ---------- taps: Play, or anywhere on the painting, starts ONCE (one handler; the controls stop their taps)
  function stopTap(el, fn) {
    el.addEventListener("pointerdown", (e) => { e.stopPropagation(); e.preventDefault(); unlock(); fn(e); });
  }
  let going = false;
  function start(fromButton) {
    if (going) return;
    going = true;
    window.__starts = (window.__starts || 0) + 1; // the test hook for "one tap starts once" (the audit's double start)
    unlock();
    play.classList.add("pressed");
    try { new Audio("../../../public/a/fx/kiai_kai_1.mp3").play().catch(() => {}); } catch {}
    // petals burst out of the button itself
    const r = play.getBoundingClientRect(), sr = $("stage").getBoundingClientRect(), s = window.__fit.s;
    const cx = (r.left + r.width * 0.3 - sr.left) / s, cy = (r.top + r.height / 2 - sr.top) / s;
    const burst = $("burst");
    burst.innerHTML = "";
    for (let i = 0; i < 16; i++) {
      const a = -Math.PI * (0.05 + 0.9 * (i / 15)) + (Math.random() - 0.5) * 0.3, d = 260 + Math.random() * 260;
      const p = document.createElement("i");
      p.className = `c${i % 8}`;
      p.style.cssText = `left:${cx + (Math.random() - 0.5) * 200}px;top:${cy}px;--bx:${Math.cos(a) * d}px;--by:${Math.sin(a) * d * 0.9}px;--br:${(Math.random() - 0.5) * 720}deg;animation-delay:${Math.random() * 0.08}s`;
      burst.appendChild(p);
    }
    setTimeout(() => { play.classList.remove("pressed"); scene.classList.add("going"); }, 110);
    $("next-what").textContent = players.length ? `Next: ${players[0].name}'s map (1 tap from the title)` : "Next: What's your name?";
    const f = window.__fit;
    // the bloom opens where the flower is on this phone
    vp.style.setProperty("--bloom-x", f.x0 + (f.L + (1620 / 2400) * f.Wa) * f.s + "px");
    vp.style.setProperty("--bloom-y", f.y0 + (f.T + (545 / 1340) * f.Ha) * f.s + "px");
    vp.classList.add("going");
  }
  stopTap(play, () => start(true));
  scene.addEventListener("pointerdown", (e) => { if (!going) start(false); });
  $("again").addEventListener("pointerdown", (e) => { e.stopPropagation(); location.reload(); });

  // ---------- Help and the grown-ups' gear stop their taps (a tap on them never starts the game)
  stopTap($("help"), () => say("help_start", "Tap the big green button to start!", 2600));
  const gear = $("gear");
  let hold = null, t0 = 0;
  gear.addEventListener("pointerdown", (e) => {
    e.stopPropagation(); e.preventDefault(); unlock();
    t0 = performance.now();
    const ring = gear.querySelector(".ring");
    const step = () => {
      const p = Math.min(1, (performance.now() - t0) / 2000);
      ring.style.setProperty("--p", p);
      if (p >= 1) { hold = null; ring.style.setProperty("--p", 0); note("Opens the grown-ups page (settings, players)"); return; }
      hold = requestAnimationFrame(step); // only while a finger is holding it: never when idle
    };
    hold = requestAnimationFrame(step);
  });
  const release = () => {
    if (!hold) return;
    cancelAnimationFrame(hold); hold = null;
    gear.querySelector(".ring").style.setProperty("--p", 0);
    if (performance.now() - t0 < 600) { gear.classList.add("hint"); clearTimeout(release.t); release.t = setTimeout(() => gear.classList.remove("hint"), 2200); }
  };
  gear.addEventListener("pointerup", release);
  gear.addEventListener("pointerleave", release);
  gear.addEventListener("pointercancel", release);

  function note(text) { say(null, text, 2400); }

  // ---------- forced states for screenshots
  if (q.has("hover")) play.classList.add("hover");
  if (q.has("press")) play.classList.add("pressed");
  if (q.has("paw")) scene.classList.add("paw-now");
  if (q.has("dev")) {
    const dev = $("dev");
    dev.classList.add("on");
    dev.querySelectorAll("[data-s]").forEach((b) => b.addEventListener("click", () => { const u = new URL(location.href); u.searchParams.set("state", b.dataset.s); location.href = u; }));
    $("dev-paw").addEventListener("click", () => scene.classList.toggle("paw-now"));
    dev.addEventListener("pointerdown", (e) => e.stopPropagation());
  }
})();
</script>
</body>
</html>
