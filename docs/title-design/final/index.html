<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#c8e4ec" />
<title>Super Ninja title</title>
<!-- The final title (docs/TITLE_DESIGN.md). A mock-up: the game's real assets, the game's Stage rule (1280x720 stage px,
     scaled to the phone's height), but the art bleeds past the stage to the screen's edges. -->
<!-- the key art is preloaded and sized for the phone: DPR 2 (the iPhone SE) takes the 1600 px file, DPR 3 the 2400 -->
<link rel="preload" as="image" href="art/key-2400.webp" imagesrcset="art/key-1600.webp 2x, art/key-2400.webp 3x" fetchpriority="high" />
<link rel="preload" as="image" href="art/baron-storm.webp" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;600;700;800&family=Luckiest+Guy&display=block" rel="stylesheet" />
<style>
:root {
  --ink: #2b1d14; --paper: #fff4dc; --red: #e2412f; --gold: #ffc53d; --gold-deep: #c98a00;
  --good: #3fbf6a; --good-deep: #1f7a41; --sky: #3fb2ee;
  --font-display: "Luckiest Guy", "Baloo 2", system-ui, sans-serif;
  --font-ui: "Baloo 2", "Andika", system-ui, sans-serif;
  --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom); --sal: env(safe-area-inset-left); --sar: env(safe-area-inset-right);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
/* the first paint is already the painting's colours (the dawn sky over the meadow), never grey or plum */
body { background: linear-gradient(180deg, #c8e4ec 0%, #e9dccd 40%, #e7cdb7 58%, #a9bf7c 72%, #859c60 100%);
  font-family: var(--font-ui); color: var(--ink); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

/* ---------- the stage: exactly the game's (ui.tsx Stage), but the title lets its art bleed past the stage's edges */
.stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 0 0; touch-action: none; }
.stage.bleed { overflow: visible; }
.abs { position: absolute; }

/* ---------- the painting: the torii framing the World Flower on the meadow (one image, baked: no SVG gate, no ray layer) */
.key { position: absolute; left: -300.5px; top: -46px; width: 1880.3px; height: 887px; transform-origin: 940.5px 528px; animation: settle 1.3s cubic-bezier(.2, .7, .2, 1) backwards; }
/* arrival: the camera settles on the gate as the logo drops (one-shot, the individual `scale` property, so the cover
   transform set by fit() is untouched) */
@keyframes settle { from { scale: 1.07; } to { scale: 1; } }
/* the heart's light: one soft glow over the flower's heart that breathes (opacity and scale only) */
.glow { left: 380px; top: 222px; width: 520px; height: 520px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255, 252, 228, 0.9) 0%, rgba(255, 240, 180, 0.5) 40%, rgba(255, 220, 130, 0.16) 66%, rgba(255, 214, 110, 0) 100%);
  animation: breathe 4.2s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: 0.55; transform: scale(0.96); } 50% { opacity: 0.95; transform: scale(1.05); } }
.motes { left: 492px; top: 330px; width: 296px; height: 390px; pointer-events: none; overflow: hidden; }
.mote { position: absolute; bottom: -18px; width: 16px; height: 16px; border-radius: 50%; opacity: 0;
  background: radial-gradient(closest-side, #fff, rgba(255, 236, 160, 0.9) 45%, rgba(255, 220, 120, 0)); animation: rise 4.6s linear infinite; }
@keyframes rise { 0% { transform: translateY(0) scale(0.6); opacity: 0; } 15% { opacity: 1; } 80% { opacity: 0.8; } 100% { transform: translateY(-360px) scale(1.2); opacity: 0; } }
.spark { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; pointer-events: none; opacity: 0;
  background: radial-gradient(circle, #fff 0 18%, #fff3b8 34%, rgba(255, 214, 102, 0) 70%);
  clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); animation: twinkle 3.2s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { transform: scale(0.2) rotate(0); opacity: 0; } 45% { transform: scale(1.1) rotate(45deg); opacity: 1; } 70% { transform: scale(0.6) rotate(70deg); opacity: 0.6; } }

/* ---------- Baron Muddle in his storm (keyed from the site's own painting), top right */
.storm-wrap { right: -96px; top: -62px; width: 600px; pointer-events: none; animation: storm-in 0.8s cubic-bezier(.2, .8, .3, 1) 0.4s both; }
.storm-bob { animation: storm-bob 7s ease-in-out infinite; }
.storm { display: block; width: 100%; }
.storm-flash { position: absolute; left: 42%; top: 6%; width: 58%; height: 66%; border-radius: 50%; opacity: 0;
  background: radial-gradient(closest-side, rgba(236, 214, 255, 0.9), rgba(190, 140, 255, 0.45) 45%, rgba(160, 110, 255, 0) 100%); animation: flash 6.4s linear infinite; }
@keyframes storm-bob { 0%, 100% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(-12px, 7px) rotate(-1deg); } }
@keyframes flash { 0%, 58%, 61%, 64%, 67%, 100% { opacity: 0; } 59.5%, 65.5% { opacity: 1; } 62.5% { opacity: 0.35; } }
@keyframes storm-in { from { transform: translate(140px, -110px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- no decorative teardrops: a teardrop always means a sound (Dec6). The painted flower's petals are its sounds;
   everything that flies is a golden spark or a round blossom petal */
.blossom { position: absolute; width: 34px; height: 30px; margin: -15px 0 0 -17px; border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%;
  background: radial-gradient(circle at 50% 70%, #fff6fa 0 12%, #ffc9dc 40%, #ff8fb6 100%); border: 3px solid #c9406f;
  clip-path: polygon(0 0, 38% 0, 50% 18%, 62% 0, 100% 0, 100% 100%, 0 100%); }
/* the shooting star: every 9 s a golden spark streaks out of the sky past Baron's storm into Play's heart (Play catches it) */
.comet { left: 0; top: 0; pointer-events: none; opacity: 0; z-index: 12; animation: comet 9s linear 2.6s infinite; }
.comet .glow2 { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 252, 220, 0.95), rgba(255, 226, 120, 0.5) 45%, rgba(255, 214, 90, 0) 100%); }
.comet .star { position: absolute; width: 54px; height: 54px; margin: -27px 0 0 -27px; background: radial-gradient(circle, #fff 0 22%, #fff3a8 40%, #ffc53d 75%);
  clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); }
@keyframes comet {
  0% { transform: translate(1080px, 230px) scale(0.4); opacity: 0; animation-timing-function: cubic-bezier(.2, .6, .5, 1); }
  2% { opacity: 1; }
  7% { transform: translate(975px, 160px) scale(1.1) rotate(160deg); animation-timing-function: cubic-bezier(.5, 0, .75, .55); }
  12% { transform: translate(860px, 300px) scale(0.95) rotate(300deg); animation-timing-function: cubic-bezier(.3, .4, .6, 1); }
  16% { transform: translate(640px, 486px) scale(0.5) rotate(420deg); opacity: 1; }
  17%, 100% { transform: translate(640px, 486px) scale(0.2); opacity: 0; }
}

/* ---------- the logo: the game's lockup, in the sky above the gate (no beam crosses a letter) */
.logo-wrap { left: 0; top: 4px; width: 1280px; text-align: center; pointer-events: none; animation: logo-in 0.65s cubic-bezier(.3, 1.5, .5, 1) 0.05s both; }
.logo { display: inline-block; font-family: var(--font-display); font-size: 100px; line-height: 0.86; letter-spacing: 4px; color: var(--paper);
  -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; text-shadow: 0 9px 0 var(--ink), 0 18px 26px rgba(70, 30, 0, 0.3); transform: rotate(-3deg);
  /* a cream halo that follows the letters lifts the lockup off the flower's crown (painted once: the logo never animates
     by itself, only its wrapper's entrance moves) */
  filter: drop-shadow(0 0 5px rgba(255, 250, 236, 0.95)) drop-shadow(0 0 16px rgba(255, 246, 228, 0.9)); }
.logo .l1 { color: var(--gold); display: block; }
.logo .l2 { color: var(--red); font-size: 132px; display: block; }
@keyframes logo-in { from { transform: translateY(-70px) scale(0.85); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Play: the World Flower's heart (a green jewel in a gold, beaded rim), and the gate's name board says PLAY */
.play { left: 470px; top: 262px; width: 340px; height: 450px; touch-action: none; z-index: 10; animation: play-in 0.55s cubic-bezier(.3, 1.6, .5, 1) 0.2s both; }
/* the tap area is the whole gate opening (x 470-810, y 262-712); the drawn button is inside it */
.play .bob { position: absolute; left: 26px; top: 90px; width: 288px; height: 288px; }
.play .heart { position: absolute; inset: 0; border-radius: 50%; animation: heartbeat 1.8s ease-in-out 1s infinite; }
@keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
.play .halo { position: absolute; inset: -30px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255, 250, 220, 0.9) 62%, rgba(255, 230, 150, 0.45) 80%, rgba(255, 214, 102, 0) 100%); }
.play .ripple { position: absolute; inset: 0; border-radius: 50%; border: 10px solid rgba(255, 244, 196, 0.95); pointer-events: none; opacity: 0;
  animation: ripple 2.4s cubic-bezier(.2, .6, .4, 1) 1s infinite; }
.play .ripple.r2 { animation-delay: 2.2s; }
@keyframes ripple { 0% { transform: scale(0.96); opacity: 0.9; } 100% { transform: scale(1.5); opacity: 0; } }
.play .knob { position: absolute; inset: 0; border-radius: 50%; transition: transform 0.08s; }
.play .rim { position: absolute; inset: 0; border-radius: 50%; border: 7px solid var(--ink);
  background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23ffe680' stroke='%23a86f00' stroke-width='.9'><circle cx='94.60' cy='50.00' r='2.5'/><circle cx='93.48' cy='59.92' r='2.5'/><circle cx='90.18' cy='69.35' r='2.5'/><circle cx='84.87' cy='77.81' r='2.5'/><circle cx='77.81' cy='84.87' r='2.5'/><circle cx='69.35' cy='90.18' r='2.5'/><circle cx='59.92' cy='93.48' r='2.5'/><circle cx='50.00' cy='94.60' r='2.5'/><circle cx='40.08' cy='93.48' r='2.5'/><circle cx='30.65' cy='90.18' r='2.5'/><circle cx='22.19' cy='84.87' r='2.5'/><circle cx='15.13' cy='77.81' r='2.5'/><circle cx='9.82' cy='69.35' r='2.5'/><circle cx='6.52' cy='59.92' r='2.5'/><circle cx='5.40' cy='50.00' r='2.5'/><circle cx='6.52' cy='40.08' r='2.5'/><circle cx='9.82' cy='30.65' r='2.5'/><circle cx='15.13' cy='22.19' r='2.5'/><circle cx='22.19' cy='15.13' r='2.5'/><circle cx='30.65' cy='9.82' r='2.5'/><circle cx='40.08' cy='6.52' r='2.5'/><circle cx='50.00' cy='5.40' r='2.5'/><circle cx='59.92' cy='6.52' r='2.5'/><circle cx='69.35' cy='9.82' r='2.5'/><circle cx='77.81' cy='15.13' r='2.5'/><circle cx='84.87' cy='22.19' r='2.5'/><circle cx='90.18' cy='30.65' r='2.5'/><circle cx='93.48' cy='40.08' r='2.5'/></g></svg>") center / 100% 100% no-repeat, radial-gradient(circle at 38% 30%, #fff7cf 0%, #ffd552 34%, #eeae22 62%, #c98a00 100%);
  box-shadow: 0 11px 0 var(--ink), 0 22px 30px rgba(60, 30, 0, 0.33), inset 0 0 0 5px #ffe07a; transition: box-shadow 0.08s; }
.play .disc { position: absolute; inset: 24px; border-radius: 50%; overflow: hidden; border: 6px solid var(--ink);
  background: radial-gradient(circle at 36% 28%, #effff3 0%, #8ff0ac 15%, #45c874 42%, #23924d 76%, #176a37 100%);
  box-shadow: inset 0 -12px 0 rgba(0, 60, 20, 0.28), inset 0 8px 0 rgba(255,255,255,0.35); }
.play .glint { position: absolute; left: -60%; top: -20%; width: 46%; height: 140%; pointer-events: none;
  background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%); transform: translateX(-60%) rotate(20deg);
  animation: glint 3.6s ease-in-out 1.4s infinite; }
@keyframes glint { 0%, 55% { transform: translateX(-60%) rotate(20deg); } 85%, 100% { transform: translateX(420%) rotate(20deg); } }
.play .tri { position: absolute; left: 50%; top: 50%; width: 124px; height: 124px; margin: -62px 0 0 -50px; filter: drop-shadow(0 7px 0 var(--ink)); }
/* the catch: when the comet lands, the heart flashes and a gold ring runs out (same 9 s timeline as .comet) */
.play .catch { position: absolute; inset: -6px; border-radius: 50%; border: 12px solid #fff6c8; opacity: 0; pointer-events: none; animation: catch 9s linear 2.6s infinite; }
@keyframes catch { 0%, 15.6% { transform: scale(0.9); opacity: 0; } 16.2% { transform: scale(0.95); opacity: 1; } 22% { transform: scale(1.55); opacity: 0; } 100% { opacity: 0; } }
/* the name board, hung on the gate's central strut: black lacquer and gold like the gate's top beam */
.board { position: absolute; left: 76px; top: 4px; width: 188px; height: 72px; border-radius: 10px; border: 5px solid var(--ink);
  background: linear-gradient(180deg, #4a3526 0%, #2b1d14 55%, #1f140d 100%);
  box-shadow: inset 0 0 0 4px #e0a21a, inset 0 0 0 7px #3a2718, 0 6px 0 rgba(43, 29, 20, 0.45);
  display: grid; place-items: center; transform-origin: 50% 0; }
.board span { font: 400 50px/1 var(--font-display); letter-spacing: 3px; color: #ffd45a; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill;
  text-shadow: 0 3px 0 var(--ink); padding-top: 8px; }
@keyframes play-in { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }
/* hover (mouse) and press (touch): the button sinks onto its shadow and brightens a little (never washes out) */
@media (hover: hover) { .play:hover .knob { transform: translateY(-5px) scale(1.03); } }
.force-hover .play .knob { transform: translateY(-5px) scale(1.03); }
.play.pressing .heart, .force-press .play .heart { animation: none; }
.play.pressing .knob, .force-press .play .knob { transform: translateY(9px) scale(0.96, 0.93); }
.play.pressing .rim, .force-press .play .rim { box-shadow: 0 2px 0 var(--ink), 0 8px 14px rgba(60, 30, 0, 0.3), inset 0 0 0 5px #fff1a8; }
.play.pressing .disc, .force-press .play .disc { background: radial-gradient(circle at 36% 28%, #ffffff 0%, #a8f8bf 15%, #52d680 42%, #28a055 76%, #1a7540 100%); }
/* the idle nudge: the heart beats hard twice and rings out (it stays in the flower; a visual nudge works before sound is
   unlocked), and the name board clacks */
.play .bob.nudge { animation: boing 0.9s cubic-bezier(.3, 0, .4, 1) 2; }
@keyframes boing { 0%, 100% { transform: scale(1); } 22% { transform: scale(1.16, 1.12); } 45% { transform: scale(0.95, 0.98); } 68% { transform: scale(1.06); } }
.play .ring-out { position: absolute; inset: -6px; border-radius: 50%; border: 12px solid #fff6c8; opacity: 0; pointer-events: none; }
.play .bob.nudge .ring-out { animation: ring-out 0.9s cubic-bezier(.2, .7, .3, 1) 2; }
@keyframes ring-out { 0% { transform: scale(0.95); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 25% { transform: translateY(-34px) scale(1.04, 0.97); } 50% { transform: translateY(0) scale(1.06, 0.94); } 70% { transform: translateY(-14px); } }
.board.clack { animation: clack 0.7s cubic-bezier(.3, .6, .4, 1); }
@keyframes clack { 0% { transform: rotate(0); } 20% { transform: rotate(4deg); } 45% { transform: rotate(-3deg); } 70% { transform: rotate(1.5deg); } 100% { transform: rotate(0); } }
/* the paw (the game's TapHint), after 16 s untouched */
.paw { position: absolute; left: 236px; top: 280px; width: 110px; height: 110px; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
.paw.on { opacity: 1; animation: taphint 1.4s ease-in-out infinite; }
@keyframes taphint { 0%, 100% { transform: translate(0, 0) scale(1); } 45% { transform: translate(-10px, -18px) scale(1.05); } 60% { transform: translate(0, 0) scale(0.92); } }

/* ---------- the cast: the heroes stand on the meadow either side of the gate; the child's own ninja is in front */
.hero { position: absolute; bottom: 8px; pointer-events: none; }
.hero .land { animation: land 0.55s cubic-bezier(.3, 0, .5, 1) var(--in, 0.3s) both; transform-origin: 50% 100%; }
@keyframes land { 0% { transform: translateY(-160px); opacity: 0; } 55% { transform: translateY(0) scale(1, 1); opacity: 1; } 72% { transform: scale(1.08, 0.9); } 100% { transform: none; opacity: 1; } }
.hero .bob { animation: bob 2.6s ease-in-out infinite; }
.hero.leap .bob { animation: leap-bob 3.1s ease-in-out -0.8s infinite; }
.hero img { display: block; width: 100%; filter: drop-shadow(0 8px 0 rgba(43, 29, 20, 0.22)); }
.hero.flip img { transform: scaleX(-1); }
.hero .shadow { position: absolute; left: 14%; right: 14%; bottom: -10px; height: 26px; border-radius: 50%; background: radial-gradient(closest-side, rgba(40, 60, 10, 0.38), rgba(40, 60, 10, 0)); }
.hero.leap .shadow { animation: shadow-breathe 3.1s ease-in-out -0.8s infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@keyframes leap-bob { 0%, 100% { transform: translateY(-36px) rotate(-3deg); } 50% { transform: translateY(-58px) rotate(2deg); } }
@keyframes shadow-breathe { 0%, 100% { transform: scale(0.8); opacity: 0.8; } 50% { transform: scale(0.65); opacity: 0.55; } }
.me { z-index: 3; }
/* the child's name on a little wooden sign in the grass (not cream-and-ink: it isn't a button) */
.sign { position: absolute; left: 44%; bottom: -26px; transform: translateX(-50%) rotate(-3deg); z-index: 4; padding: 10px 26px 6px; border-radius: 14px;
  border: 5px solid var(--ink); background: linear-gradient(180deg, #b77a45 0%, #8d5a2e 100%); box-shadow: inset 0 3px 0 rgba(255, 220, 170, 0.45), 0 6px 0 rgba(43, 29, 20, 0.5);
  font: 800 38px/1 var(--font-ui); color: #fff4dc; text-shadow: 0 2px 0 var(--ink); white-space: nowrap; }
.sign::before { content: ""; position: absolute; left: 50%; top: 100%; width: 14px; height: 26px; margin-left: -7px; background: #7a4a24; border: 4px solid var(--ink); border-top: 0; z-index: -1; }
.swap .land { animation: land 0.5s cubic-bezier(.3, 0, .5, 1) both; }

/* ---------- Sensei's Help: the standard coin, bottom-right, 124 stage px (NAVIGATION.md); its "?" is sky blue on the title
   so Play is the only green thing on the screen */
.help-btn { position: absolute; right: 14px; bottom: 14px; z-index: 85; width: 124px; height: 124px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #fff8e6, #ffd98a 70%, #e0a53a); border: 6px solid var(--ink); box-shadow: 0 7px 0 var(--ink), 0 0 0 6px rgba(255, 244, 220, .8); }
.help-btn img { position: absolute; inset: 5px; width: calc(100% - 10px); height: calc(100% - 10px); border-radius: 50%; object-fit: cover; }
.help-btn .help-q { position: absolute; left: -10px; top: -10px; width: 46px; height: 46px; border-radius: 50%; background: var(--sky); border: 5px solid var(--ink);
  color: #fff; font: 400 30px/38px var(--font-display); text-align: center; text-shadow: 0 2px 0 var(--ink); }
.help-btn.talking { box-shadow: 0 7px 0 var(--ink), 0 0 0 8px rgba(255,197,61,.95), 0 0 30px 8px rgba(255,220,120,.9); }
.help-btn.talking .help-q { display: none; }
.help-waves { position: absolute; right: 100%; top: 50%; width: 44px; height: 70px; margin: -35px 6px 0 0; transform: scaleX(-1); pointer-events: none; display: none; }
.help-btn.talking .help-waves { display: block; }
.help-waves i { position: absolute; inset: 0; opacity: 0; animation: wave 0.9s ease-out infinite; }
.help-waves i:nth-child(2) { animation-delay: -0.75s; } .help-waves i:nth-child(3) { animation-delay: -0.6s; }
.help-waves svg { display: block; width: 100%; height: 100%; fill: none; stroke: #ffc53d; stroke-width: 7; stroke-linecap: round; filter: drop-shadow(0 2px 0 #2b1d14); }
@keyframes wave { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
.caption { position: absolute; right: 150px; bottom: 40px; z-index: 86; max-width: 520px; padding: 12px 22px; border: 5px solid var(--ink); border-radius: 26px; background: #fffdf3;
  font: 800 32px/1.15 var(--font-ui); box-shadow: 0 6px 0 var(--ink); opacity: 0; transform: scale(0.7); transform-origin: 100% 60%; transition: opacity 0.2s, transform 0.25s cubic-bezier(.3, 1.6, .5, 1); pointer-events: none; white-space: nowrap; }
.caption.on { opacity: 1; transform: none; }

/* ---------- grown-ups: who's playing (a chip of faces) and the settings gear (hold 2 s), top-left, quiet */
.gu { left: 18px; top: 16px; display: flex; align-items: center; gap: 14px; z-index: 20; position: absolute; animation: fade-in 0.4s ease-out 0.7s both; }
@keyframes fade-in { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
.chip { display: flex; align-items: center; gap: 8px; height: 96px; padding: 0 22px 0 8px; border-radius: 999px; border: 5px solid var(--ink);
  background: rgba(255, 253, 243, 0.95); box-shadow: 0 6px 0 var(--ink); }
.chip:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.face { position: relative; width: 72px; height: 72px; border-radius: 50%; border: 4px solid var(--ink); background: var(--pc, #ffc53d) center/cover; flex: none;
  box-shadow: 0 0 0 5px var(--pc, #ffc53d); display: grid; place-items: center; font: 400 42px/1 var(--font-display); color: #fff; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }
.stack { display: flex; align-items: center; padding-left: 4px; }
.stack .face { width: 52px; height: 52px; margin-left: -14px; box-shadow: 0 0 0 4px var(--pc); font-size: 28px; -webkit-text-stroke: 4px var(--ink); }
.stack .face:first-child { width: 72px; height: 72px; margin-left: 0; font-size: 42px; -webkit-text-stroke: 5px var(--ink); }
.chip .more { font: 800 30px/1 var(--font-ui); color: #6f5a46; padding: 6px 0 0 8px; }
.chip .swap-ic { width: 38px; height: 38px; margin-left: 6px; }
.gear { position: relative; width: 96px; height: 96px; border-radius: 50%; border: 5px solid var(--ink); background: radial-gradient(circle at 38% 30%, #fffdf3, #eadbb8);
  box-shadow: 0 5px 0 var(--ink); display: grid; place-items: center; }
.gear svg.cog { width: 54px; height: 54px; }
.gear svg.prog { position: absolute; inset: -10px; width: calc(100% + 20px); height: calc(100% + 20px); transform: rotate(-90deg); pointer-events: none; }
.gear svg.prog circle { fill: none; stroke: var(--gold); stroke-width: 9; stroke-dasharray: 289; stroke-dashoffset: 289; stroke-linecap: round; }
.gear.holding svg.prog circle { transition: stroke-dashoffset 2s linear; stroke-dashoffset: 0; }
.hold-hint { position: absolute; left: 0; top: calc(100% + 14px); white-space: nowrap; font: 700 28px/1 var(--font-ui); color: var(--ink); background: #fffdf6; border: 4px solid var(--ink);
  border-radius: 18px; padding: 12px 18px 8px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.hold-hint.on { opacity: 1; }

/* ---------- the players' shelf (from the chip): pick a child, or make a new one. It never starts the game. */
.shelf { left: -900px; top: -600px; width: 3080px; height: 1920px; display: none; background: rgba(40, 22, 10, 0.42); z-index: 30; }
.shelf.open { display: block; }
.shelf .panel { position: absolute; left: 50%; top: 640px; transform: translateX(-50%); max-width: 1180px; padding: 16px 30px 26px; border-radius: 36px; border: 6px solid var(--ink);
  background: #fffaf0; box-shadow: 0 9px 0 var(--ink); animation: drop 0.35s cubic-bezier(.3, 1.4, .5, 1) both; text-align: center; }
@keyframes drop { from { transform: translate(-50%, -40px) scale(0.9); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
.shelf h3 { margin: 0 0 10px; font: 800 40px/1.1 var(--font-ui); }
.shelf .row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; max-width: 1120px; }
.card { flex: none; width: 140px; display: flex; flex-direction: column; align-items: center; gap: 20px; padding-top: 8px; }
.card .face { width: 122px; height: 122px; font-size: 72px; -webkit-text-stroke: 7px var(--ink); box-shadow: 0 0 0 7px var(--pc), 0 8px 0 7px var(--ink); }
.card.cur .face { box-shadow: 0 0 0 7px var(--pc), 0 0 0 13px var(--gold), 0 8px 0 13px var(--ink); }
.card .nm { font: 800 32px/1 var(--font-ui); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card.hopping .face { animation: hop 0.5s cubic-bezier(.3, 0, .4, 1); }
.card.add .face { background: #fffdf3; border-style: dashed; box-shadow: none; color: var(--ink); -webkit-text-stroke: 0; font: 800 76px/1 var(--font-ui); }
.card.add .nm { color: #6f5a46; font-size: 28px; }

/* ---------- Start: the heart rings like a gong, the heroes leap into its light, and the light fills the screen (bright) */
.shock { left: 640px; top: 476px; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; border: 16px solid #fff3c0; opacity: 0; pointer-events: none; z-index: 11; }
.going .shock { animation: shock 0.65s cubic-bezier(.2, .7, .3, 1) forwards; }
@keyframes shock { 0% { transform: scale(0.9); opacity: 1; } 100% { transform: scale(2.6); opacity: 0; } }
.going .play .heart { animation: play-go 0.6s cubic-bezier(.3, 0, .5, 1) 0.08s forwards; }
@keyframes play-go { 0% { transform: scale(0.94); } 28% { transform: scale(1.16); } 100% { transform: scale(1.26); } }
.play .flash { position: absolute; inset: -4px; border-radius: 50%; opacity: 0; pointer-events: none;
  background: radial-gradient(closest-side, #fffef4 0%, #fff6c8 55%, rgba(255, 236, 150, 0.9) 85%, rgba(255, 226, 130, 0) 100%); }
.going .play .flash { animation: flash-in 0.4s ease-out 0.12s forwards; }
@keyframes flash-in { to { opacity: 1; } }
.going .glow { animation: flare 0.6s ease-out forwards; }
@keyframes flare { to { transform: scale(1.5); opacity: 1; } }
.going .hero .bob { animation: into-light 0.8s linear 0.08s forwards; }
.going .hero.second .bob { animation-delay: 0.16s; }
.going .hero .shadow { animation: none; opacity: 0; transition: opacity 0.2s; }
@keyframes into-light {
  0% { transform: translate(0, 0); animation-timing-function: ease-out; }
  18% { transform: translate(-6px, 24px) scale(1.04, 0.88); animation-timing-function: cubic-bezier(.2, .7, .4, 1); }
  50% { transform: translate(calc(var(--gx) * 0.6), -220px) scale(0.85) rotate(var(--spin, -8deg)); opacity: 1; animation-timing-function: cubic-bezier(.5, 0, .8, .6); }
  88% { transform: translate(var(--gx), var(--gy, -60px)) scale(0.28) rotate(calc(var(--spin, -8deg) * -2.5)); opacity: 1; }
  100% { transform: translate(var(--gx), var(--gy, -60px)) scale(0.1); opacity: 0; }
}
.going .storm-bob { animation: storm-flee 1s cubic-bezier(.5, 0, .8, .5) forwards; }
@keyframes storm-flee { to { transform: translate(180px, -150px) scale(0.85); opacity: 0.25; } }
.going .board { animation: clack 0.7s cubic-bezier(.3, .6, .4, 1); }
.burst { left: 640px; top: 486px; pointer-events: none; z-index: 35; }
.burst .bp { position: absolute; left: 0; top: 0; animation: burst 0.9s cubic-bezier(.1, .7, .3, 1) forwards; }
@keyframes burst { from { transform: translate(0, 0) rotate(0) scale(0.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1.1); opacity: 0; } }
.iris { left: 540px; top: 386px; width: 200px; height: 200px; border-radius: 50%; pointer-events: none; opacity: 0; z-index: 40;
  background: radial-gradient(closest-side, #fffef6 0%, #fff8dc 58%, rgba(255, 240, 180, 0.95) 82%, rgba(255, 234, 160, 0) 100%); }
.going .iris { animation: iris 0.5s cubic-bezier(.55, 0, .75, .4) 0.55s forwards; }
@keyframes iris { 0% { transform: scale(0.3); opacity: 0; } 20% { opacity: 1; } 100% { transform: scale(17); opacity: 1; } }

/* ---------- the idle sleep: after 30 s untouched the scenery rests (Play keeps breathing); any tap wakes it */
.sleep .glow, .sleep .mote, .sleep .spark, .sleep .storm-bob, .sleep .storm-flash, .sleep .comet, .sleep .play .catch, .sleep .hero .bob, .sleep .hero .shadow { animation-play-state: paused; }

/* ---------- mock-up only: the next screen, the state switcher, the upright prompt */
.next { position: fixed; inset: 0; display: none; place-items: center; background: #fffbef; z-index: 50; text-align: center; font-family: var(--font-ui); }
.next.on { display: grid; animation: next-in 0.4s both; }
@keyframes next-in { from { opacity: 0; } }
.next h2 { font: 400 60px/1 var(--font-display); color: var(--red); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; margin: 0 0 12px; }
.next p { font: 700 20px/1.35 var(--font-ui); margin: 0 auto 16px; max-width: 560px; }
.next button { font: 800 18px/1 var(--font-ui); padding: 12px 22px; border: 3px solid var(--ink); border-radius: 999px; background: var(--gold); box-shadow: 0 4px 0 var(--ink); }
.mock { position: fixed; left: 50%; bottom: 3px; transform: translateX(-50%); z-index: 60; display: flex; gap: 3px; padding: 3px; border-radius: 12px; background: rgba(43, 29, 20, 0.55); font: 700 10px/1 system-ui, sans-serif; }
.mock a { color: #fff; text-decoration: none; padding: 5px 7px; border-radius: 8px; }
.mock a.on { background: rgba(255, 255, 255, 0.25); }
.shot .mock { display: none; }
.turn { position: fixed; inset: 0; display: none; place-items: center; z-index: 70; background: radial-gradient(ellipse at 50% 42%, #43307a 0%, #2a1a4a 45%, #1d1230 80%); }
.turn .phone { width: 70px; height: 118px; border: 6px solid #fff4dc; border-radius: 16px; animation: turn 2.4s ease-in-out infinite; }
@keyframes turn { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 700px) { .stage { display: none; } .turn { display: grid; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; } }
</style>
</head>
<body>
<div class="stage bleed scene title" id="stage">
  <img class="key" id="key" src="art/key-2400.webp" srcset="art/key-1600.webp 2x, art/key-2400.webp 3x" alt="" fetchpriority="high" decoding="async" />
  <div class="abs glow"></div>
  <div class="abs motes">
    <i class="mote" style="left:24px;animation-delay:-.3s"></i><i class="mote" style="left:78px;animation-delay:-2.4s;width:12px;height:12px"></i>
    <i class="mote" style="left:136px;animation-delay:-3.6s"></i><i class="mote" style="left:190px;animation-delay:-1.3s;width:12px;height:12px"></i>
    <i class="mote" style="left:238px;animation-delay:-3s"></i><i class="mote" style="left:270px;animation-delay:-.9s;width:10px;height:10px"></i>
  </div>
  <i class="spark" style="left:372px;top:318px;animation-delay:-.4s"></i>
  <i class="spark" style="left:912px;top:300px;animation-delay:-1.5s"></i>
  <i class="spark" style="left:350px;top:600px;animation-delay:-2.4s;width:26px;height:26px"></i>
  <i class="spark" style="left:930px;top:620px;animation-delay:-.9s;width:26px;height:26px"></i>

  <div class="abs storm-wrap"><div class="storm-bob"><img class="storm" src="art/baron-storm.webp" alt="" /><div class="storm-flash"></div></div></div>

  <div class="abs logo-wrap"><div class="logo"><span class="l1">Super</span><span class="l2">Ninja</span></div></div>

  <div id="cast"></div>

  <button class="abs play" id="play" aria-label="Start">
    <span class="board" id="board"><span>Play</span></span>
    <span class="bob" id="playBob"><span class="heart">
      <span class="halo"></span><span class="ripple"></span><span class="ripple r2"></span>
      <span class="knob"><span class="rim"></span><span class="disc"><span class="glint"></span></span>
        <svg class="tri" viewBox="0 0 100 100" aria-hidden="true"><path d="M26 14 L86 50 L26 86 Z" fill="#fffbea" stroke="#2b1d14" stroke-width="9" stroke-linejoin="round"/></svg></span>
      <span class="catch"></span><span class="ring-out"></span><span class="flash"></span>
    </span></span>
    <span class="paw" id="paw"><svg viewBox="0 0 64 64" width="110" height="110"><path d="M26 30V12a5 5 0 0 1 10 0v16l3-1a5 5 0 0 1 6 3l1 1a5 5 0 0 1 6 4v8c0 9-6 16-15 16h-3c-6 0-10-3-13-8l-7-11a4 4 0 0 1 6-5l6 6z" fill="#fff4dc" stroke="#2b1d14" stroke-width="4" stroke-linejoin="round"/></svg></span>
  </button>
  <div class="abs comet"><i class="glow2"></i><i class="star"></i></div>

  <div class="abs gu" id="gu"></div>
  <button class="help-btn" id="help" aria-label="Help"><img src="../../../public/a/i/sensei_face_idle.webp" alt="" /><span class="help-q">?</span>
    <span class="help-waves" aria-hidden="true"><i><svg viewBox="0 0 60 80"><path d="M14 22 Q24 40 14 58"/></svg></i><i><svg viewBox="0 0 60 80"><path d="M28 12 Q44 40 28 68"/></svg></i><i><svg viewBox="0 0 60 80"><path d="M42 4 Q62 40 42 76"/></svg></i></span></button>
  <div class="caption" id="caption"></div>
  <div class="abs shelf" id="shelf"><div class="panel"><h3>Who's playing?</h3><div class="row" id="row"></div></div></div>
  <div class="abs shock"></div>
  <div class="abs burst" id="burst"></div>
  <div class="abs iris"></div>
</div>

<div class="turn" aria-label="Turn your phone sideways"><div class="phone"></div></div>
<div class="next" id="next"><div><h2 id="nextH"></h2><p id="nextP"></p><button id="back">Back to the title</button></div></div>
<audio id="music" src="../../../public/a/m/title.mp3" preload="none" loop></audio>
<nav class="mock" id="mock">
  <a href="?state=first">first launch</a><a href="?state=returning">one child</a><a href="?state=several">six children</a><a href="?state=several&amp;sheet=open">shelf</a>
</nav>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const state = q.get("state") || "first";
  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  if (q.get("shot")) document.body.classList.add("shot");
  if (q.get("force") === "hover") stage.classList.add("force-hover");
  if (q.get("force") === "press") stage.classList.add("force-press");
  document.querySelectorAll(".mock a").forEach((a) => a.classList.toggle("on", location.search.replace(/&?shot=1/, "").replace(/^\?$/, "") === a.getAttribute("href").replace(/&amp;/g, "&") || (!location.search && a.getAttribute("href") === "?state=first")));
  const PUB = "../../../public/a/";
  const W = 1280, H = 720;

  // ---------- fit: the game's Stage rule (touch keeps 10 px top, 26 px bottom, 8 px sides), then the art covers the screen
  const HEART = { x: 640, y: 482 }, ART = { x0: -300.5, x1: 1579.8, y0: -46, y1: 841 };
  function fit() {
    const cs = getComputedStyle(document.documentElement);
    const inset = (v) => parseFloat(cs.getPropertyValue(v)) || 0;
    const touch = matchMedia("(pointer: coarse)").matches;
    const top = Math.max(inset("--sat"), touch ? 10 : 0), bottom = Math.max(inset("--sab"), touch ? 26 : 0);
    const left = Math.max(inset("--sal"), touch ? 8 : 0), right = Math.max(inset("--sar"), touch ? 8 : 0);
    const aw = innerWidth - left - right, ah = innerHeight - top - bottom;
    const s = Math.min(aw / W, ah / H);
    stage.style.left = `${left + aw / 2}px`;
    stage.style.top = `${top + ah / 2}px`;
    stage.style.transform = `scale(${s}) translate(-50%, -50%)`;
    // the screen, in stage px
    const ox = left + aw / 2 - (W / 2) * s, oy = top + ah / 2 - (H / 2) * s;
    const wx0 = -ox / s, wx1 = (innerWidth - ox) / s, wy0 = -oy / s, wy1 = (innerHeight - oy) / s;
    // taller or wider than any phone (a tablet, a desktop window): grow the art about the heart until it covers
    const k = Math.max(1, (HEART.x - wx0) / (HEART.x - ART.x0), (wx1 - HEART.x) / (ART.x1 - HEART.x), (HEART.y - wy0) / (HEART.y - ART.y0), (wy1 - HEART.y) / (ART.y1 - HEART.y));
    $("key").style.transform = k > 1.001 ? `scale(${k.toFixed(4)})` : "";
    window.__fit = { s, world: [wx0, wy0, wx1, wy1].map((v) => Math.round(v)), artScale: +k.toFixed(3) };
  }
  fit();
  addEventListener("resize", fit);

  // ---------- players (the game: profilesApi.list(), .current(); NAME_COLOURS as in Profiles.tsx)
  const NAME_COLOURS = ["#ffc53d", "#8fd16a", "#6cc6f0", "#ff9ec0", "#b99cff", "#ffa46b"];
  const colourOf = (name) => NAME_COLOURS[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % NAME_COLOURS.length];
  const P = {
    maya: { name: "Maya", hero: "suki" }, leo: { name: "Leo", hero: "kai" }, ava: { name: "Ava", hero: null },
    theo: { name: "Theo", hero: "kai" }, isabella: { name: "Isabella", hero: "suki" }, sam: { name: "Sam", hero: null },
  };
  let players = state === "first" ? [] : state === "returning" ? ["maya"] : ["maya", "leo", "ava", "theo", "isabella", "sam"];
  if (q.get("who") && P[q.get("who")]) players = [q.get("who"), ...players.filter((p) => p !== q.get("who"))];
  let cur = players[0] || null;
  const faceHTML = (id) => {
    const p = P[id];
    return p.hero ? `<span class="face" style="--pc:${colourOf(p.name)};background-image:url(art/face-${p.hero}.webp)"></span>`
                  : `<span class="face" style="--pc:${colourOf(p.name)}">${[...p.name][0]}</span>`;
  };

  // ---------- the cast: the child's own ninja in front on the left with their name; the other hero across the gate
  const cast = q.get("cast") || "flank";
  function renderCast(swap) {
    const own = cur && P[cur].hero; // null on first launch, or for a child who hasn't chosen yet
    const L = (who, pose, o) => `<div class="hero ${o.cls || ""}" style="left:${o.x}px;width:${o.w}px;--gx:${o.gx}px;--gy:${o.gy || -60}px;--spin:${o.spin || "-8deg"};--in:${o.in}s">
      <div class="land"><div class="shadow"></div><div class="bob"><img src="${PUB}i/hero_${who}_${pose}.webp" alt="" /></div>${o.sign ? `<div class="sign">${o.sign}</div>` : ""}</div></div>`;
    let html;
    if (cast === "left") {
      html = own
        ? L(own === "kai" ? "suki" : "kai", "cheer", { x: 20, w: 214, gx: 520, in: 0.42, cls: "second" }) + L(own, "ready", { x: 150, w: 280, gx: 330, in: 0.3, cls: "me" + (swap ? " swap" : ""), sign: P[cur].name })
        : L("suki", "jump", { x: 14, w: 232, gx: 540, in: 0.42, cls: "leap second" }) + L("kai", "cheer", { x: 190, w: 252, gx: 330, in: 0.3 });
    } else {
      html = own
        ? L(own, "ready", { x: 112, w: 322, gx: 350, in: 0.3, cls: "me" + (swap ? " swap" : ""), sign: P[cur].name }) + L(own === "kai" ? "suki" : "kai", "cheer", { x: 858, w: 232, gx: -300, spin: "8deg", in: 0.42, cls: "flip second" })
        : L("kai", "cheer", { x: 176, w: 256, gx: 330, in: 0.3 }) + L("suki", "jump", { x: 852, w: 240, gx: -300, spin: "8deg", in: 0.42, cls: "flip leap second" });
    }
    $("cast").innerHTML = html;
  }
  renderCast();

  // ---------- grown-ups: the chip (who's playing) and the gear (hold 2 s). Neither exists on first launch.
  const cog = `<svg class="cog" viewBox="0 0 48 48" aria-hidden="true"><path fill="#5a4636" stroke="#2b1d14" stroke-width="2.5" stroke-linejoin="round" d="M20.6 4h6.8l1.1 5.2a15 15 0 0 1 3.9 2.3l5-1.7 3.4 5.9-4 3.5a15 15 0 0 1 0 4.5l4 3.5-3.4 5.9-5-1.7a15 15 0 0 1-3.9 2.3L27.4 44h-6.8l-1.1-5.2a15 15 0 0 1-3.9-2.3l-5 1.7-3.4-5.9 4-3.5a15 15 0 0 1 0-4.5l-4-3.5 3.4-5.9 5 1.7a15 15 0 0 1 3.9-2.3z"/><circle cx="24" cy="24" r="6.5" fill="#fffdf3" stroke="#2b1d14" stroke-width="2.5"/></svg>`;
  const swapIc = `<svg class="swap-ic" viewBox="0 0 40 40" aria-hidden="true"><path d="M8 14h20l-5-5M32 26H12l5 5" fill="none" stroke="#5a4636" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  function renderGU() {
    if (!cur) { $("gu").innerHTML = ""; return; }
    const others = players.filter((p) => p !== cur);
    const stack = [cur, ...others.slice(0, 2)].map((id, i) => faceHTML(id).replace('style="', `style="z-index:${3 - i};`)).join("");
    const more = others.length > 2 ? `<span class="more">+${others.length - 2}</span>` : "";
    $("gu").innerHTML = `<button class="chip" id="chip" aria-label="Who's playing? ${P[cur].name}"><span class="stack">${stack}</span>${more}${swapIc}</button>
      <button class="gear" id="gear" aria-label="Grown-ups (press and hold)">${cog}<svg class="prog" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/></svg></button><span class="hold-hint" id="hint">Grown-ups: press and hold</span>`;
    $("chip").addEventListener("pointerdown", (e) => { e.stopPropagation(); unlock(); wake(); openShelf(); });
    const gear = $("gear");
    let t = 0, at = 0;
    gear.addEventListener("pointerdown", (e) => {
      e.stopPropagation(); unlock(); wake(); at = Date.now(); gear.classList.add("holding"); clip("l/grownups.mp3");
      t = setTimeout(() => { gear.classList.remove("holding"); showNext("The grown-ups page", `Settings for ${P[cur].name}: music, captions, school year. Its way out returns to the title.`); }, 2000);
    });
    const end = () => { clearTimeout(t); gear.classList.remove("holding"); if (at && Date.now() - at < 1900) { $("hint").classList.add("on"); setTimeout(() => $("hint").classList.remove("on"), 2600); } at = 0; };
    gear.addEventListener("pointerup", end); gear.addEventListener("pointercancel", end); gear.addEventListener("pointerleave", end);
    if (q.get("gear") === "hint") $("hint").classList.add("on");
    if (q.get("gear") === "hold") gear.classList.add("holding");
  }
  function renderShelf() {
    $("row").innerHTML = players.map((id) => `<button class="card ${id === cur ? "cur" : ""}" data-id="${id}">${faceHTML(id)}<span class="nm">${P[id].name}</span></button>`).join("")
      + `<button class="card add" data-id="+"><span class="face">+</span><span class="nm">New ninja</span></button>`;
  }
  function openShelf() { renderShelf(); $("shelf").classList.add("open"); }
  $("shelf").addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    const card = e.target.closest(".card");
    if (!card) { $("shelf").classList.remove("open"); return; }
    const id = card.dataset.id;
    if (id === "+") { showNext("What's your name?", "A new player: the name screen (“A grown-up can help type it.”), then the film and Choose."); return; }
    card.classList.add("hopping");
    setTimeout(() => {
      $("shelf").classList.remove("open");
      if (id !== cur) { cur = id; renderGU(); renderCast(true); }
      nudge(); // own face or a sibling: the shelf closes and Play hops; it never starts the game
    }, 480);
  });
  renderGU();
  if (q.get("sheet") === "open") openShelf();

  // ---------- sound: the first tap anywhere unlocks; the title music streams through <audio>, never decoded (PERF.md fix 5)
  let unlocked = false, ac = null;
  function unlock() {
    if (unlocked) return; unlocked = true;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
    const m = $("music"); m.volume = 0.5; m.play().catch(() => {});
  }
  function tone(f, dur, o = {}) {
    if (!ac) return; const t = ac.currentTime + (o.delay || 0);
    const osc = ac.createOscillator(), g = ac.createGain(); osc.type = o.type || "sine"; osc.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(o.vol || 0.2, t + (o.attack || 0.01)); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    osc.connect(g).connect(ac.destination); osc.start(t); osc.stop(t + dur + 0.05);
  }
  const sfx = { // the game's own synths (engine/audio.ts): the gong, a whoosh stand-in, the petal chime
    gong: () => [110, 220.5, 331, 443].forEach((f, i) => tone(f, 3.2 - i * 0.5, { vol: 0.25 / (i + 1), attack: 0.005 })),
    petal: () => [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, 0.4, { vol: 0.08, delay: i * 0.06 })),
    whoosh: () => [300, 600, 1200].forEach((f, i) => tone(f, 0.3, { type: "triangle", vol: 0.04, delay: i * 0.04 })),
  };
  let speaking = null;
  const clip = (name) => { if (!unlocked) return null; const a = new Audio(PUB + name); a.play().catch(() => {}); return a; };
  function say(line, text, ms = 2600) {
    if (speaking) speaking.pause();
    speaking = clip(`l/${line}.mp3`);
    $("help").classList.add("talking");
    const c = $("caption"); c.textContent = text; c.classList.toggle("on", !!q.get("captions"));
    clearTimeout(say.t); say.t = setTimeout(() => { $("help").classList.remove("talking"); c.classList.remove("on"); }, ms);
  }

  // ---------- Help: Sensei (the coin) says the title's line, and Play hops as she says it
  $("help").addEventListener("pointerdown", (e) => { e.stopPropagation(); unlock(); wake(); say("help_start", "Tap the big green button to start!", 2600); setTimeout(nudge, 900); });
  if (q.get("help")) { $("help").classList.add("talking"); if (q.get("captions")) { $("caption").textContent = "Tap the big green button to start!"; $("caption").classList.add("on"); } }

  // ---------- idle: Play hops at 8 s and then every 14 s; the paw joins at 16 s; Sensei asks once sound is on (twice at most).
  // Timers only, never rAF. After 30 s untouched the scenery sleeps (animation-play-state), Play keeps breathing.
  let idleT = 0, pawT = 0, sleepT = 0, idleN = 0;
  function nudge() {
    for (const [id, c] of [["playBob", "nudge"], ["board", "clack"]]) { const b = $(id); b.classList.remove(c); void b.offsetWidth; b.classList.add(c); }
  }
  function idle() {
    clearTimeout(idleT); clearTimeout(pawT); clearTimeout(sleepT);
    idleT = setTimeout(function tick() {
      nudge();
      if (unlocked && idleN < 2) say("tap_start", "Tap to start!", 1600);
      idleN++; idleT = setTimeout(tick, 14000);
    }, 8000);
    pawT = setTimeout(() => $("paw").classList.add("on"), 16000);
    sleepT = setTimeout(() => stage.classList.add("sleep"), 30000);
  }
  function wake() { $("paw").classList.remove("on"); stage.classList.remove("sleep"); idle(); }
  idle();
  if (q.get("paw")) $("paw").classList.add("on");
  if (q.get("nudge")) nudge();
  if (q.get("sleep")) stage.classList.add("sleep");

  // ---------- Start. One tap, once: Play starts on pointerdown (the treadmill presses it that way); the rest of the scene
  // starts on a short tap (up within 450 ms, moved under 12 px), so a thumb gripping the phone's edge never starts it.
  let going = false;
  window.__starts = 0;
  const play = $("play");
  play.addEventListener("pointerdown", (e) => { e.stopPropagation(); play.classList.add("pressing"); start("play"); });
  addEventListener("pointerup", () => play.classList.remove("pressing"));
  let down = null;
  stage.addEventListener("pointerdown", (e) => { unlock(); wake(); down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId }; });
  stage.addEventListener("pointerup", (e) => {
    const d = down; down = null;
    if (!d || d.id !== e.pointerId || e.target.closest("button, .shelf")) return;
    if (performance.now() - d.t <= 450 && Math.hypot(e.clientX - d.x, e.clientY - d.y) <= 12) start("scene");
  });
  function start(from) {
    if (going || $("shelf").classList.contains("open")) return; going = true;
    window.__starts++; window.__startFrom = from;
    unlock(); sfx.gong(); setTimeout(sfx.whoosh, 80); setTimeout(sfx.petal, 260);
    clearTimeout(idleT); clearTimeout(pawT); clearTimeout(sleepT); $("paw").classList.remove("on"); stage.classList.remove("sleep");
    const b = $("burst");
    // the game: fx.burst(640, 486, "blossoms", 36, 1.6) and fx.twinkle(...) on the effects canvas (rAF only during the burst)
    b.innerHTML = Array.from({ length: 22 }, (_, i) => {
      const a = (i / 22) * Math.PI * 2 + Math.random() * 0.3, d = 280 + Math.random() * 260;
      const kid = i % 3 === 2 ? `<i class="spark" style="position:absolute;opacity:1;animation:none;left:0;top:0"></i>` : `<i class="blossom"></i>`;
      return `<div class="bp" style="--dx:${(Math.cos(a) * d).toFixed(0)}px;--dy:${(Math.sin(a) * d).toFixed(0)}px;--rot:${(Math.random() * 720 - 360).toFixed(0)}deg">${kid}</div>`;
    }).join("");
    stage.classList.add("going");
    if (!q.get("hold")) setTimeout(() => {
      if (!cur) showNext("What's your name?", "First launch: the name screen (“A grown-up can help type it.”), then the film, Choose and the Dojo.");
      else showNext(`${P[cur].name}'s adventure`, `One tap: straight on as ${P[cur].name} (afterLaunch(): the map with its welcome, or the next lesson). A brother or sister switches first with the faces, top left.`);
    }, 1050);
  }
  function showNext(h, p) { $("nextH").textContent = h; $("nextP").textContent = p; $("next").classList.add("on"); }
  $("back").addEventListener("click", () => location.reload());
  if (q.get("go")) setTimeout(() => start("test"), +q.get("go"));
  window.__snState = { scene: "title" };
})();
</script>
</body>
</html>
